    profile and leave the kiosk waiting for it to close. */
 {a:'reload', name:'Reload the app', short:'Reload', sub:'THIS PAGE ONLY · INSTANT',
  /* Two arcs, not one: Desktop is the monitor and Reboot is the single
     loop, and at 52px on a tile all three sit in the same eyeline. */
  ico:'<path d="M20.5 11A8.5 8.5 0 0 0 6.3 6.3L3.5 9"/><path d="M3.5 4.5V9h4.5"/>'
     +'<path d="M3.5 13a8.5 8.5 0 0 0 14.2 4.7l2.8-2.7"/><path d="M20.5 19.5V15H16"/>',
  ask:'Reloads the helm app where it stands. The kiosk is left exactly as '
     +'it is and nothing else on the Pi is touched.'},
 {a:'helper',  name:'Restart helper',  short:'Helper', sub:'RADIO CONTROLS · COMES BACK ITSELF',
  ico:'<rect x="5" y="5" width="14" height="14" rx="3"/>'
     +'<circle class="f" cx="12" cy="12" r="2.2"/>',
  ask:'The WiFi, Bluetooth and power controls disappear for a few seconds '
     +'while netd restarts. The instruments carry on.'},
 /* Only in cage mode, where there is no desktop running and this is the
    only way to ask for one. netd hides it otherwise - on a normal
    desktop session it would just throw you at the login screen. */
 {a:'desktop', name:'Desktop',         short:'Desktop', sub:'LEAVE THE KIOSK · THE KIOSK TILE COMES BACK',
  need:'power.desktop',
  ico:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
  ask:'Starts the desktop and switches the screen to it, shrunk to the '
     +'biggest square that fits inside the round panel so all four '
     +'corners are reachable. The helm app keeps running behind it as a '
     +'window, and this tile turns into "Back to the kiosk".'},
 /* The exact mirror of the tile above, and only ever one of the two is
    shown: netd offers 'desktop' when no desktop is running and 'cage'
    when one is. Before this existed, leaving the kiosk was a one-way
    door - the way back was a reboot, or SSH, neither of which you have
    at the wheel. The arrows point INWARD, the same glyph the FULL/KIOSK
    tile uses for the same idea. */
 {a:'cage',    name:'Back to the kiosk', short:'Kiosk', sub:'FULL SCREEN · NO DESKTOP',
  need:'power.cage',
  ico:'<path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6"/>',
  ask:'Puts the desktop back to the full panel, stops it, and returns to '
     +'the kiosk. The windowed app closes with it and the instruments '
     +'come straight back. If the kiosk does not come up, the desktop is '
     +'put back rather than leaving you with a black screen.'},
 {a:'reboot',  name:'Reboot',          short:'Reboot', sub:'THE WHOLE PI · ABOUT A MINUTE', danger:1,
  ico:'<path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 3v4.4h-4.4"/>',
  ask:'Instruments, charts and the hotspot all go down for about a minute. '
     +'Anything joined to the boat WiFi drops with it.'},
 {a:'poweroff',name:'Shut down',       short:'Shut down', sub:'THEN WAIT FOR THE LED', danger:1,
  ico:'<path d="M12 3.4v8.2"/><path d="M6.9 6.7a8 8 0 1 0 10.2 0"/>',
  ask:'Everything goes down. Wait for the green LED to stop blinking '
     +'before cutting power - pulling it early is how the card gets '
     +'corrupted.'},
];

/* How long the Pi has been up. "UP 3D 4H" is uptime(1) shorthand and
   this sheet is read by someone who has never met that command. */
const runtimeTxt=()=>'DEVICE RUNTIME: '+(((NET.st&&NET.st.power)||{}).uptime||'?').toUpperCase();

/* four bars, dimmed above the level - the same glyph everyone reads */
function bars(sig){
  const lvl = sig>=70?4 : sig>=50?3 : sig>=28?2 : sig>0?1:0;
  let o='';
  for(let i=0;i<4;i++){
    const h=8+i*7;
    o+='<rect x="'+(i*9)+'" y="'+(32-h)+'" width="6" height="'+h+'" rx="2" '
      +'fill="currentColor" opacity="'+(i<lvl?1:0.22)+'"/>';
  }
  return '<svg class="bars" viewBox="0 0 34 34">'+o+'</svg>';
}
const AP_GLYPH='<svg class="bars" viewBox="0 0 24 24" fill="none" '
  +'stroke="currentColor" stroke-width="2" stroke-linecap="round" '
  +'stroke-linejoin="round"><rect x="4" y="13.6" width="16" height="6.6" rx="2.2"/>'
  +'<path d="M9.2 10.3a5.6 5.6 0 0 1 5.6 0"/>'
  +'<path d="M6.6 6.7a10.5 10.5 0 0 1 10.8 0"/></svg>';
const BT_GLYPH='<svg class="bars" viewBox="0 0 24 24" fill="none" '
  +'stroke="currentColor" stroke-width="2" stroke-linecap="round" '
  +'stroke-linejoin="round"><path d="M7 7.5l10 9-5 4.5V3l5 4.5-10 9"/></svg>';

/* Some actions only exist in some setups. Filtering has to happen in ONE
   place: the rows carry their index into this list, and the tap handler
   reads it back, so a render and a lookup that disagree would fire the
   wrong action. */
/* `need` is a dotted path into /status, not a key of power - the screen
   tiles read NET.st.fit and the rest read NET.st.power, and one resolver
   keeps the filtering in the single place the comment above demands. */
const stAt=path=>path.split('.').reduce((o,k)=>(o||{})[k], NET.st||{});
const powerActions=()=>POWER_ACTIONS.filter(p=>!p.need || stAt(p.need));

function renderRows(){
  const box=$('ns-list'), wifi=NET.kind==='wifi';
  if(NET.kind==='power'){
    /* The index is into powerActions(), not into either tier, because
       that is what netTap() reads back. Splitting the render without
       splitting the numbering is how the wrong action gets fired. */
    const acts=powerActions();
    const tile=(p,i)=>
      '<button class="pw-tile'+(p.danger?' danger':'')+'" data-i="'+i+'">'
      +'<svg viewBox="0 0 24 24">'+p.ico+'</svg><b>'
      +(p.short||p.name)+'</b></button>';
    const safe=[], risk=[];
    acts.forEach((p,i)=>(p.danger?risk:safe).push(tile(p,i)));
    box.classList.add('tiers');
    box.innerHTML='<div class="pw-tier">'+safe.join('')+'</div>'
      +(risk.length?'<div class="pw-tier low">'+risk.join('')+'</div>':'');
    $('ns-count').textContent='';
    return;
  }
  box.classList.remove('tiers');          /* radios use the fixed window */
  $('ns-sw').classList.toggle('on',!!NET.powered);
  $('ns-scan').textContent = wifi ? 'SCAN' : (NET.scanning?'SCANNING':'SCAN');
  /* A live-looking arrow that does nothing is worse than a dim one. */
  $('ns-up')  .classList.toggle('dim', NET.page<=0);
  $('ns-down').classList.toggle('dim', (NET.page+1)*PAGE>=NET.rows.length);
  if(!NET.powered){
    box.innerHTML='<div class="ns-empty">'
      +(wifi?'THIS ADAPTER IS OFF':'BLUETOOTH IS OFF')+'</div>';
    $('ns-count').textContent=''; return; }
  if(!NET.rows.length){
    box.innerHTML='<div class="ns-empty">'
      +(wifi?'NO NETWORKS IN RANGE':'NOTHING FOUND YET<br>TAP SCAN')+'</div>';
    $('ns-count').textContent=''; return; }
  const pages=Math.max(1,Math.ceil(NET.rows.length/PAGE));
  const from=NET.page*PAGE;
  box.innerHTML=NET.rows.slice(from,from+PAGE)
    .map((r,i)=>rowHtml(r,from+i,wifi)).join('');
  $('ns-count').textContent = pages>1 ? (NET.page+1)+' / '+pages
                                      : NET.rows.length+(wifi?' NETWORKS':' DEVICES');
}

function rowHtml(r,idx,wifi){
  const live = wifi ? r.active : r.connected;
  const hot  = wifi && r.active && NET.ap;      /* our own hotspot, not a network we joined */
  const sub  = wifi
    ? (hot ? 'HOTSPOT · THE BOAT IS ON THIS'
           : r.active ? 'CONNECTED · '+r.signal+'%'
           : (r.saved?'SAVED · ':'')+(r.secure?'SECURED':'OPEN')+' · '+r.signal+'%')
    : (r.connected?'CONNECTED':(r.paired?'PAIRED':'AVAILABLE'));
  /* ✕ only on things the Pi remembers - and never on the running
     hotspot, where it would delete the profile the boat runs on. */
  const known = (wifi ? r.saved : r.paired) && !hot;
  return '<div class="ns-row'+(live?' live':'')+'" data-i="'+idx+'">'
    +(hot?AP_GLYPH:(wifi?bars(r.signal):BT_GLYPH))
    +'<div class="ns-main"><div class="ns-name">'+esc(wifi?r.ssid:r.name)+'</div>'
    +'<div class="ns-sub">'+sub+'</div></div>'
    +(known?'<button class="mini" data-forget="'+idx+'">✕</button>':'')
    +'</div>';
}

/* ---- doing things ---- */
async function netDo(label,path,body){
  NET.busy=label; setMsg(label+'…');
  const j=await netApi(path,body||{});
  NET.busy='';
  if(!j)         setMsg('HELPER NOT ANSWERING',true);
  else if(!j.ok) setMsg(j.error||'FAILED',true);
  else           setMsg('');
  await netStatus();
  await netRefresh();
  return !!(j&&j.ok);
}

/* Anything that would take the hotspot down gets a second tap. Every
   phone, tablet and laptop aboard is on it - including, quite often,
   the one you would use to put it back. */
function needsConfirm(key,words){
  if(!NET.ap) return false;
  if(NET.confirm===key){ NET.confirm=''; clearTimeout(NET.confirmT); return false; }
  NET.confirm=key;
  clearTimeout(NET.confirmT);
  NET.confirmT=setTimeout(()=>{ NET.confirm=''; setMsg(''); },6000);
  setMsg(words,true);
  return true;
}

function netTap(i){
  if(NET.kind==='power'){ return showAsk(true,powerActions()[i]); }
  const r=NET.rows[i]; if(!r||NET.busy) return;
  const dev=NET.dev?NET.dev.dev:'';
  if(NET.kind==='wifi'){
    if(r.active){
      if(needsConfirm('off:'+r.ssid,'TAP AGAIN TO STOP THE HOTSPOT')) return;
      return netDo('STOPPING '+r.ssid,'/wifi/disconnect',{dev:dev});
    }
    if(needsConfirm('join:'+r.ssid,'TAP AGAIN · THIS DROPS THE HOTSPOT')) return;
    /* A saved profile already carries its key, and an open network has
       none to carry - either way there is nothing to type. */
    if(r.saved||!r.secure)
      return netDo('JOINING '+r.ssid,'/wifi/connect',{dev:dev,ssid:r.ssid});
    return showPw(true,r.ssid);
  }
  if(r.connected) return netDo('DISCONNECTING','/bt/disconnect',{mac:r.mac});
  netDo((r.paired?'CONNECTING TO ':'PAIRING ')+r.name,'/bt/connect',{mac:r.mac});
}

function netForget(i){
  const r=NET.rows[i]; if(!r||NET.busy) return;
  if(NET.kind==='wifi') netDo('FORGETTING '+r.ssid,'/wifi/forget',{ssid:r.ssid});
  else                  netDo('UNPAIRING '+r.name,'/bt/forget',{mac:r.mac});
}

$('conn-sec').addEventListener('click',e=>{
  const btn=e.target.closest('.cbtn'); if(!btn) return;
  e.stopPropagation();
  openNet(btn.dataset.k, btn.dataset.dev);
});
$('ns-list').addEventListener('click',e=>{
  const f=e.target.closest('[data-forget]');
  if(f) return netForget(+f.dataset.forget);
  const hit=e.target.closest('.ns-row,.pw-tile');
  if(hit) netTap(+hit.dataset.i);
});
$('ns-done')  .addEventListener('click',closeNet);
$('ns-up')  .addEventListener('click',()=>{ if(NET.page>0){NET.page--;renderRows();} });
$('ns-down').addEventListener('click',()=>{
  if((NET.page+1)*PAGE<NET.rows.length){ NET.page++; renderRows(); } });
$('ns-scan').addEventListener('click',()=>{
  if(NET.busy||!NET.powered) return;
  setMsg('SCANNING…');
  if(NET.kind==='wifi'){ netRefresh(true); }
  else netApi('/bt/scan',{}).then(()=>{ NET.scanning=true; renderRows(); netTick(); });
});
$('ns-sw').addEventListener('click',()=>{
  if(NET.busy) return;
  const on=!NET.powered;
  if(!on && NET.kind==='wifi'
     && needsConfirm('sw','TAP AGAIN TO STOP THE HOTSPOT')) return;
  NET.powered=on; NET.rows=[]; NET.page=0; renderRows();   /* answer the touch now */
  netDo(on?'TURNING ON':'TURNING OFF',
        NET.kind==='wifi'?'/wifi/power':'/bt/power',
        NET.kind==='wifi'?{dev:NET.dev?NET.dev.dev:'',on:on}:{on:on});
});

/* ---- password entry ----
   Rendered from a table rather than written out as markup: the shift
   and symbol layers are the same keyboard with different faces, and
   two hand-written copies of it would drift apart. */
const KB_ABC=['1234567890','qwertyuiop','asdfghjkl','zxcvbnm'];
const KB_SYM=['1234567890','-/:;()$&@"','.,?!\'+=#%*','_\\|~<>[]{}'];

function showPw(on,ssid){
  $('ns-list-view').style.display = on?'none':'';
  $('ns-pw-view')  .style.display = on?'':'none';
  if(!on){ NET.pw=null; return; }
  NET.pw={ssid:ssid,val:'',shift:false,sym:false};
  $('pw-for').textContent='Password for '+ssid;
  setMsg(''); paintPw(); drawKb();
}
function paintPw(){
  const v=NET.pw?NET.pw.val:'';
  /* Shown in the clear deliberately. Typing a 20-character WPA key
     blind, on a wet 5-inch panel, is how you get three failed joins
     and no idea which character was wrong. */
  $('pw-txt').textContent = v.length>24 ? '…'+v.slice(-24) : v;
}
function drawKb(){
  const rows=NET.pw.sym?KB_SYM:KB_ABC, up=NET.pw.shift&&!NET.pw.sym;
  let o=rows.map(row=>'<div class="kb-r">'+row.split('').map(c=>{
      const ch=up?c.toUpperCase():c;
      return '<button class="kk" data-c="'+esc(ch)+'">'+esc(ch)+'</button>';
    }).join('')+'</div>').join('');
  o+='<div class="kb-r">'
    +'<button class="kk fn" data-a="sym">'+(NET.pw.sym?'ABC':'?123')+'</button>'
    +(NET.pw.sym?'':'<button class="kk fn'+(NET.pw.shift?' on':'')
                   +'" data-a="shift">⇧</button>')
    +'<button class="kk sp" data-c=" "></button>'
    +'<button class="kk fn" data-a="del">⌫</button>'
    +'<button class="kk go" data-a="join">JOIN</button></div>';
  $('kb').innerHTML=o;
}
$('kb').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||!NET.pw) return;
  const c=b.dataset.c, a=b.dataset.a;
  if(c!==undefined){
    if(NET.pw.val.length<63) NET.pw.val+=c;      /* WPA's own ceiling */
    paintPw();
    if(NET.pw.shift){ NET.pw.shift=false; drawKb(); }   /* shift is one key deep */
    return;
  }
  if(a==='shift'){ NET.pw.shift=!NET.pw.shift; return drawKb(); }
  if(a==='sym')  { NET.pw.sym=!NET.pw.sym; NET.pw.shift=false; return drawKb(); }
  if(a==='del')  { NET.pw.val=NET.pw.val.slice(0,-1); return paintPw(); }
  if(a==='join') return pwJoin();
});
$('pw-cancel').addEventListener('click',()=>{ showPw(false); setMsg(''); });

/* ---- the confirm screen ----
   Three views share the sheet - the list, the keyboard and this - and
   only one is ever up. */
function showAsk(on,act){
  $('ns-ask-view') .style.display = on?'':'none';
  $('ns-list-view').style.display = on?'none':'';
  if(!on){ NET.ask=null; return; }
  NET.ask=act;
  $('ask-title').textContent=act.name+'?';
  $('ask-body') .textContent=act.ask;
  setMsg('');
}
$('ask-no') .addEventListener('click',()=>{ showAsk(false); setMsg(''); });
$('ask-yes').addEventListener('click',askYes);

async function askYes(){
  const act=NET.ask; if(!act||NET.busy) return;
  /* Handled here rather than by the helper: the page is the thing being
     reloaded, and it is right in front of us. */
  if(act.a==='reload'){
    setMsg('RELOADING…');
    return setTimeout(()=>location.reload(),300);
  }
  const heavy = act.a==='poweroff' || act.a==='reboot';
  NET.busy=act.name; setMsg(act.name.toUpperCase()+'…');
  const j=await netApi('/power/do',{action:act.a});
  NET.busy='';
  /* A shutdown takes the helper down with everything else, so silence is
     the success case. Saying HELPER NOT ANSWERING there would read as a
     failure at the exact moment it worked. */
  if(!j) return setMsg(heavy?'GOING DOWN…':'NO ANSWER', !heavy);
  if(!j.ok) return setMsg(j.error||'FAILED',true);
  /* A resize is the one action whose result you cannot judge from the
     helper's answer - you have to look at the screen. netd has already
     armed a revert, so the sheet turns into the question that revert is
     asking anyway, with the clock running. Do nothing and it goes back. */
  setMsg(act.a==='poweroff'?'SHUTTING DOWN…':act.a==='reboot'?'REBOOTING…':'DONE');
  if(!heavy) setTimeout(()=>{ showAsk(false); setMsg(''); },1400);
}

async function pwJoin(){
  const pw=NET.pw; if(!pw||NET.busy) return;
  if(pw.val.length<8) return setMsg('WPA KEYS ARE 8 CHARACTERS OR MORE',true);
  const ok=await netDo('JOINING '+pw.ssid,'/wifi/connect',
                       {dev:NET.dev?NET.dev.dev:'', ssid:pw.ssid, psk:pw.val});
  /* A refusal keeps the keyboard up with what you typed still in it. It
     is nearly always one wrong character, not the wrong password. */
  if(ok) showPw(false);
}

/* ==================================================================
   TOUCH LOCK
   Spray and rain generate touches on capacitive glass, and a wave
   should not be able to change the shallow alarm or drop the hotspot.
   The overlay swallows every pointer event and paints nothing over the
   instruments: locked is read-only, not blank - you still need to see
   depth and speed while the boat is being rained on.

   Unlocking is a two-second hold rather than a tap, because a hold is
   the one gesture weather cannot produce. It does not survive a reload:
   being locked out by a crash would be worse than the problem.
   ================================================================== */
const HOLD_MS=2000, RING_C=3292.4;
let holdRaf=null, holdAt=0, holdFn=null;
const locked=()=>$('lock').classList.contains('on');

/* One hold, both directions. Locking and unlocking are the same
   deliberate two seconds, drawn as the same ring round the same bezel,
   so there is nothing to learn twice. */
function holdCancel(){
  cancelAnimationFrame(holdRaf); holdRaf=null; holdFn=null;
  $('ring').classList.remove('on');
  $('ring-c').style.strokeDashoffset=String(RING_C);
}
function holdStart(fn){
  holdCancel();
  holdFn=fn; holdAt=Date.now();
  $('ring').classList.add('on');
  const step=()=>{
    if(!holdFn) return;
    const p=Math.min(1,(Date.now()-holdAt)/HOLD_MS);
    $('ring-c').style.strokeDashoffset=String(RING_C*(1-p));
    if(p>=1){ const f=holdFn; holdCancel(); return f(); }
    holdRaf=requestAnimationFrame(step);
  };
  holdRaf=requestAnimationFrame(step);
}
/* These sit on top of the gesture handler and used to stopPropagation
   the pointerdown, so a hold that wandered a few pixels could not read
   as a swipe. It also meant #stage never saw the touch at all, and the
   lock - at the bottom centre of the dial, exactly where a thumb goes
   to pull the dock up - was a dead band no swipe could start in.
   So the touch is claimed instead of swallowed, and the claim is marked
   as one that gives way: travel past the tap threshold releases it and
   cancels the hold, and the swipe is judged normally. A finger that
   stays put still holds, and still owns the gesture.
   pointerup no longer stops propagation either, and never needed to:
   endGesture listens on window in the CAPTURE phase, which runs before
   any of this. */
function holdBind(el,fn){
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    gClaim(); G.releaseOnDrag=true;
    holdStart(fn); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>
    el.addEventListener(ev,()=>holdCancel()));
}

/* No badge. A HOLD TO UNLOCK card that appeared on every touch was one
   more thing between you and the instruments, and it was telling you
   something the padlock glyph at the foot of each page already says.
   The overlay is transparent on purpose: locked means read-only, not
   blank, so the readings stay legible and the shut padlock is the whole
   explanation. */
function lockOn(){ $('lock').classList.add('on'); paintLocks(); }
function lockOff(){
  $('lock').classList.remove('on'); paintLocks();
  ssStop();                    /* the hold was a touch; do not leave the saver up */
  lastTouch=Date.now();
}

/* The glyphs are state, not instruction - and the lock overlay is
   transparent, so all three stay in plain sight while the helm is
   locked. A shackle still hanging open under a locked screen is simply
   wrong, so they are repainted on every change. */
const PAD_OPEN='<path d="M8 11V8a4 4 0 0 1 7.5-1.9"/>'
              +'<rect x="6" y="11" width="12" height="9" rx="2"/>';
const PAD_SHUT='<path d="M8 11V8a4 4 0 0 1 8 0v3"/>'
              +'<rect x="6" y="11" width="12" height="9" rx="2"/>';
function paintLocks(){
  const on=locked(), g=on?PAD_SHUT:PAD_OPEN;
  ['m-lock','t-lock'].forEach(id=>{
    $(id).querySelector('svg').innerHTML=g;
    $(id).classList.toggle('on',on);
  });
  /* the dial's copy is SVG, and its strokes are painted by class */
  $('dial-lock').querySelector('g').innerHTML=
    g.replace(/<path /g,'<path class="lg" ').replace(/<rect /g,'<rect class="lg" ');
  $('dial-lock').classList.toggle('on',on);
}

/* One button per page, always at the foot of it. */
holdBind($('dial-lock'),lockOn);
holdBind($('m-lock'),lockOn);
holdBind($('t-lock'),lockOn);
holdBind($('lock'),lockOff);
paintLocks();

/* ==================================================================
   ALERTS
   One surface for anything that needs attention, so the next thing to
   raise one - anchor drag, low battery, an adapter that vanished - does
   not have to invent its own way of saying so.

   Levels are warn and alarm. Tapping snoozes for ten minutes; the
   condition stays live underneath and says so again when it expires.
   ================================================================== */
const ALERTS={}, ALERT_SNOOZE=10*60e3;

function alertRaise(id,level,text,sub){
  const a=ALERTS[id];
  if(a && a.level===level && a.text===text && a.sub===(sub||'')) return;
  const fresh = !a || a.level!==level;
  ALERTS[id]={ level:level, text:text, sub:sub||'',
               since: fresh?Date.now():a.since,
               ackUntil: fresh?0:a.ackUntil };
  /* An alarm is a reason to wake the screen. A warning is not. */
  if(fresh && level==='alarm') ssStop();
  alertPaint();
}
function alertClear(id){ if(ALERTS[id]){ delete ALERTS[id]; alertPaint(); } }

function alertTop(){
  const now=Date.now(); let best=null;
  Object.keys(ALERTS).forEach(id=>{
    const a=ALERTS[id];
    if(a.ackUntil>now) return;                       /* snoozed */
    if(!best) { best={id:id,a:a}; return; }
    const better = (a.level==='alarm' && best.a.level!=='alarm') ||
                   (a.level===best.a.level && a.since<best.a.since);
    if(better) best={id:id,a:a};
  });
  return best;
}
function alertPaint(){
  const top=alertTop(), el=$('alert');
  el.classList.toggle('on',!!top);
  if(!top) return;
  el.classList.toggle('alarm',top.a.level==='alarm');
  $('al-t').textContent=top.a.text;
  $('al-s').textContent=top.a.sub||'TAP TO SNOOZE';
}
$('alert').addEventListener('click',e=>{
  e.stopPropagation();
  const top=alertTop(); if(!top) return;
  ALERTS[top.id].ackUntil=Date.now()+ALERT_SNOOZE;
  alertPaint();
});
/* A snooze has to be able to expire, and nothing else would repaint. Five
   seconds is far below the ten-minute grain and costs two DOM writes. */
setInterval(alertPaint,5000);

/* ==================================================================
   NOW PLAYING
   Poll the JSON that spotify-now.py writes from the Spotify Web API.
   Position only arrives when the file is rewritten, so it is advanced
   locally against the wall clock in between - the same trick every
   player uses.
   ================================================================== */
const music=$('music');
let NP={playing:false, pos:0, dur:0, at:0, title:'', artist:'', cover:'',
        album:'', id:'', liked:null};

/* Why the music page is empty, when it is. "Nothing playing" is the
   right answer only when the poller is running and Spotify is idle -
   and the two ways it can be wrong used to look exactly like that.
   Neither is rare: cage reads no ~/.config/autostart, so on this Pi
   spotify-now.py runs only because cage-session.sh starts it, and it
   exits immediately with no credentials. */
let FEED='waiting';        /* waiting | ok | missing | offline */
let MUSIC_RAW=null;        /* last JSON the poller served - for diagnosis */

async function pollMusic(){
  try{
    const r=await fetchT('nowplaying.json?_='+Date.now(), 5000);
    /* A 404 is the poller never having written the file - not a network
       problem, and worth saying differently from one. */
    if(!r.ok && FEED!=='missing' && r.status===404){ FEED='missing'; paintMusic(); }
    if(r.ok){
      const wasBad = FEED!=='ok';
      FEED='ok';
      const j=await r.json();
      /* The raw feed, reachable from a console without a network tap:
         `MUSIC_RAW` is whatever nowplaying.json last said. When the page
         shows a title but no clock, this is what settles whether the
         poller is sending position/duration at all. */
      MUSIC_RAW=j;
      /* The poller carried out a press and it was refused - say which.
         "NO ACTIVE DEVICE" is the common one: these endpoints drive
         whatever is really playing, so with nothing active there is
         nothing to drive. */
      if(j.cmderr) musicFlash(j.cmderr);
      /* the poller has caught up with the tap - stop overriding it */
      if(likePend!==null && (typeof j.liked==='boolean') && j.liked===likePend)
        likePend=null;
      if(j.id && NP.id && j.id!==NP.id) likePend=null;   /* different track */
      const changed = wasBad || j.title!==NP.title || j.event!==NP.event
                      || j.album!==NP.album || (j.liked??null)!==NP.liked;
      /* the poller has caught up with the turn - stop overriding it */
      if(volPend!==null && j.volume===volPend) volPend=null;
      NP={ event:j.event, playing:/playing|started|changed/.test(j.event||''),
           pos:j.position||0, dur:j.duration||0, at:j.at||Date.now(),
           id:j.id||'', liked:(typeof j.liked==='boolean')?j.liked:null,
           album:j.album||'',
           /* null, not 0: 0 is a real volume, and the ring has to be able
              to tell "muted" from "I cannot see". */
           volume:(typeof j.volume==='number')?j.volume:null,
           volOk:(typeof j.vol_ok==='boolean')?j.vol_ok:null,
           device:j.device||'',
           /* plain strings: spotify-now.py joins the artist list with
              ", " and the cover is a URL. The .split('\\n')[0] that used
              to be here was for librespot's multi-line values. */
           title:j.title||'', artist:j.artist||'', cover:j.cover||'' };
      if(changed) paintMusic();
      /* Unconditionally, and not folded into `changed`. The play glyph is
         set OPTIMISTICALLY on a press, so it can be showing something the
         feed never agreed with - and `changed` cannot see that, because it
         only compares the feed with itself. Press pause, have it refused,
         and the event never changes: the glyph then sat inverted until the
         track did, telling you to press play while the music played on.
         wAttr writes nothing when the value is the same, so calling this
         every poll costs a map lookup and makes the drift impossible. */
      paintTransport();
      /* Same rule, same reason: it is set optimistically while you turn
         it, so only the feed can be trusted to put it right, and a
         change-detector comparing the feed with itself cannot see the
         difference. */
      paintVolume();
    }
  }catch(e){
    /* Nothing answered at all: AvNav down, the page opened over file://
       (where fetch cannot work), or the request hit its deadline. */
    if(FEED!=='offline'){ FEED='offline'; paintMusic(); }
  }
  setTimeout(pollMusic, 2000);
}

/* ---- the save button ------------------------------------------------
   Optimistic: the mark ticks on the tap, not on the round trip. netd only
   writes a request file - the poller holds the token and carries it out -
   so confirmation is up to a second away, and a button that waited for it
   would feel broken on a boat.

   The cost of being optimistic is that a failure has to be visible, or
   the panel is lying about your library. So a refusal puts the mark back
   and says which refusal it was. */
let likeBusy=false, likePend=null;

function likeAvailable(){
  return !!(NET.st && NET.st.spotify && NET.st.spotify.available) && !!NP.id;
}
/* Transport is a separate permission from the library and can be absent
   on its own - it needs user-modify-playback-state AND an active device
   AND Premium, none of which the library scope implies. netd reports
   whether credentials exist; whether THESE work only shows on a press,
   which is why a refusal has to be shown rather than swallowed. */
function transportAvailable(){
  return !!(NET.st && NET.st.spotify && NET.st.spotify.available);
}
/* The control bar collapses when there is nothing in it to press -
   otherwise a phone, where the loopback helper is unreachable and
   neither the save button nor the transport can do anything, would carry
   an empty 78px band under the progress bar for no reason. */
function paintCtlRow(){
  const row=$('m-ctl'); if(!row) return;
  const any=['m-prev','m-play','m-next','m-like']
    .some(id=>{ const e=$(id); return e && e.style.display!=='none'; });
  wSty('m-ctl','display', any ? 'flex' : 'none');
}

function paintTransport(){
  const show = transportAvailable();
  ['m-prev','m-play','m-next'].forEach(id=>{
    const el=$(id); if(el) el.style.display = show ? '' : 'none';
  });
  paintCtlRow();
  if(!show) return;
  /* One button, two meanings - the glyph is the current ACTION, not the
     current state: a triangle means "this will play". */
  wAttr('m-playico','d', NP.playing ? 'M7 5h3.6v14H7zM13.4 5H17v14h-3.6z'
                                    : 'M8 5l11 7-11 7z');
}

let ctlBusy=false;
async function transport(op){
  if(ctlBusy || !transportAvailable()) return;
  ctlBusy=true;
  /* Optimistic only for play/pause, where the glyph IS the state and a
     wrong guess is corrected within a poll. Never for skip: pretending
     the next track had arrived would mean inventing a title. */
  const was=NP.playing;
  if(op==='play'||op==='pause'){ NP.playing = (op==='play'); paintTransport(); }
  const j=await netApi('/spotify/control',{op:op});
  ctlBusy=false;
  if(!j || !j.ok){
    /* Put the guess back. Without this the glyph stayed inverted after a
       refusal - and since the button sends play or pause according to
       NP.playing, the next press would have asked for the wrong one. */
    NP.playing=was;
    paintTransport();
    musicFlash((j&&j.error) || 'NO HELPER');
  }
}

/* Shown whenever there is a track and a helper - the same bar the
   transport clears, and deliberately so.

   It used to also require NP.liked to be a real boolean, i.e. that the
   poller had managed to ASK the library. That made a failing library call
   present as a button that simply was not there, next to three transport
   buttons that were - and nothing on the glass or in the log said why.
   "It is still not showing, everything else works" is exactly what that
   looks like from the helm.

   The transport is not held to that standard either: it needs Premium
   and an active device, neither of which is known until you press it,
   and a refusal is SHOWN rather than pre-empted by hiding the button.
   It now behaves the same way - dim while the answer is unknown,
   pressable, and a refusal says which one it was. */
function paintHeart(){
  const el=$('m-like'); if(!el) return;
  const show = likeAvailable();
  el.style.display = show ? '' : 'none';
  paintCtlRow();
  if(!show) return;
  /* A plain + says "not in your library". A DIM one says "I do not
     know" - a distinction worth drawing, because only one of the two is
     something you can fix. */
  const known = likePend!==null || NP.liked!==null;
  const on = likePend!==null ? likePend : !!NP.liked;
  /* + to add, a tick once it is in your library - the same two marks the
     Spotify app uses, so the panel is not teaching a second vocabulary. */
  wAttr('m-saveico','d', on ? 'M7.4 12.4l3.1 3.1 6.1-6.6' : 'M12 7v10M7 12h10');
  el.classList.toggle('on', on);
  el.classList.toggle('unk', !known);
  el.classList.toggle('busy', likeBusy);
  el.setAttribute('aria-pressed', on?'true':'false');
}

async function toggleLike(){
  if(likeBusy || !likeAvailable()) return;
  const id=NP.id, want = !(likePend!==null ? likePend : !!NP.liked);
  likeBusy=true; likePend=want; paintHeart();          /* fills at once */
  const j=await netApi('/spotify/like',{id:id, want:want});
  likeBusy=false;
  if(!j || !j.ok){
    likePend=null; paintHeart();                       /* put it back */
    musicFlash((j&&j.error) || 'NO HELPER');
    return;
  }
  /* Hold the optimistic value until the poller's next write agrees with
     it - dropping it now would flick the mark back for the second it
     takes the file to be rewritten. Cleared when NP.liked catches up, or
     after a few seconds if it never does. */
  setTimeout(()=>{ if(likePend===want && NP.liked!==want){ likePend=null; paintHeart(); } }, 6000);
}

/* ---- the volume bezel -----------------------------------------------
   44 ticks over 300 degrees, lit up to the level. Built once and then
   only the ticks whose state actually changed are touched, so turning it
   costs a handful of class flips rather than 44 DOM writes a frame.

   Turning is RELATIVE - how far you rotate, not where you touch. An
   absolute ring would mean a stray knuckle at the top of the bezel is
   full volume in a cabin at anchor, and that is not a mistake worth
   being able to make. It also means the 8px threshold below can ignore
   taps entirely: a touch that never moves does nothing at all.        */
/* 45, not 44, and the reason is arithmetic rather than taste. The ticks
   are laid out across VT_N-1 gaps, so the majors land on quarters of the
   scale only when VT_N-1 divides by 4 - and the middle one sits at twelve
   o'clock only when it is even. 44 ticks put the majors at 0, 25.6, 51.2
   and 76.7 per cent and the "half" one three and a half degrees past top
   dead centre, which is exactly the sort of wrong that is invisible until
   you look at it against the strip above and cannot unsee. 45 gives 44
   gaps: majors every 11 at 0, 25, 50, 75, 100, and 50% dead centre. */
const VT_N=45, V_A0=-150, V_SPAN=300;
let VTs=null, vLit=null, volPend=null, vDrag=null;

function volAvailable(){
  return !!(NET.st && NET.st.spotify && NET.st.spotify.available)
         && NP.volume!==null;
}
function buildVTicks(){
  const svg=$('vring'); if(!svg || VTs) return;
  VTs=[];
  /* The 360 box, art radius 140. R is set by what is ABOVE it: the
     instrument strip's baseline sits about 9px clear of the topmost
     major tick at this radius, and every px further out puts the scale
     through "13.3 AWS". */
  const C=180, R=156;
  for(let i=0;i<VT_N;i++){
    const deg=V_A0+V_SPAN/(VT_N-1)*i, maj=(i%11===0), o=maj?10:6.5;
    const rad=(deg-90)*Math.PI/180, c=Math.cos(rad), s=Math.sin(rad);
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',(C+(R-o)*c).toFixed(1)); l.setAttribute('y1',(C+(R-o)*s).toFixed(1));
    l.setAttribute('x2',(C+(R+o)*c).toFixed(1)); l.setAttribute('y2',(C+(R+o)*s).toFixed(1));
    l.setAttribute('class', maj?'vt maj':'vt');
    svg.appendChild(l); VTs.push(l);
  }
}
function volNow(){ return volPend!==null ? volPend : NP.volume; }
function paintVolume(){
  const wrap=$('m-artwrap'); if(!wrap) return;
  const show=volAvailable();
  wSty('vring','display', show?'':'none');
  if(!show){ wrap.classList.remove('turning','dead'); return; }
  buildVTicks();
  wrap.classList.toggle('dead', NP.volOk===false);
  const v=volNow();
  /* -1 so that muted lights NOTHING. Rounding 0 to tick zero would leave
     one lit pip at silence, which reads as "nearly off" rather than off. */
  const lit = v<=0 ? -1 : Math.round(v/100*(VT_N-1));
  if(lit!==vLit){
    for(let i=0;i<VT_N;i++){
      const on=i<=lit;
      if(VTs[i]._on!==on){ VTs[i]._on=on; VTs[i].classList.toggle('on',on); }
    }
    vLit=lit;
  }
  $('m-volnum').textContent = v;
}

/* 0 at twelve o'clock, positive clockwise. atan2(dx,-dy) rather than the
   usual (dy,dx) so the zero is where the scale's zero is. */
function vAngle(e){
  const r=$('m-art').getBoundingClientRect();
  return Math.atan2(e.clientX-(r.left+r.width/2),
                    -(e.clientY-(r.top+r.height/2)))*180/Math.PI;
}
function vDown(e){
  if(!volAvailable()) return;
  /* The open 60 degrees at the foot are not part of the scale, and the
     title lives under them. */
  const a=vAngle(e); if(Math.abs(a)>150) return;
  if(NP.volOk===false){ musicFlash("DEVICE WON'T"); return; }
  vDrag={id:e.pointerId, aPrev:a, v:volNow(), moved:false,
         x0:e.clientX, y0:e.clientY};
  try{ $('m-vhit').setPointerCapture(e.pointerId); }catch(err){}
}
function vMove(e){
  if(!vDrag || e.pointerId!==vDrag.id) return;
  if(!vDrag.moved){
    if(Math.hypot(e.clientX-vDrag.x0, e.clientY-vDrag.y0) < 8) return;
    vDrag.moved=true;
    gClaim();                       /* this touch is the bezel's, not a swipe */
    $('m-artwrap').classList.add('turning');
  }
  /* Accumulated from the LAST angle, not the first: measuring from the
     start would jump by 360 the moment a slow turn crossed six o'clock. */
  let d=vAngle(e)-vDrag.aPrev;
  while(d>180) d-=360; while(d<-180) d+=360;
  vDrag.aPrev+=d;
  vDrag.v=Math.max(0, Math.min(100, vDrag.v + d/V_SPAN*100));
  volPend=Math.round(vDrag.v);
  paintVolume();
}
async function vUp(e){
  if(!vDrag || e.pointerId!==vDrag.id) return;
  const moved=vDrag.moved; vDrag=null;
  $('m-artwrap').classList.remove('turning');
  if(!moved || volPend===null) return;
  /* Sent on release only. Following the finger with a request every few
     degrees would be a dozen writes for one turn, and Spotify does not
     promise they arrive in order - the last one to land would win, which
     is not necessarily the last one you meant. */
  const want=volPend;
  const j=await netApi('/spotify/volume',{pct:want});
  if(!j || !j.ok){
    volPend=null; paintVolume();
    musicFlash((j&&j.error) || 'NO HELPER');
    return;
  }
  setTimeout(()=>{ if(volPend===want && NP.volume!==want){
    volPend=null; paintVolume(); } }, 6000);
}

/* The state line doubles as the toast here, the way the track page's
   status line does - there is nowhere else on this page to put one. */
let musicFlashUntil=0;
function musicFlash(msg){
  musicFlashUntil=Date.now()+2600;
  $('m-state').textContent=String(msg).toUpperCase().slice(0,28);
  setTimeout(()=>{ if(Date.now()>=musicFlashUntil) paintMusic(); }, 2700);
}

/* px per second the text travels. Slow enough to read at the helm with
   the boat moving, fast enough that a long name comes round again. */
const MQ_SPEED=58;

/* Longest one pass may take. Constant speed alone is right until a name
   is very long indeed, where it becomes half a minute before you see the
   end of it - so past this the travel speeds up instead. */
const MQ_MAX=14000, MQ_MIN=3000;
const MQ=new Map();          /* element id -> its running Animation */

/* Put text in a lane, and set it moving only if it does not fit.
   Driven by the animation API with CONCRETE pixel values rather than a
   CSS keyframe reading a custom property. That is not a style
   preference: a var() inside @keyframes cannot be composited, because
   Chromium has to resolve it on the main thread every frame.

   Measured, rather than assumed. On a bare page this animation costs
   nothing at all - 0.09% of the main thread against a 0.03% baseline,
   and zero style recalc, clipped or not. Inside the app it does show
   up: three runs each, at 6x CPU throttle, scrolling against the same
   page with the animation cancelled, gave style recalc 1.88% vs 1.12%
   and main thread 11.7% vs 10.8% - spreads that do not overlap, so it
   is real and not noise. Call it a point of throttled main thread,
   which is about 0.15% unthrottled. Something in this page's
   compositing context stops it being as free as it is in isolation; it
   was not worth chasing further for that number, but it is not zero and
   should not be written up as though it were.

   Per frame this code does nothing regardless - the only work here is
   the measurement, and that happens when the track changes. */
function setScroller(id, text){
  const el=$(id);
  let sp=el.firstElementChild;
  if(!sp || sp.tagName!=='SPAN'){
    el.textContent=''; sp=document.createElement('span'); el.appendChild(sp);
  }
  if(sp.textContent!==text) sp.textContent=text;

  const over = sp.scrollWidth - el.clientWidth;
  const old=MQ.get(id);
  if(old){ old.cancel(); MQ.delete(id); }
  if(over <= 4){ el.classList.remove('mq'); return; }
  el.classList.add('mq');

  /* /0.76 because a pass spends 24% of itself holding still at the two
     ends - without it the travel itself would be slower than intended. */
  const dur = Math.min(MQ_MAX, Math.max(MQ_MIN, over/MQ_SPEED/0.76*1000));
  const a = sp.animate([
    {transform:'translateX(0px)',           offset:0},
    {transform:'translateX(0px)',           offset:0.12},
    {transform:'translateX('+(-over)+'px)', offset:0.88},
    {transform:'translateX('+(-over)+'px)', offset:1}
  ], {duration:dur, iterations:Infinity, direction:'alternate',
      easing:'ease-in-out'});
  MQ.set(id, a);
  if(PAGE_I!==2) a.pause();      /* never travelling off-screen */
}

/* The music page is translated aside rather than hidden, so an animation
   left running there would go on ticking behind the dial for the rest of
   the voyage. */
function mqPage(){
  const on = PAGE_I===2;
  MQ.forEach(a=>{ try{ on ? a.play() : a.pause(); }catch(e){} });
}

/* Web fonts land after the first paint, and a name measured in the
   fallback face is measured wrong - too narrow, so a title that does
   overflow would sit still and clipped. Measure again once. */
if(document.fonts && document.fonts.ready)
  document.fonts.ready.then(()=>{ if(FEED==='ok') paintMusic(); });

function paintMusic(){
  /* Say which of the three it is. A helm that reads "Nothing playing"
     when the poller was never started sends you looking at Spotify. */
  if(FEED==='missing'||FEED==='offline'){
    setScroller('m-title', 'No music feed');
    setScroller('m-artist', FEED==='missing'
      ? 'run spotify-auth.py once, then restart the session'
      : 'nowplaying.json is not answering');
    if(Date.now()>=musicFlashUntil)
      $('m-state').textContent = FEED==='missing' ? 'NOT SET UP' : 'OFFLINE';
    paintHeart(); paintTransport(); paintVolume();
    return;
  }
  setScroller('m-title', NP.title || 'Nothing playing');
  setScroller('m-artist', NP.artist || '—');
  if(Date.now()>=musicFlashUntil)
    $('m-state').textContent = NP.playing ? 'NOW PLAYING' : 'PAUSED';
  paintHeart(); paintTransport(); paintVolume();
  const art=$('m-art');
  if(NP.cover){
    if(!art.querySelector('img')){ art.innerHTML='<img>'; }
    const im=art.querySelector('img');
    if(im.src!==NP.cover) im.src=NP.cover;
  }
}

/* ---- instruments on the music panel -----------------------------------
   The bezel carries wind angle, the strip carries the scalars. Cells for
   sensors that are not fitted are omitted entirely rather than shown as
   dashes - a row of empty placeholders reads as a fault, whereas fewer
   cells just reads as fewer instruments.                              */
function drawBezelTicks(){
  const g=$('mb-ticks'); if(!g) return;
  let o='';
  for(let a=0;a<360;a+=15){
    const maj=a%90===0, mid=a%45===0;
    const r1=528, r2=maj?496:(mid?506:515);
    const rad=(a-90)*Math.PI/180, c=Math.cos(rad), si=Math.sin(rad);
    o+=`<line class="mb-tick${maj?' maj':''}" stroke-width="${maj?5:3}"`
      +` x1="${(540+r1*c).toFixed(1)}" y1="${(540+r1*si).toFixed(1)}"`
      +` x2="${(540+r2*c).toFixed(1)}" y2="${(540+r2*si).toFixed(1)}"/>`;
  }
  g.innerHTML=o;
}

/* Rotating 179 -> -179 the naive way spins almost the whole way round the
   dial. Track a continuous angle and always add the short way about. */
const shortWay=(from,to)=>{ let d=(to-from)%360;
  if(d>180)d-=360; if(d<-180)d+=360; return d; };
let bezelCont=null;

function paintBezel(){
  const g=$('mb-wind'); if(!g) return;
  /* take the dial's already-filtered angle so the bezel is not fed raw
     4 Hz steps; fall back to raw only if the dial has not seen it yet */
  let deg=smoothedAngle('awa');
  if(deg===null) deg=smoothedAngle('twa');
  if(deg===null){
    let a=get('environment.wind.angleApparent');
    if(a===null) a=get('environment.wind.angleTrueWater');
    deg = a===null ? null : a*DEG;
  }
  if(deg===null){ g.classList.remove('on'); bezelCont=null; return; }
  g.classList.add('on');
  g.classList.toggle('port', deg<0);
  g.classList.toggle('stbd', deg>=0);
  if(bezelCont===null){ bezelCont=deg; g.style.transform=`rotate(${deg.toFixed(1)}deg)`; return; }
  const d=shortWay(bezelCont,deg);
  if(Math.abs(d)>0.12){                   /* with a matched linear
                                             transition there is no restart
                                             penalty, so this can be tight */
    bezelCont+=d;
    g.style.transform=`rotate(${bezelCont.toFixed(1)}deg)`;
  }
}

/* ---- demo feed (CFG.windDemo) -----------------------------------------
   A slow sweep across both tacks so the bezel has something to animate.
   Deliberately not a straight ramp: real apparent wind wanders, and a
   linear sweep makes the easing look wrong when it is actually right. */
let demoT=0;

/* Everything the feed fabricates, in one list, so the switch below can
   clear exactly what it wrote. */
const DEMO_PATHS=['environment.wind.angleApparent',
                  'environment.wind.speedApparent',
                  'environment.wind.speedTrue',
                  'environment.depth.belowTransducer',
                  'navigation.speedOverGround'];
/* The subset that means a real instrument has appeared. SOG is not on it
   - the feed already defers to a real SOG, so a GPS fix alone is no
   evidence the vane is fitted. */
const DEMO_REAL=['environment.wind.angleApparent',
                 'environment.wind.speedApparent',
                 'environment.wind.speedTrue',
                 'environment.depth.belowKeel',
                 'environment.depth.belowTransducer'];

function demoSet(on, why){
  if(!!CFG.windDemo===!!on) return;
  CFG.windDemo=!!on;
  if(!on){
    /* Drop what it wrote rather than waiting out staleAfter, and drop the
       filter state with it - a filter fed null does not decay, it FREEZES
       on its last value, so leaving it would hold the bezel on a
       fabricated bearing until a real reading happened to arrive. */
    DEMO_PATHS.forEach(p=>{ delete S[p]; });
    ['awa','twa','tws','dpt','vmg'].forEach(k=>{ delete sm[k]; delete smA[k]; });
    bezelCont=null;
  }
  drawDemo(); prefsSave();
  if(why) console.log('[helm] demo data off:', why);
}
function drawDemo(){
  const on=!!CFG.windDemo;
  wCls('demo-btn','on',on);
  wAttr('demo-btn','aria-pressed', on?'true':'false');
}

function windDemoTick(){
  if(!CFG.windDemo) return;
  demoT+=0.25;
  const awa=Math.sin(demoT/11)*140 + Math.sin(demoT/2.7)*6;
  put('environment.wind.angleApparent', awa/DEG);
  put('environment.wind.speedApparent', (11+Math.sin(demoT/5)*3.2)/MS_TO_KT);
  put('environment.wind.speedTrue',     (9.5+Math.sin(demoT/6)*2.4)/MS_TO_KT);
  put('environment.depth.belowTransducer', (14+Math.sin(demoT/7)*5)/M_TO_FT);
  if(get('navigation.speedOverGround')===null)
    put('navigation.speedOverGround', (5.6+Math.sin(demoT/6)*0.9)/MS_TO_KT);
}
/* left running rather than conditionally started, so the flag can be
   flipped live from a console without a reload. Four no-op calls a
   second when off is not measurable. */
setInterval(windDemoTick, 250);
$('demo-btn').addEventListener('click',()=>demoSet(!CFG.windDemo));
drawDemo();

let stripKey='';
function paintStrip(){
  const box=$('ms-strip'); if(!box) return;
  const sog=get('navigation.speedOverGround');
  const aws=get('environment.wind.speedApparent');
  let dpt=get('environment.depth.belowKeel');
  if(dpt===null) dpt=get('environment.depth.belowTransducer');
  const cells=[];
  if(sog!==null) cells.push([(sog*MS_TO_KT).toFixed(1),'KT']);
  if(aws!==null) cells.push([(aws*MS_TO_KT).toFixed(1),'AWS']);
  if(dpt!==null) cells.push([
    CFG.depthUnit==='m' ? dpt.toFixed(1) : (dpt*M_TO_FT).toFixed(1),
    CFG.depthUnit==='m' ? 'M' : 'FT']);
  const key=cells.map(c=>c.join()).join('|');
  if(key===stripKey) return;              /* nothing moved - leave the DOM alone */
  stripKey=key;
  /* hairline separators between, never trailing */
  box.innerHTML=cells.map(c=>`<span><b>${c[0]}</b> ${c[1]}</span>`).join('<i></i>');
  box.style.display = cells.length ? 'flex' : 'none';
}

const mmss=ms=>{const s=Math.max(0,Math.floor(ms/1000));
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};

/* How far the local clock may run ahead of the last write before it is
   not believed. spotify-now.py rewrites every 5 s of track progress, so
   anything past a couple of minutes means the poller stopped - or the
   two clocks disagree, which is not exotic here: `at` comes from the
   Pi, Date.now() from whatever is showing the page. On a phone over the
   boat WiFi that is a different machine, and on the Pi itself it is a
   machine with no RTC that starts at the epoch and jumps when NTP
   lands. Either way the bar used to pin to one end and stay there. */
const NP_MAX_DRIFT=120000;

function musicTick(){
  /* The reschedule is the first thing, and the work is wrapped. This is
     a single-shot chain: one throw anywhere below - in paintBezel, in
     paintStrip, in a readout - and the clock stops for the rest of the
     session while pollMusic carries on updating the title and the art
     around it. That failure looks exactly like "the time does not
     work", and nothing would say otherwise.
     250 ms matches the SignalK feed and the bezel's transition, so the
     wedge gets a fresh target exactly as the last one lands. */
  setTimeout(musicTick,250);
  try{
    if(!music.classList.contains('open')) return;
    paintBezel(); paintStrip();
    let p=NP.pos;
    const since=Date.now()-NP.at;
    if(NP.playing && since>0 && since<NP_MAX_DRIFT) p+=since;
    if(NP.dur) p=Math.min(p,NP.dur);
    $('m-pos').textContent=mmss(p);
    $('m-dur').textContent=mmss(NP.dur);
    $('m-fill').style.width=NP.dur?(p/NP.dur*100)+'%':'0';
  }catch(e){ /* one bad pass must not cost the rest of the session */ }
}
/* gClaim, not stopPropagation - see the comment on it. This sits on the
   music page where a swipe-down opens nothing, but the rule is the rule:
   a button says "this touch is mine" by claiming it, never by breaking
   the gesture reader's view of the pointer. */
$('m-like').addEventListener('pointerdown',gClaim);
$('m-like').addEventListener('click',e=>{ e.stopPropagation(); toggleLike(); });
[['m-prev','prev'],['m-next','next']].forEach(([id,op])=>{
  $(id).addEventListener('pointerdown',gClaim);
  $(id).addEventListener('click',e=>{ e.stopPropagation(); transport(op); });
});
$('m-vhit').addEventListener('pointerdown',vDown);
$('m-vhit').addEventListener('pointermove',vMove);
$('m-vhit').addEventListener('pointerup',vUp);
$('m-vhit').addEventListener('pointercancel',vUp);
$('m-play').addEventListener('pointerdown',gClaim);
$('m-play').addEventListener('click',e=>{ e.stopPropagation();
  transport(NP.playing?'pause':'play'); });

pollMusic(); musicTick();

/* ==================================================================
   TRACK MAP
   Equirectangular projection about the track centre - over a few km
   the distortion is nothing, and it keeps the maths to two lines.
   Segments are coloured by speed so a slow patch shows up as a dull
   stretch rather than needing a separate graph.
   ================================================================== */
const tmap=$('tmap');
const MAP_CX=540, MAP_CY=430, MAP_R=250;

/* When the plugin owns recording, the points live on the boat and TRK
   stays empty here - trackSample() returns immediately in that mode. So
   the fetched set is kept, and it is what every redraw draws. It used to
   be fetched once on entry and then overwritten a second later by the
   live redraw handing drawMap(TRK): on a clean Pi the race arrived and
   vanished, and on one that had recorded locally before the plugin went
   in, LAST SEASON'S race was drawn over the live one and the view
   refitted to it. */
let SRVTRK=null, srvAt=0, srvBusy=false;
async function fetchServerTrack(){
  if(srvBusy) return null;
  srvBusy=true;
  try{
    const h=CFG.host||location.host;
    const r=await fetchT(`http://${h}/plugins/signalk-confluence-track/track?max=800`, 8000);
    if(r.ok){ SRVTRK=(await r.json()).points||[]; srvAt=Date.now(); return SRVTRK; }
  }catch(e){ /* boat quiet - keep whatever we last had */ }
  finally{ srvBusy=false; }
  return null;
}

async function mapEntered(){
  paintTrack();                     /* controls live here now */
  let pts=shownTrack();
  if(serverTrack() && !VIEWTRK) pts=(await fetchServerTrack())||SRVTRK||[];
  /* Building up to 800 path segments in the same task that starts the
     transition eats the first frames and the slide visibly hitches.
     Let the panel land, then draw.                                   */
  setTimeout(()=>drawMap(pts), SLIDE_MS);
}

/* ---- Web Mercator ----------------------------------------------------
   Normalised world coordinates, 0..1 across the globe, y growing south.
   This is the projection every satellite tile server on earth uses, so a
   track drawn in it lines up with imagery pixel for pixel once a basemap
   goes in behind. The equirectangular fit this replaces looked perfectly
   fine on its own and would have drifted visibly against real tiles.   */
function merc(la,lo){
  const s=Math.sin(la*Math.PI/180);
  return { x:(lo+180)/360, y:0.5-Math.log((1+s)/(1-s))/(4*Math.PI) };
}
const projX=(v,m)=>MAP_CX+(m.x-v.mx)*v.scale;
const projY=(v,m)=>MAP_CY+(m.y-v.my)*v.scale;

/* The view is kept between redraws so a live track does not rescale under
   you every second while you are watching it. It only refits when a point
   actually sails outside the circle.                                    */
let MAPVIEW=null, lastMapDraw=0;
function fitView(P){
  let x0=1,x1=0,y0=1,y1=0;
  for(const p of P){ const m=merc(p.la,p.lo);
    if(m.x<x0)x0=m.x; if(m.x>x1)x1=m.x;
    if(m.y<y0)y0=m.y; if(m.y>y1)y1=m.y; }
  const mx=(x0+x1)/2, my=(y0+y1)/2;
  /* Fit the farthest actual fix, not the bounding box. A diagonal track's
     bbox corner sits sqrt(2)/2 of a span from centre and pokes out of the
     circle even when no real point does - which is exactly the bug the
     first version of this shipped with.                                */
  let r=1e-6;
  for(const p of P){ const m=merc(p.la,p.lo);
    r=Math.max(r, Math.hypot(m.x-mx, m.y-my)); }
  return { mx, my, scale:(MAP_R*0.90)/r };
}
function outOfView(v,P){
  if(!v) return true;
  for(const p of P){
    const m=merc(p.la,p.lo);
    if(Math.hypot(projX(v,m)-MAP_CX, projY(v,m)-MAP_CY) > MAP_R*0.97) return true;
  }
  return false;
}

/* ---- satellite basemap ------------------------------------------------
   Tiles are ordinary files on disk, so the chart works with the boat's
   aerial disconnected. Zoom is picked so one tile lands near 256 screen
   px. Outside the cached box nothing renders and the track draws over
   bare background - degraded, never broken.                           */
let tileKey='';
function drawTiles(v){
  const g=$('t-tiles'); if(!g) return;
  if(!CFG.basemap){ g.innerHTML=''; tileKey=''; return; }
  let z=Math.round(Math.log2(v.scale/256));
  z=Math.max(CFG.tileMinZ,Math.min(CFG.tileMaxZ,z));
  /* redrawing identical <image> tags once a second would reload and flicker */
  const key=z+'|'+v.mx.toFixed(8)+'|'+v.my.toFixed(8)+'|'+v.scale.toFixed(2);
  if(key===tileKey) return;
  tileKey=key;
  const n=Math.pow(2,z), px=v.scale/n, rad=MAP_R/v.scale;
  const x0=Math.floor((v.mx-rad)*n), x1=Math.floor((v.mx+rad)*n);
  const y0=Math.floor((v.my-rad)*n), y1=Math.floor((v.my+rad)*n);
  let out='';
  for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++){
    if(x<0||y<0||x>=n||y>=n) continue;
    const sx=MAP_CX+(x/n-v.mx)*v.scale, sy=MAP_CY+(y/n-v.my)*v.scale;
    out+=`<image href="${CFG.tileBase}/${z}/${x}/${y}.jpg"`
        +` x="${sx.toFixed(1)}" y="${sy.toFixed(1)}"`
        +` width="${(px+1).toFixed(1)}" height="${(px+1).toFixed(1)}"`
        +` preserveAspectRatio="none"`
        +` onerror="tileMiss(this,${z},${x},${y})"/>`;
  }
  g.innerHTML=out;
}

/* one implementation of the numbers, used by the map and the library */
function trackStats(pts){
  if(!pts||pts.length<2) return {nm:0,secs:0,avg:0,max:0};
  const lat0=pts.reduce((a,p)=>a+p.la,0)/pts.length;
  const kx=111320*Math.cos(lat0*Math.PI/180), ky=111320;
  let d=0;
  for(let i=1;i<pts.length;i++)
    d+=Math.hypot((pts[i].lo-pts[i-1].lo)*kx,(pts[i].la-pts[i-1].la)*ky);
  const secs=(pts[pts.length-1].t-pts[0].t)/1000, nm=d/1852;
  const sp=pts.map(p=>(p.s||0)*MS_TO_KT);
  return {nm, secs, avg:secs>0?nm/(secs/3600):0, max:Math.max(...sp,0)};
}
const durTxt=se=>`${Math.floor(se/60)}:${String(Math.round(se%60)).padStart(2,'0')}`;

/* VIEWTRK holds a race loaded out of the library; null means we are
   looking at the live track. Everything downstream asks shownTrack(). */
let VIEWTRK=null;
const shownTrack=()=>VIEWTRK||TRK;

function drawMap(pts){
  const g=$('t-path');
  if(!pts||!pts.length){
    g.innerHTML=`<text x="540" y="470" text-anchor="middle" fill="var(--label)"
      font-size="34" font-weight="600" letter-spacing="0.1em">NO TRACK RECORDED</text>`;
    ['t-dist','t-dur','t-avg','t-max'].forEach(i=>$(i).textContent='–');
    $('t-tiles').innerHTML=''; tileKey='';
    MAPVIEW=null; return;
  }
  /* thin for drawing - 800 segments is plenty on a 290 px radius */
  const step=Math.max(1,Math.ceil(pts.length/800));
  const P=pts.filter((_,i)=>i%step===0);
  if(P[P.length-1]!==pts[pts.length-1]) P.push(pts[pts.length-1]);  /* keep the head */

  if(outOfView(MAPVIEW,P)) MAPVIEW=fitView(P);
  const v=MAPVIEW;
  drawTiles(v);
  const M=P.map(p=>merc(p.la,p.lo));
  const X=M.map(m=>projX(v,m)), Y=M.map(m=>projY(v,m));

  const sp=P.map(p=>(p.s||0)*MS_TO_KT);
  const vmax=Math.max(...sp,0.1);
  let out='';
  for(let i=1;i<P.length;i++){
    const f=Math.min(1,sp[i]/vmax);                 /* 0 slow .. 1 fast */
    out+=`<line x1="${X[i-1].toFixed(1)}" y1="${Y[i-1].toFixed(1)}"
           x2="${X[i].toFixed(1)}" y2="${Y[i].toFixed(1)}"
           stroke="var(--accent)" stroke-opacity="${(0.25+0.75*f).toFixed(2)}"
           stroke-width="${(3+5*f).toFixed(1)}" stroke-linecap="round"/>`;
  }
  /* the individual fixes, thinned to about 60 so they read as beads on the
     line rather than a solid smear */
  const dot=Math.max(1,Math.ceil(P.length/60));
  for(let i=0;i<P.length;i+=dot)
    out+=`<circle cx="${X[i].toFixed(1)}" cy="${Y[i].toFixed(1)}" r="3.5"
           fill="var(--ink)" fill-opacity=".35"/>`;

  out+=`<circle cx="${X[0].toFixed(1)}" cy="${Y[0].toFixed(1)}" r="11"
         fill="var(--stbd)"/>`;
  const L=P.length-1;
  out+=`<circle cx="${X[L].toFixed(1)}" cy="${Y[L].toFixed(1)}" r="13"
         fill="var(--port)"/>`;
  if(trackLive())                                   /* pulsing head while live */
    out+=`<circle cx="${X[L].toFixed(1)}" cy="${Y[L].toFixed(1)}" r="24"
           fill="none" stroke="var(--port)" stroke-width="3" stroke-opacity=".55"/>`;
  g.innerHTML=out;

  /* stats from the full set, not the thinned one */
  const st=trackStats(pts);
  $('t-dist').textContent=st.nm.toFixed(2);
  $('t-dur').textContent =durTxt(st.secs);
  $('t-avg').textContent =st.secs>0?st.avg.toFixed(1):'–';
  $('t-max').textContent =st.max.toFixed(1);
}

/* Is LOCAL recording armed? A function declaration rather than a const,
   because the two callers above it are a long way above it.

   This test was written out three times - here, in trackSample() and in
   paintTrack() - and three copies of a predicate is three chances for a
   future edit to change two of them. */
function localRec(){
  return localArmed||tState==='countdown'||tState==='racing';
}
/* is the track actively growing right now? */
function trackLive(){
  return serverTrack() ? !!get('confluence.track.recording') : localRec();
}

/* ---- track library (IndexedDB) ---------------------------------------
   localStorage tops out near 5 MB - roughly ten races at 1 Hz - and its
   failure mode is a silent throw part-way through a write, which loses
   the race you just sailed. IndexedDB is bounded by free disk instead,
   so the library holds a season.                                      */
const DB_NAME='confluence', DB_VER=3, DB_STORE='tracks', DB_TILES='tilecache';
let DB=null;
function dbOpen(){
  return new Promise((res,rej)=>{
    if(DB) return res(DB);
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const db=e.target.result, tx=e.target.transaction;
      if(!db.objectStoreNames.contains(DB_STORE))
        db.createObjectStore(DB_STORE,{keyPath:'id'}).createIndex('t','t');
      /* added in v2 - the upgrade leaves existing races untouched */
      if(!db.objectStoreNames.contains(DB_TILES))
        db.createObjectStore(DB_TILES,{keyPath:'k'});
      /* v3: an index on the timestamp tilePut has always written and
         nothing ever read. Without it the store could only be trimmed by
         reading every record, so in practice it was never trimmed at all
         - see tileTrim. Added to the existing store on upgrade, so a Pi
         that already has a season of tiles keeps them. */
      const ts=tx.objectStore(DB_TILES);
      if(!ts.indexNames.contains('t')) ts.createIndex('t','t');
    };
    r.onsuccess=e=>{ DB=e.target.result; res(DB); };
    r.onerror =e=>rej(e.target.error);
  });
}

/* Tiles and races share this database, so an origin evicted under quota
   pressure loses the season along with the imagery. Asking to be
   persistent is the only lever a page has over that. It may well say no
   - it is a request, not a setting - which is exactly why tileTrim
   exists as well rather than instead. */
if(navigator.storage&&navigator.storage.persist)
  navigator.storage.persist().catch(()=>{});
function dbTx(mode,fn){
  return dbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(DB_STORE,mode);
    const rq=fn(tx.objectStore(DB_STORE));
    tx.oncomplete=()=>res(rq&&rq.result);
    tx.onerror   =e=>rej(e.target.error);
  }));
}
const dbPut=r =>dbTx('readwrite',st=>st.put(r));
const dbDel=id=>dbTx('readwrite',st=>st.delete(id));
const dbGet=id=>dbTx('readonly', st=>st.get(id));
const dbAll=() =>dbTx('readonly', st=>st.getAll());

/* ---- runtime tile cache ----------------------------------------------
   Three places a tile can come from, tried in order: the on-disk pack
   seeded for the home venue, IndexedDB for anywhere you have already
   been, then the network. A tile fetched once is kept, so sailing new
   water with a signal at the dock is enough to make it work offline
   out there later.                                                    */
function tileTx(mode,fn){
  return dbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(DB_TILES,mode);
    const rq=fn(tx.objectStore(DB_TILES));
    tx.oncomplete=()=>res(rq&&rq.result);
    tx.onerror   =e=>rej(e.target.error);
  }));
}
const tileGet  =k    =>tileTx('readonly', st=>st.get(k));
const tilePut  =(k,b)=>tileTx('readwrite',st=>st.put({k,b,t:Date.now()}));
const tileCount=()   =>tileTx('readonly', st=>st.count());

/* Oldest-first eviction, the same discipline the in-memory blobURL map
   two functions down has always had. Nothing evicted this store at all
   before: no record was ever deleted, the `t` every tilePut wrote was
   never read, and tileCount had no callers. cacheArea accepts 6000 tiles
   PER PRESS, so a couple of new venues was a few hundred megabytes - and
   because the races live in the same database, the eviction that
   eventually came was Chromium's, taking the season with it.

   The count is checked first and is cheap, so the common case - a store
   under the cap - costs one readonly transaction and stops. */
let tileTrimming=false;
async function tileTrim(){
  if(tileTrimming) return 0;
  tileTrimming=true;
  try{
    const cap=CFG.tileStoreCap|0;
    if(cap<=0) return 0;
    const n=await tileCount();
    if(n<=cap) return 0;
    const drop=n-cap;
    return await tileTx('readwrite',st=>{
      let killed=0;
      const cur=st.index('t').openCursor();       /* ascending: oldest first */
      cur.onsuccess=e=>{
        const c=e.target.result;
        if(!c||killed>=drop) return;
        /* the blob URL minted for this key, if any, goes too */
        const u=tileURLs.get(c.value.k);
        if(u){ URL.revokeObjectURL(u); tileURLs.delete(c.value.k); }
        c.delete(); killed++; c.continue();
      };
      return cur;
    }).then(()=>drop);
  }catch(e){ return 0; }
  finally{ tileTrimming=false; }
}
const tileRemoteURL=(z,x,y)=>`${CFG.tileRemote}/${z}/${y}/${x}`;  /* Esri is z/y/x */

/* Object URLs are reused across redraws - minting a fresh one per frame
   would leak a blob per tile per second while a live track redraws.   */
const tileURLs=new Map();
function blobURL(k,b){
  let u=tileURLs.get(k);
  if(!u){
    if(tileURLs.size>400){                       /* bounded, oldest first */
      const old=tileURLs.keys().next().value;
      URL.revokeObjectURL(tileURLs.get(old)); tileURLs.delete(old);
    }
    u=URL.createObjectURL(b); tileURLs.set(k,u);
  }
  return u;
}

/* when the network is down, stop retrying every tile for a while */
let netBad=0;
function fetchTile(z,x,y){
  if(!CFG.tileFetch || Date.now()<netBad) return Promise.resolve(null);
  const ac=new AbortController();
  const to=setTimeout(()=>ac.abort(),8000);
  return fetch(tileRemoteURL(z,x,y),{mode:'cors',signal:ac.signal})
    .then(r=>r.ok?r.blob():null)
    .catch(()=>{ netBad=Date.now()+30000; return null; })
    .then(b=>{ clearTimeout(to); return b; });
}

/* called from the <image> onerror - the disk pack did not have it */
window.tileMiss=function(img,z,x,y){
  img.onerror=null;                              /* one shot */
  const k=z+'/'+x+'/'+y;
  tileGet(k).then(rec=>{
    if(rec&&rec.b) return img.setAttribute('href',blobURL(k,rec.b));
    return fetchTile(z,x,y).then(b=>{
      if(!b) return img.remove();
      tilePut(k,b).catch(()=>{});
      img.setAttribute('href',blobURL(k,b));
    });
  }).catch(()=>img.remove());
};

/* Deliberate pre-loading for a venue you are about to sail: grabs every
   zoom over the area currently on screen while you still have a dock
   connection. Reports as it goes because it is not instant.           */
let caching=false;
async function cacheArea(){
  if(caching) return;
  const v=MAPVIEW;
  if(!v) return flashTrk('open a track first');
  const rad=(MAP_R/v.scale)*1.25;                /* a margin around the track */
  const jobs=[];
  for(let z=CFG.tileMinZ;z<=CFG.tileMaxZ;z++){
    const nn=Math.pow(2,z);
    const x0=Math.floor((v.mx-rad)*nn), x1=Math.floor((v.mx+rad)*nn);
    const y0=Math.floor((v.my-rad)*nn), y1=Math.floor((v.my+rad)*nn);
    for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++){
      if(x<0||y<0||x>=nn||y>=nn) continue;
      jobs.push([z,x,y]);
    }
  }
  if(jobs.length>CFG.tileCap){
    flashTrk('area too big ('+jobs.length+' tiles)');
    return;
  }
  caching=true; netBad=0;
  let done=0, got=0, fail=0;
  const worker=async()=>{
    while(jobs.length){
      const [z,x,y]=jobs.pop();
      const k=z+'/'+x+'/'+y;
      try{
        const have=await tileGet(k);
        if(!have){
          const b=await fetchTile(z,x,y);
          if(b){ await tilePut(k,b); got++; } else fail++;
        }
      }catch(e){ fail++; }
      done++;
      if(done%10===0) flashTrk('caching '+done+'/'+(done+jobs.length));
    }
  };
  const total=jobs.length;
  await Promise.all(Array.from({length:6},worker));
  caching=false; tileKey='';
  const evicted=await tileTrim();          /* the one press that could overflow */
  flashTrk(fail? ('cached '+got+'/'+total+' · '+fail+' failed')
               : ('cached '+got+' new · '+total+' total'
                  +(evicted?' · '+evicted+' old dropped':'')));
  if(MAPVIEW) drawTiles(MAPVIEW);
}
/* Once, after the boot has settled. A store already over the cap from a
   version that could not trim wants bringing down without waiting for
   somebody to press CACHE. */
setTimeout(()=>{ tileTrim(); }, 30000);

/* the status line doubles as the toast - there is nowhere else to put one */
function flashTrk(msg){
  const el=$('trk-n'); el.textContent=msg;
  clearTimeout(el._t); el._t=setTimeout(paintTrack,2200);
}

function saveRace(){
  const pts=TRK;
  if(pts.length<2) return flashTrk('nothing to save');
  const t0=pts[0].t, st=trackStats(pts);
  const d=new Date(t0), pad=x=>String(x).padStart(2,'0');
  const rec={ id:'r'+t0, t:t0,
    name:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`
        +` ${pad(d.getHours())}:${pad(d.getMinutes())}`,
    n:pts.length, nm:+st.nm.toFixed(3), secs:Math.round(st.secs),
    avg:+st.avg.toFixed(2), max:+st.max.toFixed(2), pts:pts.slice() };
  dbPut(rec).then(()=>flashTrk('saved · '+rec.name))
            .catch(()=>flashTrk('save failed'));
}

/* ------------------------------------------------------------------
   Getting the file onto the phone

   The track is now a URL on the boat's own WiFi, which means the phone
   only has to be pointed at it - so the helm draws that URL as a QR
   code and the camera does the rest. iOS opens it in Safari, the GPX
   lands in Files, and the share sheet from there reaches SailTies and
   HealthFit.

   No library for the QR: this file has no dependencies and gets none.
   Byte mode, error correction M, versions 1 to 10 - a URL with a long
   race name is about 75 bytes, which is version 5. Anything longer than
   version 10 holds returns null and the caller falls back to showing
   the plain URL to type.
   ------------------------------------------------------------------ */
function qrMatrix(str){
  const bytes=[...new TextEncoder().encode(str)];
  /* [ total codewords, ec per block, blocks in group 1, blocks in group 2 ] */
  const V=[[26,10,1,0],[44,16,1,0],[70,26,1,0],[100,18,2,0],[134,24,2,0],
           [172,16,4,0],[196,18,4,0],[242,22,2,2],[292,22,3,2],[346,26,4,1]];
  let v=0;
  for(;v<10;v++){
    const [tot,ec,b1,b2]=V[v], data=tot-ec*(b1+b2);
    const hdr=4+((v+1)<10?8:16);
    if(bytes.length<=Math.floor((data*8-hdr)/8)) break;
  }
  if(v===10) return null;                       // no room; caller shows text
  const ver=v+1, [tot,ecw,b1,b2]=V[v], nData=tot-ecw*(b1+b2);

  /* ---- bit stream ---- */
  const bits=[];
  const put=(val,len)=>{ for(let i=len-1;i>=0;i--) bits.push((val>>i)&1); };
  put(4,4); put(bytes.length, ver<10?8:16);
  bytes.forEach(b=>put(b,8));
  for(let i=0;i<4&&bits.length<nData*8;i++) bits.push(0);
  while(bits.length%8) bits.push(0);
  const dc=[];
  for(let i=0;i<bits.length;i+=8){ let b=0; for(let j=0;j<8;j++) b=(b<<1)|bits[i+j]; dc.push(b); }
  for(let i=0;dc.length<nData;i++) dc.push(i%2?0x11:0xEC);

  /* ---- GF(256) and Reed-Solomon ---- */
  const EXP=new Uint8Array(512), LOG=new Uint8Array(256);
  for(let i=0,x=1;i<255;i++){ EXP[i]=x; LOG[x]=i; x<<=1; if(x&0x100) x^=0x11D; }
  for(let i=255;i<512;i++) EXP[i]=EXP[i-255];
  const mul=(a,b)=>a&&b?EXP[LOG[a]+LOG[b]]:0;
  let gen=[1];
  for(let i=0;i<ecw;i++){
    const nx=new Array(gen.length+1).fill(0);
    for(let j=0;j<gen.length;j++){ nx[j]^=gen[j]; nx[j+1]^=mul(gen[j],EXP[i]); }
    gen=nx;
  }
  const rs=blk=>{
    const r=blk.concat(new Array(ecw).fill(0));
    for(let i=0;i<blk.length;i++){
      const f=r[i]; if(!f) continue;
      for(let j=0;j<gen.length;j++) r[i+j]^=mul(gen[j],f);
    }
    return r.slice(blk.length);
  };

  /* ---- split into blocks, then interleave ---- */
  const nBlk=b1+b2, short=Math.floor(nData/nBlk);
  const dBlk=[], eBlk=[];
  for(let i=0,at=0;i<nBlk;i++){
    const len=short+(i<b1?0:1);
    const blk=dc.slice(at,at+len); at+=len;
    dBlk.push(blk); eBlk.push(rs(blk));
  }
  const out=[];
  for(let i=0;i<short+1;i++) dBlk.forEach(b=>{ if(i<b.length) out.push(b[i]); });
  for(let i=0;i<ecw;i++) eBlk.forEach(b=>out.push(b[i]));

  /* ---- the grid ---- */
  const n=17+ver*4;
  const m=[...Array(n)].map(()=>new Int8Array(n).fill(-1));   // -1 = free
  const set=(r,c,val)=>{ if(r>=0&&r<n&&c>=0&&c<n) m[r][c]=val; };
  const finder=(r,c)=>{
    for(let i=-1;i<8;i++) for(let j=-1;j<8;j++){
      const on = i>=0&&i<7&&j>=0&&j<7 &&
                 (i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4));
      set(r+i,c+j,on?1:0);
    }
  };
  finder(0,0); finder(0,n-7); finder(n-7,0);
  const AL=[[],[6,18],[6,22],[6,26],[6,30],[6,34],
            [6,22,38],[6,24,42],[6,26,46],[6,28,50]][ver-1];
  AL.forEach(r=>AL.forEach(c=>{
    if((r<9&&c<9)||(r<9&&c>n-10)||(r>n-10&&c<9)) return;      // under a finder
    for(let i=-2;i<=2;i++) for(let j=-2;j<=2;j++)
      set(r+i,c+j, (Math.abs(i)===2||Math.abs(j)===2||(!i&&!j))?1:0);
  }));
  for(let i=8;i<n-8;i++){ set(6,i,i%2?0:1); set(i,6,i%2?0:1); }
  set(n-8,8,1);                                               // the dark module
  const RES=[...Array(n)].map(()=>new Int8Array(n));          // reserved = function
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) RES[r][c]=m[r][c]>=0?1:0;
  for(let i=0;i<9;i++){ RES[8][i]=1; RES[i][8]=1; }           // format areas
  for(let i=0;i<8;i++){ RES[8][n-1-i]=1; RES[n-1-i][8]=1; }
  if(ver>=7) for(let i=0;i<6;i++) for(let j=0;j<3;j++){ RES[i][n-11+j]=1; RES[n-11+j][i]=1; }

  /* ---- data, zigzagging up and down the free columns ---- */
  let bi=0, up=true;
  for(let c=n-1;c>0;c-=2){
    if(c===6) c--;                                            // the timing column
    for(let k=0;k<n;k++){
      const r=up?n-1-k:k;
      for(const cc of [c,c-1]){
        if(RES[r][cc]) continue;
        const bit = bi<out.length*8 ? (out[bi>>3]>>(7-(bi&7)))&1 : 0;
        m[r][cc]=bit; bi++;
      }
    }
    up=!up;
  }

  /* ---- masks, scored by the four penalty rules ---- */
  const COND=[(r,c)=>(r+c)%2===0, (r,c)=>r%2===0, (r,c)=>c%3===0,
              (r,c)=>(r+c)%3===0, (r,c)=>(((r/2)|0)+((c/3)|0))%2===0,
              (r,c)=>(r*c)%2+(r*c)%3===0, (r,c)=>((r*c)%2+(r*c)%3)%2===0,
              (r,c)=>((r+c)%2+(r*c)%3)%2===0];
  const FMT=[0x5412,0x5125,0x5E7C,0x5B4B,0x45F9,0x40CE,0x4F97,0x4AA0];  // ECC M
  const VER=[0x07C94,0x085BC,0x09A99,0x0A4D3];
  const RUN=[1,0,1,1,1,0,1];
  const score=g=>{
    let p=0;
    const line=get=>{
      for(let a=0;a<n;a++){
        let run=1;
        for(let b=1;b<n;b++){
          if(get(a,b)===get(a,b-1)) run++;
          else { if(run>=5) p+=3+run-5; run=1; }
        }
        if(run>=5) p+=3+run-5;
        for(let b=0;b<=n-7;b++){
          let hit=true;
          for(let k=0;k<7;k++) if(get(a,b+k)!==RUN[k]) { hit=false; break; }
          if(!hit) continue;
          /* Off the edge is the quiet zone, which is light - so a
             finder-alike hard against the border is the real hazard
             and has to be penalised, not excused. */
          let left=true, right=true;
          for(let k=1;k<=4;k++){
            if(b-k>=0   && get(a,b-k))   left=false;
            if(b+6+k<n  && get(a,b+6+k)) right=false;
          }
          if(left||right) p+=40;
        }
      }
    };
    line((a,b)=>g[a][b]); line((a,b)=>g[b][a]);
    for(let r=0;r<n-1;r++) for(let c=0;c<n-1;c++)
      if(g[r][c]===g[r][c+1]&&g[r][c]===g[r+1][c]&&g[r][c]===g[r+1][c+1]) p+=3;
    let dark=0; g.forEach(row=>row.forEach(x=>dark+=x));
    p+=Math.floor(Math.abs(dark*100/(n*n)-50)/5)*10;
    return p;
  };
  let best=null, bestP=Infinity;
  for(let k=0;k<8;k++){
    const g=m.map((row,r)=>Int8Array.from(row,(x,c)=>RES[r][c]?x:(x^(COND[k](r,c)?1:0))));
    const f=FMT[k];
    for(let i=0;i<15;i++){
      const bit=(f>>i)&1;
      g[i<6?i:i<8?i+1:n-15+i][8]=bit;                         // vertical strip
      g[8][i<8?n-1-i:i===8?7:14-i]=bit;                       // horizontal strip
    }
    if(ver>=7){
      const w=VER[ver-7];
      for(let i=0;i<18;i++){
        const bit=(w>>i)&1;
        g[(i/3)|0][n-11+i%3]=bit; g[n-11+i%3][(i/3)|0]=bit;
      }
    }
    const p=score(g);
    if(p<bestP){ bestP=p; best=g; }
  }
  return best.map(r=>[...r]);
}

/* Black on white, one rect per dark module, with the four-module quiet
   zone the standard asks for - without it a scanner sitting against
   the sheet's edge has nothing to lock onto. */
function qrSvg(m){
  const n=m.length, q=4, w=n+q*2;
  let d='';
  for(let r=0;r<n;r++){
    let c=0;
    while(c<n){                            /* runs, not squares - a
      quarter of the rects for the same picture */
      if(!m[r][c]){ c++; continue; }
      let e=c; while(e<n&&m[r][e]) e++;
      d+=`M${c+q} ${r+q}h${e-c}v1h${-(e-c)}z`;
      c=e;
    }
  }
  return `<svg viewBox="0 0 ${w} ${w}" xmlns="http://www.w3.org/2000/svg">`
    +`<rect width="${w}" height="${w}" fill="#fff"/>`
    +`<path d="${d}" fill="#000"/></svg>`;
}

/* Which of the boat's addresses to hand the phone.

   The Pi usually has two: the hotspot it runs for the boat, and
   whatever marina network the dongle joined. A phone standing at the
   helm is nearly always on the hotspot, so that address leads - but a
   phone on the shore network cannot reach 10.42.0.1 at all, so the
   others stay available behind a tap on the code. The kiosk's own
   location is no use here: it says localhost, which on a phone means
   the phone. */
function boatHosts(){
  const devs=((NET.st&&NET.st.wifi)||{}).devices||[];
  const port=location.port?':'+location.port:'', out=[];
  devs.filter(d=>d.ip).sort((a,b)=>(b.ap?1:0)-(a.ap?1:0)).forEach(d=>{
    const h=d.ip+port; if(out.indexOf(h)<0) out.push(h); });
  if(!out.length) out.push(location.host);   /* no helper: whatever served us */
  return out;
}

const QR={name:'',rel:'',hosts:[],i:0};
const hideQR=()=>$('qr-sheet').classList.remove('on');
function paintQR(){
  const host=QR.hosts[QR.i]||location.host;
  const url=location.protocol+'//'+host
           +location.pathname.replace(/[^/]*$/,'')+QR.rel;
  const m=qrMatrix(url);
  $('qr-name').textContent=QR.name;
  $('qr-url').textContent=url;
  $('qr-box').innerHTML=m?qrSvg(m):'';
  $('qr-box').style.display=m?'':'none';
  $('qr-why').textContent=m?'POINT YOUR PHONE CAMERA AT THIS'
                           :'TYPE THIS INTO YOUR PHONE';
  $('qr-alt').textContent = QR.hosts.length>1
    ? 'TAP THE CODE FOR '+QR.hosts[(QR.i+1)%QR.hosts.length].split(':')[0] : '';
}
function showQR(name,rel){
  /* The sheet is a child of #tmap. Raising it from anywhere else puts it
     off-screen where its own tap-to-dismiss cannot be reached, and every
     gesture on the page you ARE looking at goes to it instead. The one
     caller that can get here from another page is publishGPX, which
     awaits a round trip to netd - long enough to swipe away. The file is
     on the boat either way, and the flash says so; RACES has it. */
  if(PAGE_I!==0) return false;
  QR.name=name; QR.rel=rel; QR.hosts=boatHosts(); QR.i=0;
  paintQR();
  $('qr-sheet').classList.add('on');
  return true;
}
/* The code itself cycles the address; anywhere else puts the sheet away. */
$('qr-box').addEventListener('click',e=>{
  e.stopPropagation();
  if(QR.hosts.length<2) return void hideQR();
  QR.i=(QR.i+1)%QR.hosts.length; paintQR();
});
$('qr-sheet').addEventListener('click',e=>{ e.stopPropagation(); hideQR(); });

const closeLib=()=>{ hideQR(); $('t-lib').classList.remove('on'); };
function openLib(){ $('t-lib').classList.add('on'); renderLib(); }
/* Two lists, and the difference matters.

   SAVED HERE is IndexedDB: per origin and per device, so what the kiosk
   has recorded is invisible to a phone loading the same page. ON THE
   BOAT is the gpx folder AvNav serves, which every device on the boat
   WiFi can see - so those rows are plain links, and tapping one on a
   phone downloads the file into iOS Files. From there the share sheet
   reaches SailTies, HealthFit and anything else that eats GPX.

   The index is fetched from AvNav rather than from netd, deliberately:
   netd is loopback-only and a phone cannot reach it. Same origin as the
   app, so this works identically on the helm and in a pocket. */
function renderLib(){
  const box=$('lib-list');
  const kb=n=>n<1024?n+' B':(n/1024).toFixed(n<102400?1:0)+' kB';
  Promise.all([
    dbAll().catch(()=>null),
