   A canvas, not SVG - 80 moving streaks as DOM nodes would crawl on a
   Pi 4, whereas a 2D context redrawing them is nothing. Trails come
   from painting the background back over at low alpha rather than
   clearing, which is far cheaper than tracking history per particle.
   ================================================================== */
const saver=$('saver'), cv=$('ss-cv');
let ssOn=false, ssRaf=null, lastTouch=Date.now(), ssCycle=0;
const PT=[]; const NPT=80;

function ssInit(){
  const r=$('stage').getBoundingClientRect();
  cv.width=Math.round(r.width); cv.height=Math.round(r.height);
  PT.length=0;
  for(let i=0;i<NPT;i++) PT.push({
    x:Math.random()*cv.width, y:Math.random()*cv.height,
    len:8+Math.random()*26, a:0.15+Math.random()*0.5 });
}
function cssVar(n){ return getComputedStyle(document.body).getPropertyValue(n).trim(); }

function ssFrame(){
  if(!ssOn) return;
  const ctx=cv.getContext('2d'), W=cv.width, H=cv.height;

  // wind actually blowing across the boat drives the flow
  let awa=get('environment.wind.angleApparent');
  awa = awa===null ? 0 : awa*DEG;
  let aws=get('environment.wind.speedApparent');
  aws = aws===null ? 4 : aws*MS_TO_KT;
  const rad=awa*Math.PI/180;
  const vx=-Math.sin(rad), vy=Math.cos(rad);      // bow is up, so wind runs aft
  const v=Math.min(14, 0.9+aws*0.55);             // px per frame

  ctx.fillStyle=cssVar('--bg'); ctx.globalAlpha=0.16;
  ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=1;
  ctx.strokeStyle=cssVar('--accent'); ctx.lineCap='round';

  for(const p of PT){
    ctx.globalAlpha=p.a*0.5;
    ctx.lineWidth=1.6;
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    ctx.lineTo(p.x-vx*p.len, p.y-vy*p.len);
    ctx.stroke();
    p.x+=vx*v; p.y+=vy*v;
    // wrap, with a little jitter so they never form visible ranks
    if(p.x<-40){p.x=W+40;p.y=Math.random()*H;} if(p.x>W+40){p.x=-40;p.y=Math.random()*H;}
    if(p.y<-40){p.y=H+40;p.x=Math.random()*W;} if(p.y>H+40){p.y=-40;p.x=Math.random()*W;}
  }
  ctx.globalAlpha=1;
  ssRaf=requestAnimationFrame(ssFrame);
}

/* the centre value rotates so the screensaver still tells you things */
function ssTick(){
  if(ssOn){
    const now=new Date();
    $('ss-clock').textContent =
      String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    const page=Math.floor(Date.now()/8000)%4;
    if(page!==ssCycle){ ssCycle=page; }
    let lbl,val,unit;
    const sog=get('navigation.speedOverGround');
    let d=get('environment.depth.belowKeel'); if(d===null)d=get('environment.depth.belowTransducer');
    const aws=get('environment.wind.speedApparent');
    const awa=get('environment.wind.angleApparent');
    if(page===0){ lbl='SOG';   val=sog===null?'–':(sog*MS_TO_KT).toFixed(1); unit='KNOTS'; }
    else if(page===1){ lbl='DEPTH'; val=d===null?'–':Math.round(d*(CFG.depthUnit==='m'?1:M_TO_FT));
                       unit=CFG.depthUnit==='m'?'METRES':'FEET'; }
    else if(page===2){ lbl='WIND';  val=aws===null?'–':(aws*MS_TO_KT).toFixed(0); unit='KNOTS APP'; }
    else { lbl='ANGLE'; val=awa===null?'–':Math.abs(awa*DEG).toFixed(0)+'°';
           unit=awa===null?'':(awa>0?'STARBOARD':'PORT'); }
    $('ss-lbl').textContent=lbl; $('ss-val').textContent=val; $('ss-unit').textContent=unit;
  }
  // auto-blank after the chosen idle delay, if one is set
  const d=SS_DELAYS[ssStep];
  if(d && !ssOn && Date.now()-lastTouch>d) ssStart();
  setTimeout(ssTick,500);
}

function ssStart(){ if(ssOn)return; ssOn=true; ssInit(); saver.classList.add('on'); ssFrame(); }
function ssStop(){ ssOn=false; saver.classList.remove('on');
  if(ssRaf)cancelAnimationFrame(ssRaf); ssRaf=null; lastTouch=Date.now(); }

/* ---- ambient: one control, four states --------------------------------
   The old pair - a launch button and an on/off auto toggle - collapse
   into a single tile. Tap cycles the idle delay, press and hold starts
   it now. The delay is drawn inside the glyph rather than hidden behind
   a toggle, so the setting is readable at a glance without opening
   anything or remembering what "on" meant.                            */
const SS_DELAYS=[0, 10000, 60000, 300000];
const SS_TEXT  =['OFF','10s','1m','5m'];
let ssStep=0;
function drawAmbient(){
  const on=ssStep>0;
  $('ss-ico').innerHTML =
    '<circle cx="12" cy="12" r="9.4"/>'
    + (on ? '<text x="12" y="12" text-anchor="middle" dominant-baseline="central"'
          + ' font-size="9.4" font-weight="700">'+SS_TEXT[ssStep]+'</text>'
          : '<path d="M6.6 6.6l10.8 10.8"/>');
  $('ss-sub').textContent = SS_TEXT[ssStep];
  $('ss-btn').classList.toggle('on', on);
  $('ss-btn').classList.toggle('off', !on);
}

/* ---- fullscreen -------------------------------------------------------
   On the boat this is a no-op: the Pi already launches Chromium with
   --kiosk. It earns its place everywhere else - a phone or a laptop
   opening the same file gets browser chrome eating into the circle, and
   there is no keyboard out there to press F11 with. Note that --kiosk is
   not the Fullscreen API, so on the Pi this reads OFF even though the
   display is genuinely full screen; tapping it is still harmless.     */
const fsOn=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
/* Two different things can make this display full, and only one of them
   is visible to the page. A phone or a laptop has the Fullscreen API.
   The Pi runs --kiosk, which the API cannot see at all - which is why
   this tile used to read OFF on a display that was manifestly full, and
   why tapping it flipped its own label without changing a pixel.
   So: ask the helper which world we are in, and drive whichever one is
   real here. */
const kioskLive=()=>{
  const d=(typeof NET!=='undefined'&&NET.st&&NET.st.display)||{};
  if(d.cage) return false;            /* nothing to switch to - see below */
  return !!(d.available&&(d.kiosk||d.windowed));
};
function drawFs(){
  const d=(typeof NET!=='undefined'&&NET.st&&NET.st.display)||{};
  /* Under cage the tile is not merely useless, it is harmful. cage runs
     one maximized application; switching to "windowed" means killing
     its client, which makes cage itself exit, which cage-session.sh
     reads as a crash and restarts. You would get a black panel for a
     second, land exactly where you started, and spend one of the five
     quick-exit strikes that trigger the fall back to a desktop.
     So it goes, and the brightness slider takes the room. */
  $('fs-btn').style.display = d.cage ? 'none' : '';
  if(d.cage) return;
  const kiosk=kioskLive();
  const on = kiosk ? !!d.kiosk : fsOn();
  /* Before the helper has answered, this tile knows nothing - and a tile
     reading FULL / OFF beside an empty radio row is indistinguishable
     from the release before this one. Say "asking" instead of guessing. */
  if(typeof NET!=='undefined' && !NET.probed && !fsOn()){
    $('fs-ico').innerHTML='<path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/>';
    $('fs-lbl').textContent='FULL';
    $('fs-sub').textContent='…';
    $('fs-btn').classList.remove('on','off');
    return;
  }
  $('fs-ico').innerHTML = on
    ? '<path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6"/>'   /* arrows inward  */
    : '<path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/>';  /* arrows outward */
  $('fs-lbl').textContent = kiosk ? 'KIOSK' : 'FULL';
  $('fs-sub').textContent = on ? 'ON' : 'OFF';
  $('fs-btn').classList.toggle('on', on);
  $('fs-btn').classList.toggle('off', !on);
}
function fsTap(){
  if(kioskLive()){
    /* The helper answers before it acts, because what it does next is
       kill the browser this page is running in. This label is very
       likely the last thing this page ever draws. */
    const to = NET.st.display.kiosk ? 'window' : 'kiosk';
    $('fs-sub').textContent = to==='window' ? 'WINDOW…' : 'KIOSK…';
    netApi('/display/mode',{mode:to});
    return;
  }
  const el=document.documentElement;
  if(fsOn()){
    const x=document.exitFullscreen||document.webkitExitFullscreen;
    if(x) Promise.resolve(x.call(document)).catch(()=>{});
  }else{
    const q=el.requestFullscreen||el.webkitRequestFullscreen;
    if(q) Promise.resolve(q.call(el)).catch(()=>{});   /* refused: leave it OFF */
  }
}

/* Tap toggles how much screen this takes. HOLD reloads the app where it
   stands - the kiosk is left exactly as it is, which is how a deploy
   gets picked up at the helm with no SSH and no keyboard. A held reload
   is also the only kind a gesture can offer: killing the browser process
   needs a page that is already dead, and a dead page has nothing left to
   hold down. Same tap-versus-hold as the SAVER tile beside it. */
let fsHold=null, fsPt=null;
const fsFar=e=>!fsPt||Math.hypot(e.clientX-fsPt.x,e.clientY-fsPt.y)>24;
$('fs-btn').addEventListener('pointerdown',e=>{
  /* Deliberately NOT stopping propagation. This tile sits almost dead
     centre of the open panel, which is where a dismiss swipe starts -
     swallow the event and swipe-down stops closing the panel. So let it
     through, and tell a tap from a drag the way the dial does: 24 px. */
  fsPt={x:e.clientX,y:e.clientY};
  fsHold=setTimeout(()=>{ fsHold=null;
    $('fs-sub').textContent='RELOAD';
    setTimeout(()=>location.reload(),300); },600);
});
/* On the window, not the button: a finger that leaves the tile mid-drag
   never delivers pointerup to it, and the hold timer would go off under
   a swipe that was only ever passing through. */
addEventListener('pointermove',e=>{
  if(fsPt && fsHold!==null && fsFar(e)){ clearTimeout(fsHold); fsHold=null; }
});
addEventListener('pointerup',e=>{
  if(!fsPt) return;
  const held = fsHold===null;                     /* the hold already fired */
  const drag = fsFar(e);
  clearTimeout(fsHold); fsHold=null; fsPt=null;
  if(!held && !drag) fsTap();
});
addEventListener('pointercancel',()=>{ clearTimeout(fsHold); fsHold=null; fsPt=null; });
/* Circle when we are actually on round glass (a square viewport) or
   deliberately full screen; square everywhere else. Keyed off the shape
   of the viewport rather than fullscreen alone, because the Pi runs
   --kiosk, which is NOT the Fullscreen API - fullscreenElement is null
   there and a fullscreen-only test would wrongly un-round the panel. */
function fitStage(){
  const square = Math.abs(innerWidth/innerHeight - 1) < 0.06;
  document.documentElement.classList.toggle('win', !(fsOn() || square));
}
const drawFsAndFit=()=>{ drawFs(); fitStage(); };
document.addEventListener('fullscreenchange',drawFsAndFit);
document.addEventListener('webkitfullscreenchange',drawFsAndFit);
addEventListener('resize',fitStage);
/* A resize listener alone is not enough: it does not fire for every way a
   viewport can change (mobile toolbars sliding, embedded hosts resizing
   the frame). Watching the element itself catches all of them, and the
   handler is a single classList toggle, so the cost is nil.          */
if(window.ResizeObserver) new ResizeObserver(fitStage).observe(document.documentElement);
drawFsAndFit();

/* Deliberately NOT stopping propagation, and gated on distance - the
   same rule as fs-btn beside it, which this tile's comment always
   claimed to follow and did not. SAVER sits near the middle of the open
   panel, which is where a dismiss swipe starts: swallowing the events
   meant the swipe failed to close the panel AND walked the blank delay
   one step, so one bad swipe took it to 10 s and the helm started
   blanking ten seconds after every touch, mid-race, with nothing on
   screen to say why. judgeGesture returns early whenever the panel is
   open, so letting the events through costs nothing underneath. */
let ssHold=null, ssPt=null;
const ssFar=e=>!ssPt||Math.hypot(e.clientX-ssPt.x,e.clientY-ssPt.y)>24;
$('ss-btn').addEventListener('pointerdown',e=>{
  ssPt={x:e.clientX,y:e.clientY};
  ssHold=setTimeout(()=>{ ssHold=null;               /* held: start now */
    closePanel(); setTimeout(ssStart,460); }, 600);
});
const ssRelease=e=>{
  if(ssHold===null) return;                          /* the hold already fired */
  clearTimeout(ssHold); ssHold=null;
  if(ssFar(e)) return;                               /* a swipe, not a tap */
  ssStep=(ssStep+1)%SS_DELAYS.length;                /* tapped: next delay */
  drawAmbient(); lastTouch=Date.now();
};
$('ss-btn').addEventListener('pointerup',ssRelease);
$('ss-btn').addEventListener('pointercancel',()=>{ clearTimeout(ssHold); ssHold=null; });
drawAmbient();
saver.addEventListener('pointerdown',e=>{ e.stopPropagation(); ssStop(); });
addEventListener('pointerdown',()=>{ lastTouch=Date.now(); });
addEventListener('resize',()=>{ if(ssOn) ssInit(); });
ssTick();

/* keep the panel awake - belt and braces alongside kiosk settings */
if('wakeLock' in navigator){
  const hold=()=>navigator.wakeLock.request('screen').catch(()=>{});
  hold(); document.addEventListener('visibilitychange',hold);
}

drawBezelTicks();
/* Preferences first: applyTheme, drawDepth and applyDim below all read
   CFG, so restoring it has to happen before any of them run. */
prefsLoad(); applyDim(CFG.dim,false); layoutPages();
/* Warm the radio state at boot rather than on first panel open. The call
   costs a handful of subprocesses on the Pi, and doing it here means it
   has long finished by the time anyone swipes up - instead of the panel
   drawing its empty state and filling in while you watch. */
netStatus();
/* ---- the boot currents ----
   Drawn across 2160 so a -1080 drift loops seamlessly, which needs
   every wavelength to divide 1080 exactly. Generated rather than
   hand-authored: 361 points of path data is not something to keep by
   hand, and the three only differ by four numbers.

   All three settle onto y=660, so the collapse lands them on top of
   each other and the accent is the one left standing. */
(function bootWaves(){
  const path=(amp,wl,phase,y)=>{
    let d='';
    for(let x=0;x<=2160;x+=6)
      d+=(x?'L':'M')+x+' '+(y+amp*Math.sin((x/wl)*Math.PI*2+phase)).toFixed(1);
    return d;
  };
  const p1=$('bt-p1'), p2=$('bt-p2'), p3=$('bt-p3');
  if(!p1) return;
  p1.setAttribute('d', path(30,360,0.0,542));
  p2.setAttribute('d', path(38,540,1.9,660));
  p3.setAttribute('d', path(24,270,3.4,778));
  /* The ceiling. Signal K answering is what normally clears this; the
     timer is only here for when it never does. Guarded, so that a delta
     that beat us here keeps its own shorter timer. */
  if(BOOT.up && !BOOT.timer) BOOT.timer=setTimeout(bootSettle, BOOT.CEIL);
})();

drawDepth(); paintTrack(); applyTheme(); connect(); render(); tick();

</script>
</body>
</html>
