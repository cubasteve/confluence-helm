     off by itself the moment a real wind or depth reading arrives - so
     this default only ever applies to a boat with no instruments. It
     used to be a source constant with no control at all, which meant
     the shallow alarm spent its life firing on invented numbers.     */
  windDemo:true,

  basemap:true, tileBase:'tiles', tileMinZ:13, tileMaxZ:17,
  /* Anything not in the on-disk pack is fetched once and kept in
     IndexedDB, so new water caches itself the first time you look at it
     with a signal, and works offline every time after.                */
  /* tileCap bounds ONE cacheArea press; tileStoreCap bounds the store
     itself, which nothing bounded before. 8000 Esri JPEGs is roughly
     150-200 MB - several venues' worth - and past that the oldest go.
     Set it to 0 to keep everything, and watch the disk yourself. */
  tileFetch:true, tileCap:6000, tileStoreCap:8000,
  tileRemote:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile',

  /* The radio helper - netd.py, started from ~/.config/autostart/.
     Loopback on purpose: that address is what keeps the connectivity
     tiles off every phone and tablet that loads this same page over
     boat WiFi, without the page having to know who is asking.       */
  netd:'http://127.0.0.1:8091',

  /* Fingers a swipe wants. Three so that rain, spray and a sleeve cannot
     navigate the boat's instruments; one finger still taps, holds and
     works every button. Clamped at runtime by what the touchscreen can
     actually report - see FINGERS. */
  swipeFingers:3,                    /* PAGING only - see judgeGesture */

  depthAlarm:6, depthWarn:12, depthUnit:'ft',
  dim:100,                           /* brightness, 25-100 - see applyDim */
  grooveMin:35, grooveMax:50,
  staleAfter:8000, startMins:5,
  /* smoothing time constant in ms. Longer = calmer but laggier. Must stay
     above the SignalK feed period (250 ms) or the steps show through. */
  smoothTau:420,
  lat:28.61, lon:-81.27              // fallback until GPS gives a fix
};
const MS_TO_KT=1.94384, M_TO_FT=3.28084, DEG=180/Math.PI;
const CX=540, CY=540, R_OUT=516, R_MIN=492, R_MAJ=474, R_LBL=436;
const $=i=>document.getElementById(i);

function polar(r,d){const a=(d-90)*Math.PI/180;
  return [CX+r*Math.cos(a),CY+r*Math.sin(a)];}
function arcPath(r0,r1,d0,d1){
  const[x0,y0]=polar(r1,d0),[x1,y1]=polar(r1,d1),
       [x2,y2]=polar(r0,d1),[x3,y3]=polar(r0,d0);
  const b=Math.abs(d1-d0)>180?1:0;
  return `M${x0} ${y0} A${r1} ${r1} 0 ${b} 1 ${x1} ${y1}
          L${x2} ${y2} A${r0} ${r0} 0 ${b} 0 ${x3} ${y3} Z`;}

(function(){let o='';
  for(let d=-180;d<180;d+=5){const m=d%30===0;
    /* The tick at the foot is cut to the music bezel's major length (32,
       not the rose's 42) so the two faces read the same at the bottom -
       which is where you see them against each other as the pages slide,
       and where the page dots sit on both. */
    const rIn = d===-180 ? R_OUT-32 : (m?R_MAJ:R_MIN);
    const[a,b]=polar(rIn,d),[c,e]=polar(R_OUT,d);
    o+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${e}"
        stroke="${m?'var(--label)':'var(--hairline)'}"
        stroke-width="${m?4:2}" stroke-linecap="round"/>`;}
  [0,30,60,90,120,-30,-60,-90,-120].forEach(d=>{const[x,y]=polar(R_LBL,d);
    o+=`<text class="tick-lbl" x="${x}" y="${y}" text-anchor="middle">${Math.abs(d)}</text>`;});
  $('rose').innerHTML=o;
  $('groove-s').setAttribute('d',arcPath(R_LBL+18,R_OUT,CFG.grooveMin,CFG.grooveMax));
  $('groove-p').setAttribute('d',arcPath(R_LBL+18,R_OUT,-CFG.grooveMax,-CFG.grooveMin));
})();

/* ---------------- state ---------------- */
const S={},sm={},smA={};
/* ---------------- boot ----------------
   The currents drift for as long as the boat takes to answer, rather
   than for a fixed three seconds - so the panel never clears itself
   before there is anything behind it. Two bounds on that:

     MIN   the intro needs this long to finish arriving, and data on a
           warm restart can beat it. Clearing early would be a flash,
           not a sequence.
     CEIL  Signal K might never answer - a dead server, a pulled cable.
           A splash that waits forever for it is a bricked panel.

   Hooked to skMessage() and not to put(), which is the obvious place
   and the wrong one: windDemoTick() calls put() four times a second
   whether or not anything is connected, so a splash keyed off put()
   clears itself on a Pi with no Signal K at all and reports a boat
   that is not there.                                                  */
const BOOT={up:true, t0:Date.now(), MIN:1900, CEIL:6000, timer:0};
function bootSettle(){
  if(!BOOT.up) return;
  BOOT.up=false; clearTimeout(BOOT.timer);
  const el=$('boot'); if(!el) return;
  el.classList.add('settle');
  setTimeout(()=>{ $('stage').classList.remove('booting');   /* reveal beneath */
                   el.classList.add('gone'); }, 1000);
  /* display:none at the end, so a layer that is finished with costs the
     compositor nothing for the rest of the session. */
  setTimeout(()=>el.classList.add('off'), 1480);
}
function bootReady(){
  if(!BOOT.up) return;
  const waited=Date.now()-BOOT.t0;
  if(waited>=BOOT.MIN) return bootSettle();
  clearTimeout(BOOT.timer);
  BOOT.timer=setTimeout(bootSettle, BOOT.MIN-waited);
}

const put=(p,v)=>S[p]={v,t:Date.now()};
function get(p){const e=S[p];if(!e)return null;
  return Date.now()-e.t>CFG.staleAfter?null:e.v;}
/* ---- smoothing ---------------------------------------------------------
   This used to apply a fixed 0.25 per CALL. render() runs at 60 fps, so a
   reading reached its new value in about four frames - 70 ms - and then
   sat perfectly still for the rest of the 250 ms until the next delta
   arrived. Four little steps a second, each one a fast ease followed by
   a dead stop. That is exactly what reads as jitter rather than motion.

   Working from elapsed time against a time constant makes the filter
   frame-rate independent AND lets one step spread across the whole gap
   between readings, so the needle and the numbers move continuously.
   Tau wants to be comfortably longer than the feed period (250 ms).   */
let smAlpha=0.25, smPrev=0;
function tickSmoothing(){
  const now=performance.now();
  const dt=smPrev ? Math.min(now-smPrev, 500) : 16;   /* cap: after a slide
                                                        or a tab wake, do not
                                                        jump the whole way */
  smPrev=now;
  smAlpha=1-Math.exp(-dt/(CFG.smoothTau||420));
}
function smooth(k,v){if(v===null)return null;
  sm[k]=sm[k]===undefined?v:sm[k]+(v-sm[k])*smAlpha;return sm[k];}
function smoothAngle(k,deg){if(deg===null)return null;
  const r=deg*Math.PI/180,s=smA[k]||(smA[k]={x:Math.cos(r),y:Math.sin(r)});
  s.x+=(Math.cos(r)-s.x)*smAlpha;s.y+=(Math.sin(r)-s.y)*smAlpha;
  s.t=Date.now();                    /* when this filter last SAW something */
  return Math.atan2(s.y,s.x)*DEG;}
/* Read the already-smoothed angle without advancing the filter - the
   music bezel runs on its own timer and must not disturb the dial's.

   A staleness test has to be HERE and not only on the raw path. The dial
   calls smoothAngle only when the raw reading is non-null, so losing the
   vane does not decay this filter, it FREEZES it - and without a check
   the music page's wedge sat fully opaque on a dead bearing for as long
   as the page was up, with the two fallbacks below and the branch that
   hides the wedge all unreachable once an angle had arrived even once.
   The likely cause is not a chafed cable but any Signal K restart or
   WiFi drop, during which every other readout on that page empties.

   The budget is its own constant rather than CFG.staleAfter, because the
   two windows STACK: the raw reading stays valid for staleAfter, and
   only once get() starts returning null does this filter stop being
   advanced. A second staleAfter on top would hold the wedge for sixteen
   seconds. Something much tighter is right, because the DATA block
   advances this filter on every frame while a reading is live, on every
   page - the only legitimate gap is a page slide, and that is 420 ms.
   Past a couple of seconds the raw path has gone quiet, and its own
   staleAfter has already had its say. */
const SMA_HOLD=2500;
const smoothedAngle=k=>{
  const s=smA[k];
  if(!s || Date.now()-(s.t||0)>SMA_HOLD) return null;
  return Math.atan2(s.y,s.x)*DEG;
};

/* ---------------- Signal K ---------------- */
const PATHS=['navigation.speedOverGround','navigation.speedThroughWater',
 'navigation.position','navigation.headingMagnetic','navigation.courseOverGroundTrue',
 'navigation.attitude','navigation.rateOfTurn','environment.wind.directionTrue',
 'environment.depth.belowTransducer','environment.depth.belowKeel',
 'environment.wind.angleApparent','environment.wind.speedApparent',
 'environment.wind.angleTrueWater','environment.wind.speedTrue',
 'performance.velocityMadeGood',
 'confluence.track.recording','confluence.track.points'];
let ws,retry=1000;
const setLink=(c,t)=>{ document.getElementById('sensors').style.opacity =
  (t==='SIGNAL K'||t==='DEMO') ? '1' : '.35'; };

let skQueue=[];
function skDrain(){ const q=skQueue; skQueue=[]; q.forEach(skMessage); }
function skMessage(data){
  bootReady();                    /* the boat is talking - see BOOT above */
  let m; try{m=JSON.parse(data)}catch(x){return}
  if(m.requestId && puts[m.requestId]){          // answer to one of our PUTs
    puts[m.requestId](m); delete puts[m.requestId]; }
  (m.updates||[]).forEach(u=>(u.values||[]).forEach(v=>{
    /* A real instrument has turned up, so the made-up one stands down.
       This is the half of the switch that cannot be forgotten: the demo
       feed writes into the same store the sensors do, and left on it
       would sit on top of a genuine vane at 4 Hz - and go on firing the
       shallow alarm on numbers nobody measured. */
    if(CFG.windDemo && typeof v.value==='number' && DEMO_REAL.indexOf(v.path)>=0)
      demoSet(false, v.path);
    if(typeof v.value==='number'||typeof v.value==='boolean')put(v.path,v.value);
    else if(v.path==='navigation.position'&&v.value&&v.value.latitude!==undefined){
      put('pos.lat',v.value.latitude); put('pos.lon',v.value.longitude);
      CFG.lat=v.value.latitude;CFG.lon=v.value.longitude;}     // GPS drives sunset
    else if(v.path==='navigation.attitude'&&v.value){          // BNO080, 9-axis
      if(typeof v.value.roll ==='number')put('att.roll', v.value.roll);
      if(typeof v.value.pitch==='number')put('att.pitch',v.value.pitch);}
  }));
}

function connect(){
  if(CFG.demo){setLink('var(--warn)','DEMO');return demo();}
  try{ws=new WebSocket(`ws://${CFG.host||location.host}/signalk/v1/stream?subscribe=none`);}
  catch(e){return setTimeout(connect,retry);}
  ws.onopen=()=>{setLink('var(--stbd)','SIGNAL K');retry=1000;
    ws.send(JSON.stringify({context:'vessels.self',
      /* 'instant' pushed every path the moment it changed - 17 paths at
         NMEA rates is a continuous drizzle of small deltas landing at
         random moments, and each one is a task that can skip an
         animation frame. 'fixed' batches them onto a predictable 4 Hz
         beat instead. Slower data, smoother glass - a deliberate trade. */
      subscribe:PATHS.map(p=>({path:p,period:250,policy:'fixed'}))}));};
  /* Mid-slide the dial is completely hidden, so parsing a delta right
     now buys nothing visible and costs a frame: the parse is a discrete
     task that can land between two rAF callbacks and skip the animation
     past its deadline. Hold them and drain once the panel has landed -
     nothing is dropped, it just arrives 400 ms later than it would have. */
  ws.onmessage=e=>{
    if(Date.now()<slideUntil){ skQueue.push(e.data); return; }
    skMessage(e.data);
  };
  ws.onclose=()=>{setLink('var(--label)','RECONNECTING');
    retry=Math.min(retry*1.6,15000);setTimeout(connect,retry);};
  ws.onerror=()=>ws.close();
}
function demo(){
  // a boat sailing a slow S off Lake Monroe, so the track recorder and
  // the GPX export can actually be exercised with no GPS attached
  let t=0, dLat=28.8035, dLon=-81.2980, cog=0.9;
  setInterval(()=>{
    bootReady();                  /* demo mode is a boat, for these purposes */
    t+=.05;
    const sog=(5.4+Math.sin(t*.7)*.8)/MS_TO_KT;      // m/s
    cog += Math.sin(t*0.09)*0.004;
    const dt=0.12;                                    // seconds per tick
    dLat += (sog*dt*Math.cos(cog))/111320;
    dLon += (sog*dt*Math.sin(cog))/(111320*Math.cos(dLat*Math.PI/180));
    put('pos.lat',dLat); put('pos.lon',dLon);
    put('navigation.speedOverGround',sog);
    put('navigation.courseOverGroundTrue',cog);
    put('environment.depth.belowTransducer',(18+Math.sin(t*.3)*6)/M_TO_FT);
    put('environment.wind.angleApparent',(38+Math.sin(t*.9)*11)/DEG);
    put('environment.wind.angleTrueWater',(52+Math.sin(t*.6)*9)/DEG);
    put('environment.wind.speedTrue',(9.5+Math.sin(t*.4)*1.5)/MS_TO_KT);
    put('environment.wind.directionTrue',(cog*DEG+52+Math.sin(t*.2)*6)/DEG);
    put('att.roll',(12+Math.sin(t*.8)*5)/DEG);
  },120);}

/* ==================================================================
   SUN TIMES  (NOAA approximation, same maths as SunCalc)
   Position comes from Signal K once there is a fix, so the display
   follows the boat rather than a hardcoded home port.
   ================================================================== */
function sunTimes(date,lat,lon){
  const rad=Math.PI/180,J1970=2440588,J2000=2451545,
        toJ=d=>d.valueOf()/864e5-.5+J1970, fromJ=j=>new Date((j+.5-J1970)*864e5),
        days=d=>toJ(d)-J2000, e=rad*23.4397;
  const M=d=>rad*(357.5291+.98560028*d);
  const L=m=>m+rad*(1.9148*Math.sin(m)+.02*Math.sin(2*m)+.0003*Math.sin(3*m))
             +rad*102.9372+Math.PI;
  const dec=l=>Math.asin(Math.sin(e)*Math.sin(l));
  const J0=9e-4, lw=rad*-lon, phi=rad*lat, d=days(date);
  const n=Math.round(d-J0-lw/(2*Math.PI));
  const ds=J0+(0+lw)/(2*Math.PI)+n, m=M(ds), l=L(m);
  const Jnoon=J2000+ds+.0053*Math.sin(m)-.0069*Math.sin(2*l);
  const dd=dec(l), h=rad*-.833;
  const w=Math.acos((Math.sin(h)-Math.sin(phi)*Math.sin(dd))/(Math.cos(phi)*Math.cos(dd)));
  const a=J0+(w+lw)/(2*Math.PI)+n;
  const Jset=J2000+a+.0053*Math.sin(m)-.0069*Math.sin(2*l);
  return {sunrise:fromJ(Jnoon-(Jset-Jnoon)), sunset:fromJ(Jset)};
}
/* day between sunrise and sunset, dusk for the hour after sunset,
   night thereafter. Civil twilight is roughly 30 min, an hour is kinder. */
function autoTheme(){
  const now=new Date(), t=sunTimes(now,CFG.lat,CFG.lon);
  if(!t.sunrise||isNaN(t.sunrise))return 'day';
  const dusk=new Date(t.sunset.getTime()+60*60e3);
  if(now>=t.sunrise&&now<t.sunset)return 'day';
  if(now>=t.sunset&&now<dusk)return 'dusk';
  return 'night';
}

/* ---------------- theming ---------------- */
function applyTheme(){
  const eff = CFG.theme==='auto' ? autoTheme() : CFG.theme;
  document.body.className = eff==='day' ? '' : eff;
  /* Stored so the next boot can paint the right palette before any of
     this file has run - see the pre-paint stamp at the top of <body>.
     Only on change: applyTheme runs every minute on auto. */
  if(eff!==THEME_EFF){ THEME_EFF=eff;
    try{ localStorage.setItem(THEME_KEY, eff); }catch(e){} }
  $('theme-ico').innerHTML = ICON[CFG.theme];
  /* On auto the mode and the outcome are different facts and you want
     both: the label says AUTO, the line under it says what the clock has
     actually chosen right now. Manual modes have nothing to resolve.  */
  $('theme-lbl').textContent = CFG.theme.toUpperCase();
  $('theme-sub').textContent = CFG.theme==='auto' ? eff.toUpperCase() : '';
  $('theme-btn').classList.toggle('on', CFG.theme!=='auto');
}
setInterval(()=>{ if(CFG.theme==='auto') applyTheme(); }, 60000);

/* ---------------- render ---------------- */
let showSTW=false;
const fmt=(v,d)=>v===null?'––':v.toFixed(d);

/* Is the dial actually on screen? Every slide-out is a full-bleed opaque
   layer, so while one is up nothing painted underneath can be seen. The
   overlays have always been demand-driven - they only draw while open -
   and the dial was the one view that ignored that and painted regardless. */
/* ---- write-through cache ----------------------------------------------
   A good share of the dial's writes set a value that is already there:
   the race strip's display, the four sensor glyphs, the SOG/STW label.
   Each no-op write still costs an invalidation, so compare first.

   Deliberately NOT applied to the readouts. Those genuinely change every
   frame now that the filter emits small continuous steps, so a comparison
   there would be pure overhead for a guaranteed miss.                  */
const _w=new Map();
const wSty =(id,p,v)=>{const k=id+'|s|'+p; if(_w.get(k)===v)return; _w.set(k,v); $(id).style[p]=v;};
const wAttr=(id,a,v)=>{const k=id+'|a|'+a; if(_w.get(k)===v)return; _w.set(k,v); $(id).setAttribute(a,v);};
const wText=(id,v)  =>{const k=id+'|t';    if(_w.get(k)===v)return; _w.set(k,v); $(id).textContent=v;};
const wCls =(id,c,o)=>{const k=id+'|c|'+c; if(_w.get(k)===o)return; _w.set(k,o); $(id).classList.toggle(c,o);};

/* The app dock is NOT on this list. The panel covers the glass and a
   running app replaces it, but a dock leaves the dial in plain sight -
   and a dial frozen in plain sight reads as a crash. */
const dialVisible=()=>PAGE_I===1
                   && !panel.classList.contains('open')
                   && !APP.on
                   && !ssOn;

/* DRAW rate. See the gate in render() for why this is not 60 Hz. */
const DRAW_MS=50;
let lastDraw=0;
function render(){
  /* mid-slide: the dial is behind an opaque panel, so none of the work
     below can be seen. Skip it and let the compositor have the frame. */
  if(Date.now()<slideUntil){
    trackSample();
    return requestAnimationFrame(render);
  }
  if(skQueue.length) skDrain();     /* the slide is over - catch up on data */

  /* ================= DATA - always runs =================================
     Every filter advances on every frame no matter what is on screen. It
     has to: the music panel's wind bezel reads these same filters, so
     skipping them while the dial is covered would freeze the wedge in
     mid-sweep. This block touches no DOM at all - it is a dozen reads and
     seven exponential steps, which is nothing.                        */
  tickSmoothing();
  const sogR=get('navigation.speedOverGround'),stwR=get('navigation.speedThroughWater');
  const useS=showSTW&&stwR!==null,raw=useS?stwR:sogR;
  const spd=smooth('spd',raw===null?null:raw*MS_TO_KT);

  let d=get('environment.depth.belowKeel');
  if(d===null)d=get('environment.depth.belowTransducer');
  const met=CFG.depthUnit==='m';
  const dv=smooth('dpt',d===null?null:(met?d:d*M_TO_FT));

  const awaR=get('environment.wind.angleApparent');
  const awa=awaR===null?null:smoothAngle('awa',awaR*DEG);
  const twaR=get('environment.wind.angleTrueWater');
  const twa=twaR===null?null:smoothAngle('twa',twaR*DEG);
  const tws=smooth('tws',(v=>v===null?null:v*MS_TO_KT)(get('environment.wind.speedTrue')));

  const roll=get('att.roll');
  const heel=smooth('heel', roll===null?null:Math.abs(roll*DEG));

  let vR=get('performance.velocityMadeGood');
  if(vR===null&&sogR!==null&&twaR!==null)vR=sogR*Math.cos(twaR);
  const vmg=smooth('vmg',vR===null?null:vR*MS_TO_KT);

  trackSample();                    /* the log must not care what is on top */

  /* Sensor liveness lives in DATA now that the glyphs are on the control
     panel. Left in DRAW it would freeze whenever the panel was open -
     which is precisely when someone is looking at them. The writes are
     cached, so a frame where nothing changed costs nothing. */
  const live=(el,ok)=>wCls(el,'live',ok);
  live('s-gps', get('navigation.position')!==null||sogR!==null);
  live('s-dpt', d!==null);
  live('s-wnd', awaR!==null);
  live('s-hdg', get('navigation.headingMagnetic')!==null);

  /* Alerts are evaluated HERE, in DATA, and not in the DRAW block below.
     The shallow alarm used to be a class toggle inside the dial's draw
     gate, which meant it did not run at all while the map or the music
     panel was open - precisely when nobody is watching the number. */
  if(dv===null) alertClear('depth');
  else{
    /* NO conversion here. dv was already put into the display unit at
       the top (met ? d : d*M_TO_FT), and CFG.depthAlarm is in display
       units too - the FT/M toggle changes the unit without touching the
       number, the +/- steppers move it by 1 in whatever is showing, and
       drawDepth scales it against BAR_MAX(). Converting a second time
       divided a 6 M alarm down to 1.83 m: the bar marker sat inside the
       red zone while nothing fired, and depthWarn was wrong by the same
       factor so there was no SHOALING either. Nothing at all until
       1.83 m - and since 'alarm' is what wakes the screensaver, a slept
       panel stayed asleep through it. */
    const aV=CFG.depthAlarm, wV=CFG.depthWarn;
    const u=met?'M':'FT';
    /* Whole units in the text on purpose: to a tenth it would rewrite
       the banner several times a second for no added meaning. */
    if(dv<aV)      alertRaise('depth','alarm','SHALLOW · '+Math.round(dv)+' '+u,
                              'ALARM SET AT '+CFG.depthAlarm+' '+u);
    else if(dv<wV) alertRaise('depth','warn','SHOALING · '+Math.round(dv)+' '+u,'');
    else           alertClear('depth');
  }

  /* ================= DRAW - only when the dial can be seen ============= */
  /* ...and only 20 times a second, not 60.

     DATA above stays at frame rate - the filters have to, or the music
     page's bezel would freeze in mid-sweep while the dial is covered.
     DRAW does not. It is ~44 writes into a 128-element SVG, fifteen of
     them middle-anchored <text> replacements that re-measure glyph
     advance, and two transform ATTRIBUTE rotations that go through SVG
     layout rather than the compositor. Running that 60 times a second
     was 34% of the main thread, against 24% for the music page, which
     does no DOM work in render() at all and hands its 60 fps motion to
     a CSS transition instead.

     Measured on the panel: 20 Hz cuts main-thread time 37-47% and the
     needles are indistinguishable - the filters smooth over 420 ms, so
     three frames is well inside one time constant. DRAW_MS is a
     constant rather than a literal so 33 (30 Hz) is a one-token change
     if the marks ever look stepped. */
  if(dialVisible() && Date.now()-lastDraw>=DRAW_MS){
  lastDraw=Date.now();
  $('spd').textContent=fmt(spd,1);
  $('spd').classList.toggle('stale',spd===null);
  wText('spd-label', useS?'STW':'SOG');

  const de=$('dpt');
  de.textContent=fmt(dv,dv!==null&&dv<100?1:0);
  de.classList.toggle('stale',dv===null);
  const alarmV=CFG.depthAlarm, warnV=CFG.depthWarn;   /* display units both - see above */
  de.classList.toggle('alarm',dv!==null&&dv<alarmV);
  de.classList.toggle('warn', dv!==null&&dv>=alarmV&&dv<warnV);

  const ag=$('awa-mark');
  if(awa===null)ag.setAttribute('opacity','0');
  else{ag.setAttribute('opacity','1');
    ag.setAttribute('transform',`rotate(${awa} ${CX} ${CY})`);
    $('awa-tri').setAttribute('fill',awa<0?'var(--port)':'var(--stbd)');}

  const tg=$('twa-mark');
  tg.setAttribute('opacity',twa===null?'0':'.9');
  if(twa!==null)tg.setAttribute('transform',`rotate(${twa} ${CX} ${CY})`);

  /* ---- performance strip ---- */
  const racing = CFG.racePro && tState==='countdown';
  wSty('strip','display', racing?'none':'');
  wSty('pings','display', racing?'':'none');
  // with racePro off the strip carries TWS alone, centred
  wAttr('p-tws','x', CFG.racePro?322:540);
  wSty('p-tgt','display', CFG.racePro?'':'none');
  wSty('p-shf','display', CFG.racePro?'':'none');
  $('p-tws').textContent = 'TWS '+fmt(tws,1)+(CFG.racePro?'':' KT');

  let tgtPct=null;
  if(CFG.racePro && tws!==null && twa!==null && sogR!==null){
    const t=targetSpeed(tws,twa);
    if(t>0.3) tgtPct=(sogR*MS_TO_KT)/t*100;
  }
  $('p-tgt').textContent = tgtPct===null?'TGT ––':'TGT '+tgtPct.toFixed(0)+'%';
  $('p-tgt').classList.toggle('good', tgtPct!==null&&tgtPct>=98);
  $('p-tgt').classList.toggle('bad',  tgtPct!==null&&tgtPct<90);

  let twdDeg=get('environment.wind.directionTrue');
  twdDeg = twdDeg===null?null:twdDeg*DEG;
  const sh = CFG.racePro ? windShift(twdDeg, awa) : null;
  const shEl=$('p-shf');
  if(sh===null||sh.deg<2){ shEl.textContent='STEADY'; shEl.className='strip'; }
  else { shEl.textContent=(sh.lift?'LIFT ':'HEADER ')+sh.deg.toFixed(0)+'°';
         shEl.className='strip '+(sh.lift?'good':'bad'); }

  /* ---- three cells, contextual on race state ---- */
  const L = (CFG.racePro && racing) ? lineData() : null;
  if(L){
    wText('c1-lbl','TO LINE');
    wText('c2-lbl','BIAS');
    wText('c3-lbl','BURN');
    const dm = met ? L.dist : L.dist*M_TO_FT;
    de.textContent = Math.abs(dm)>999?'999':Math.round(dm);
    de.classList.toggle('alarm', L.dist<0);          // over early
    de.classList.remove('warn','stale');
    wText('dpt-u', met?'METRES':'FEET');
    $('c2').textContent  = Math.abs(L.bias).toFixed(0)+'°';
    $('c2b').textContent = L.favoured+' +'+Math.round(met?L.gain:L.gain*M_TO_FT);
    $('c2').classList.remove('stale'); $('c2b').classList.remove('stale');
    $('vmg').textContent = L.burn===null?'––':(L.burn>0?'+':'')+L.burn;
    $('vmg').classList.toggle('alarm', L.burn!==null&&L.burn<0);
    wText('c3-u','SECONDS');
  } else {
    wText('c1-lbl','DEPTH');
    wText('c3-lbl','VMG');
    wText('c3-u','KNOTS');
    wText('dpt-u', CFG.depthUnit==='m'?'METRES':'FEET');
    if(CFG.showHeel){
      wText('c2-lbl','HEEL');
      $('c2').textContent  = heel===null?'––':heel.toFixed(0)+'°';
      $('c2b').textContent = roll===null?'' : (roll>0?'STBD':'PORT');
      $('c2').classList.toggle('stale',heel===null);
      $('c2b').classList.toggle('stale',heel===null);
    } else {
      wText('c2-lbl','TWA');
      $('c2').textContent  = twa===null?'––':Math.abs(twa).toFixed(0)+'°';
      $('c2b').textContent = twa===null?'' : (twa>0?'STBD':'PORT');
      $('c2').classList.toggle('stale',twa===null);
      $('c2b').classList.toggle('stale',twa===null);
    }
  }

  if(!L){ $('vmg').textContent=fmt(vmg,1);
          $('vmg').classList.toggle('stale',vmg===null);
          $('vmg').classList.remove('alarm'); }

  }
  /* ================= end DRAW ========================================= */

  /* The control panel's depth bar lives OUTSIDE the dial gate on purpose:
     it is drawn exactly when the panel is open, which is exactly when the
     dial is not visible. Putting it inside would have silently killed it. */
  if(panel.classList.contains('open')){
    const mx=BAR_MAX();
    $('bar-now').style.left = dv===null ? '-20px'
      : Math.min(100,Math.max(0,dv/mx*100))+'%';
    $('bar-now').style.opacity = dv===null?'0':'1';
  }
  /* the sparkline gains a point about once a second - repainting the
     whole canvas 60 times a second to redraw the same line is pure heat */
  /* !ssOn on both of these, the same test dialVisible() makes. Without
     it the map page kept repainting behind a fully opaque screensaver -
     and drawMap is an 800-node innerHTML rebuild, running once a second
     against a 60 fps canvas on the same thread, on a panel that stays
     powered for weeks. */
  if(tmap.classList.contains('open') && !ssOn && Date.now()-lastTrackPaint>250){
    lastTrackPaint=Date.now(); paintTrack();
  }
  /* watch the track draw itself. 1 Hz matches the sample rate, so redrawing
     faster would only redraw the same line. Slides skip this entirely -
     the early return above fires long before we get here.              */
  if(tmap.classList.contains('open') && !ssOn && trackLive() && !VIEWTRK
     && Date.now()-lastMapDraw>1000){
    lastMapDraw=Date.now();
    /* Local recording redraws from TRK, which grew a point since the
       last pass. Plugin recording has to go and ask, so it does that at
       5 s and draws the answer - never TRK, which is not its track. */
    if(serverTrack()){
      if(Date.now()-srvAt>5000) fetchServerTrack().then(p=>{ if(p) drawMap(p); });
    } else drawMap(TRK);
  }
  requestAnimationFrame(render);
}


/* ==================================================================
   POLARS  -  target boat speed as a function of TWS and TWA
 
   THESE NUMBERS ARE ESTIMATES for a Capri 22 (2000 lb, ~230 sq ft).
   They are NOT measured polars. Treat 100% as "about right" until you
   have real data. The honest way to build a real table is to sail
   steady angles in steady breeze, log SOG/TWA/TWS, and take the 90th
   percentile of what you actually achieved. Then replace this block.
   Hull speed for 20 ft LWL is about 6.0 kt, which is why the table
   flattens out up top.
   ================================================================== */
const POLAR_TWS=[4,6,8,10,12,14,16,20];
const POLAR_TWA=[30,35,40,45,52,60,70,80,90,100,110,120,135,150,165,180];
const POLAR=[
 [1.0,1.5,2.0,2.4,2.8,3.1,3.3,3.4,3.4,3.3,3.1,2.9,2.5,2.1,1.8,1.6],
 [1.6,2.3,2.9,3.3,3.7,4.0,4.3,4.4,4.4,4.3,4.1,3.9,3.4,2.9,2.5,2.3],
 [2.0,2.9,3.6,4.0,4.4,4.7,5.0,5.1,5.1,5.0,4.9,4.7,4.2,3.7,3.2,3.0],
 [2.3,3.3,4.1,4.5,4.9,5.2,5.4,5.5,5.6,5.6,5.5,5.3,4.9,4.4,3.9,3.6],
 [2.5,3.6,4.4,4.8,5.2,5.4,5.7,5.8,5.9,6.0,6.0,5.9,5.5,5.0,4.5,4.2],
 [2.6,3.8,4.6,5.0,5.4,5.6,5.9,6.0,6.2,6.3,6.4,6.3,6.0,5.5,5.0,4.7],
 [2.7,3.9,4.7,5.1,5.5,5.8,6.0,6.2,6.4,6.6,6.7,6.7,6.4,5.9,5.4,5.1],
 [2.8,4.0,4.8,5.2,5.6,5.9,6.2,6.4,6.7,6.9,7.1,7.1,6.9,6.4,5.9,5.6]];

function lerpIdx(arr,v){                       // fractional index into a table
  if(v<=arr[0])return[0,0];
  if(v>=arr[arr.length-1])return[arr.length-1,0];
  let i=0; while(arr[i+1]<v)i++;
  return[i,(v-arr[i])/(arr[i+1]-arr[i])];
}
function targetSpeed(tws,twa){                 // bilinear over the table
  twa=Math.abs(twa); if(twa>180)twa=360-twa;
  const[i,fi]=lerpIdx(POLAR_TWS,tws), [j,fj]=lerpIdx(POLAR_TWA,twa);
  const i2=Math.min(i+1,POLAR_TWS.length-1), j2=Math.min(j+1,POLAR_TWA.length-1);
  const a=POLAR[i][j] +(POLAR[i][j2] -POLAR[i][j] )*fj;
  const b=POLAR[i2][j]+(POLAR[i2][j2]-POLAR[i2][j])*fj;
  return a+(b-a)*fi;
}

/* ==================================================================
   LIFT / HEADER
   Compare the wind now against a slow average of where it has been.
   Which way a shift helps depends on the tack, so the sign flips.
   ================================================================== */
/* The running mean the shift is measured against. Five minutes is long
   enough that a persistent shift shows and a puff does not. */
const TWD_TAU=300000;
let twdAvg=null, twdAt=0;
function windShift(twd, awa){
  if(twd===null||awa===null) return null;
  const r=twd*Math.PI/180, now=Date.now();
  if(twdAvg===null){ twdAvg={x:Math.cos(r),y:Math.sin(r)}; twdAt=now; }
  /* Elapsed time, not per call - the same correction tickSmoothing
     already carries. The constant here was 0.002 per CALL reasoned as
     "~5 min at 4 Hz", but the only call site is inside render()'s DRAW
     block: at 60 fps that made tau 8.3 s, about fifteen times too fast.
     An 8 degree lift over two minutes settled to a 0.56 degree residual,
     which is under the sh.deg<2 STEADY cutoff below - so the strip read
     STEADY through the entire lift, which is the one thing it exists to
     not do. And now that DRAW is rate limited, a per-call constant would
     additionally depend on which page you happened to be looking at.

     The dt cap matters: DRAW does not run while the panel, the map or
     the screensaver is up, so coming back after ten minutes would
     otherwise snap the mean straight onto the current reading and
     report no shift at all. */
  const dt=Math.min(now-twdAt, 4000);
  twdAt=now;
  const a=1-Math.exp(-dt/TWD_TAU);
  twdAvg.x+=(Math.cos(r)-twdAvg.x)*a;
  twdAvg.y+=(Math.sin(r)-twdAvg.y)*a;
  const avg=Math.atan2(twdAvg.y,twdAvg.x)*DEG;
  let d=twd-avg; while(d>180)d-=360; while(d<-180)d+=360;
  // starboard tack (wind from starboard, awa>0): a veer is a lift
  return {deg:Math.abs(d), lift: awa>0 ? d>0 : d<0, raw:d};
}

/* ==================================================================
   START LINE
   Ping each end while sailing past it. Everything after that is
   plane geometry on a local east/north grid - good to a few cm over
   a start line, which is far better than GPS itself.
   ================================================================== */
let LINE = JSON.parse(localStorage.getItem('startline')||'{}');
const saveLine=()=>localStorage.setItem('startline',JSON.stringify(LINE));
function pingEnd(which){
  const la=get('pos.lat'), lo=get('pos.lon');
  if(la===null||lo===null) return;
  LINE[which]={lat:la,lon:lo}; saveLine();
}
function toXY(lat,lon,lat0,lon0){              // metres east / north
  return { x:(lon-lon0)*111320*Math.cos(lat0*Math.PI/180),
           y:(lat-lat0)*111320 };
}
function lineData(){
  if(!LINE.pin||!LINE.boat) return null;
  const la=get('pos.lat'), lo=get('pos.lon');
  if(la===null||lo===null) return null;
  const P=toXY(LINE.pin.lat ,LINE.pin.lon ,LINE.pin.lat,LINE.pin.lon);
  const B=toXY(LINE.boat.lat,LINE.boat.lon,LINE.pin.lat,LINE.pin.lon);
  const C=toXY(la,lo,LINE.pin.lat,LINE.pin.lon);
  const vx=B.x-P.x, vy=B.y-P.y, len=Math.hypot(vx,vy);
  if(len<1) return null;

  let twd=get('environment.wind.directionTrue');
  twd = twd===null ? null : twd*DEG;
  if(twd===null){                              // fall back to heading + TWA
    const h=get('navigation.courseOverGroundTrue'), t=get('environment.wind.angleTrueWater');
    if(h!==null&&t!==null) twd=(h+t)*DEG;
  }
  if(twd===null) return null;

  // unit normal to the line, pointing upwind
  const ux=Math.sin(twd*Math.PI/180), uy=Math.cos(twd*Math.PI/180);
  let nx=-vy/len, ny=vx/len;
  if(nx*ux+ny*uy < 0){ nx=-nx; ny=-ny; }

  const wx=C.x-P.x, wy=C.y-P.y;
  const dist = -(wx*nx+wy*ny);                 // + = still to go, - = over early

  // bias: how far the line is off square to the wind
  let lineBrg=Math.atan2(vx,vy)*DEG;
  let bias=lineBrg-(twd+90); while(bias>180)bias-=360; while(bias<-180)bias+=360;
  const gain=Math.abs(len*Math.sin(bias*Math.PI/180));
  const favoured = bias>0 ? 'PIN' : 'BOAT';

  // burn: countdown remaining minus time to reach the line on this course
  let burn=null;
  const sog=get('navigation.speedOverGround'), cog=get('navigation.courseOverGroundTrue');
  if(sog!==null&&cog!==null&&tState==='countdown'){
    const c=cog*DEG*Math.PI/180;
    const closing=sog*(Math.sin(c)*nx+Math.cos(c)*ny)*-1;   // m/s toward the line
    if(closing>0.05){
      const tToLine=dist/closing;
      burn=Math.round((tEnd-Date.now())/1000 - tToLine);
    }
  }
  return {dist, bias, gain, favoured, burn, len};
}


/* ==================================================================
   TALKING BACK TO SIGNAL K
   The websocket is bidirectional - a PUT goes out on the same socket
   the data arrives on, and the server answers with the same requestId.
   Needs write permission: either Signal K security off, or an
   approved device token.
   ================================================================== */
const puts={};
function skPut(path, value, done){
  if(!ws || ws.readyState!==1) return done && done({statusCode:0});
  const id = (crypto.randomUUID?crypto.randomUUID():String(Math.random()));
  puts[id]=done;
  ws.send(JSON.stringify({context:'vessels.self', requestId:id, put:{path, value}}));
  setTimeout(()=>{ if(puts[id]){ puts[id]({statusCode:408}); delete puts[id]; } },4000);
}
/* the plugin announces itself by publishing its own state */
const serverTrack=()=>get('confluence.track.recording')!==null;

/* ==================================================================
   RACE TRACK  ->  GPX
   Records from the moment the countdown starts until you finish, so
   the approach to the line is in there too, not just the race.
   1 Hz is plenty - an hour is 3600 points, about 400 kB of GPX.
   Kept in localStorage as it goes, so a crash or a reload does not
   cost you the race.
   ================================================================== */
let TRK = JSON.parse(localStorage.getItem('racetrack')||'[]');
let trkLast = 0;

let localArmed=false;              // manual override for the record button
function trackSample(){
  if(serverTrack()) return;          // the plugin owns recording
  const rec = localRec();          /* the one definition - see localRec */
  if(!rec) return;
  const now=Date.now();
  if(now-trkLast < 1000) return;               // 1 Hz
  const la=get('pos.lat'), lo=get('pos.lon');
  if(la===null||lo===null) return;
  trkLast=now;
  TRK.push({t:now, la:+la.toFixed(7), lo:+lo.toFixed(7),
            s:+((get('navigation.speedOverGround')||0)).toFixed(2),
            c:+((get('navigation.courseOverGroundTrue')||0)).toFixed(3)});
  if(TRK.length>TRK_MAX) TRK.splice(0, TRK.length-TRK_MAX);
  trkDirty=true;                     /* the write itself is on a timer */
}

/* ---- persisting the track ----
   This used to run inline, right here, every fifteenth point: a full
   JSON.stringify of TRK plus a synchronous localStorage write, on the
   animation frame that was drawing the dial. Four hours of points is
   ~1 MB of string, which is 35-60 ms on the Pi's A72 - and the very
   worst place it landed was inside the slide guard, the one branch
   whose whole purpose is to hand the compositor a clean 420 ms.

   So: a timer, skipped while anything is sliding, and a cap. TRK was
   unbounded before - nothing trimmed it, and saveRace() copies rather
   than clears, so a season accumulated into one key until the ~5 MiB
   quota threw and the empty catch swallowed it. 20k points is over five
   hours at 1 Hz, far past any race, and about 1.4 MB.

   And a failure is now visible. `catch(e){}` meant the buffer that
   exists so a crash does not cost you the race stopped working with no
   sign at all - at exactly the moment, finishRace(), when you most
   believe it is safe. */
const TRK_MAX=20000;
let trkDirty=false, trkSaveBad=false;
function trkSave(){
  try{
    localStorage.setItem('racetrack',JSON.stringify(TRK));
    trkDirty=false;
    if(trkSaveBad){ trkSaveBad=false; paintTrack(); }
    return true;
  }catch(e){
    if(!trkSaveBad){ trkSaveBad=true; paintTrack(); }
    return false;
  }
}
setInterval(()=>{
  if(!trkDirty) return;
  if(Date.now()<slideUntil) return;   /* never during a page transition */
  trkSave();
}, 15000);
function trackClear(){
  TRK=[]; localStorage.removeItem('racetrack');
  trkDirty=false; trkSaveBad=false;      /* the space is back */
  MAPVIEW=null; tileKey='';
  paintTrack(); drawMap(TRK);
}

function buildGPX(pts){
  pts=pts||TRK;
  const iso=ms=>new Date(ms).toISOString();
  const head=`<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Confluence Helm"
     xmlns="http://www.topografix.com/GPX/1/1"
     xmlns:gpxtpx="http://www.garmin.com/xmlschemas/TrackPointExtension/v1">
 <metadata>
  <name>Confluence race ${iso(pts[0].t)}</name>
  <time>${iso(pts[0].t)}</time>
 </metadata>
 <trk><name>Confluence 45</name><trkseg>
`;
  const body=pts.map(p=>
`  <trkpt lat="${p.la}" lon="${p.lo}"><time>${iso(p.t)}</time>`+
`<extensions><gpxtpx:TrackPointExtension>`+
`<gpxtpx:speed>${p.s}</gpxtpx:speed>`+
`<gpxtpx:course>${(p.c*180/Math.PI).toFixed(1)}</gpxtpx:course>`+
`</gpxtpx:TrackPointExtension></extensions></trkpt>`).join('\n');
  return head+body+'\n </trkseg></trk>\n</gpx>\n';
}

/* Safari on iOS turns a Blob download into the share sheet, which is
   where "Save to Files -> iCloud Drive" lives. So opening this page
   on the iPad and tapping export is the whole iCloud story - the Pi
   never needs credentials for anything. */
function exportGPX(pts){
  pts=pts||TRK;
  if(!pts.length) return;
  const d=new Date(pts[0].t);
  const pad=n=>String(n).padStart(2,'0');
  const name=`Confluence-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`
            +`-${pad(d.getHours())}${pad(d.getMinutes())}.gpx`;
  const blob=new Blob([buildGPX(pts)],{type:'application/gpx+xml'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},1500);
}

/* A transient line in the track page's status slot. paintTrack() owns
   that text and the render loop repaints it four times a second, so a
   flash has to hold the slot rather than just write into it - hence the
   deadline paintTrack() checks below. */
let trkFlashUntil=0;
function trkFlash(msg,ms){
  $('trk-n').textContent=msg;
  trkFlashUntil=Date.now()+(ms||4500);
}

/* Send the track to the boat rather than to this browser's downloads.
   netd writes it into the folder AvNav serves, so a phone on the boat
   WiFi can then fetch it - which is the whole point. The file never
   goes near the phone from here; the phone comes and gets it. */
async function publishGPX(pts,label){
  pts=pts||TRK;
  if(!pts.length) return trkFlash('no track to send');
  const d=new Date(pts[0].t), pad=n=>String(n).padStart(2,'0');
  const stamp=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`
             +`-${pad(d.getHours())}${pad(d.getMinutes())}`;
  const nice=(label&&label!=='Race track')?label+'-'+stamp:'Confluence-'+stamp;
  trkFlash('sending…',30000);
  const j=await netApi('/gpx/save',{name:nice, xml:buildGPX(pts)});
  if(!j||!j.ok) return trkFlash((j&&j.error)||'send failed');
  trkFlash('on the boat · also in RACES',7000);
  showQR(j.name.replace(/\.gpx$/,''), j.url);   /* point the phone at it,
     if the map is still what is showing - see showQR */
}

let lastTrackPaint=0;
function paintTrack(){
  const srv=serverTrack();
  /* shownTrack(), not TRK. With a race loaded out of the library and TRK
     empty - SAVE then CLEAR - the map showed the loaded race's distance
     and max speed while the line under it read "no track" and dimmed
     GPX and CLEAR to .35. Nothing sets disabled, so both still worked:
     the dimming was pure misinformation about what was on screen. */
  const n = VIEWTRK ? VIEWTRK.length
                    : (srv ? (get('confluence.track.points')||0) : TRK.length);
  /* A loaded race is never growing, whoever is recording. Otherwise this
     is exactly trackLive(), so ask it rather than restate it. */
  const rec = VIEWTRK ? false : trackLive();
  const fix = get('pos.lat')!==null;
  let txt;
  if(n)            txt = `${n} pts · ${Math.round(n/60)} min`;
  else if(rec&&!fix) txt = 'waiting for GPS';
  else if(rec)     txt = 'recording…';
  else             txt = 'no track';
  /* A failed save has to say so. The whole point of the buffer is that a
     crash does not cost you the race, and silently not having one is
     worse than not having one at all. */
  if(trkSaveBad && !srv && !VIEWTRK) txt += ' · NOT SAVED';
  if(Date.now()>trkFlashUntil)            // a flash holds the slot
    $('trk-n').textContent = txt + (VIEWTRK ? ' · saved' : (srv ? '' : ' · local'));
  $('trk-rec').classList.toggle('on', rec);
  $('trk-rec').style.opacity = '1';
  $('trk-exp').style.opacity = n ? '1' : '.35';
  $('trk-clr').style.opacity = n ? '1' : '.35';
}

/* record button only means anything when the plugin is there - in
   local mode recording is tied to the race clock instead */
$('trk-rec').addEventListener('click',()=>{
  if(!serverTrack()){ localArmed=!localArmed; paintTrack(); return; }
  const want = !get('confluence.track.recording');
  skPut('confluence.track.recording', want, r=>{
    if(r.statusCode>=400||r.statusCode===0)
      $('trk-n').textContent = r.statusCode===408?'no reply':'refused '+r.statusCode;
  });
});

/* ---------------- race clock ----------------
   Real club-race order, not a generic stopwatch:

     IDLE       tap ............ start the 5 minute prep countdown
     COUNTDOWN  tap ............ sync down to the nearest whole minute
                double tap ..... you crossed - start the race clock
                reaches 0:00 ... starts the race clock by itself
     RACING     double tap ..... finished, freeze the elapsed time
     any state  hold 0.7 s ..... reset back to idle

   The countdown self-starts the race at zero so a missed double tap
   never costs you the whole race time; crossing early or late is what
   the manual double tap is for.                                     */
let tState='idle';                        // idle | countdown | racing | finished
let tEnd=0;                               // countdown: wall-clock zero
let tGun=0;                               // racing: wall-clock start
let tFinal=0;                             // finished: frozen elapsed
let tLeft=CFG.startMins*60000;            // countdown remaining while idle

const startCountdown=()=>{ tEnd=Date.now()+tLeft; tState='countdown'; };
const syncMinute =()=>{ if(tState!=='countdown')return;
    tEnd=Date.now()+Math.max(0,Math.round((tEnd-Date.now())/60000)*60000); };
const startRace  =()=>{ tGun=Date.now(); tState='racing'; };
const finishRace =()=>{ tFinal=Date.now()-tGun; tState='finished';
  trkSave();                     /* reports its own failure - see trkSave */
  paintTrack(); };
const resetAll   =()=>{ tState='idle'; tLeft=CFG.startMins*60000; };

/* +/- only mean anything before the gun */
function nudge(sec){
  if(tState==='countdown') tEnd=Math.max(Date.now(), tEnd+sec*1000);
  else if(tState==='idle') tLeft=Math.max(0, tLeft+sec*1000);
}

function clock(ms){
  const s=Math.floor(ms/1000), h=Math.floor(s/3600);
  const m=Math.floor(s/60)%60, ss=s%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`
           : `${Math.floor(s/60)}:${String(ss).padStart(2,'0')}`;
}

function tick(){
  const el=$('timer'), lb=$('timer-lbl');
  let ms, lbl, dim=false, hot=false;

  if(tState==='idle'){ ms=tLeft; lbl='START'; dim=true; }
  else if(tState==='countdown'){
    ms=tEnd-Date.now();
    if(ms<=0){ startRace(); ms=0; }        // gun goes, race clock runs
    lbl='COUNTDOWN'; hot=ms<60000;
  }
  else if(tState==='racing'){ ms=Date.now()-tGun; lbl='RACING'; }
  else { ms=tFinal; lbl='FINISH'; }

  el.textContent=clock(Math.max(0,ms));
  lb.textContent=lbl;
  el.classList.toggle('stale',dim);
  el.classList.toggle('alarm',hot);
  // a finished time pulses so it is obviously frozen, not still running
  el.style.opacity=(tState==='finished'&&Math.floor(Date.now()/600)%2)?'.4':'';

  const off = (tState==='racing'||tState==='finished');
  $('t-plus').style.opacity = $('t-minus').style.opacity = off?'.2':'1';
  setTimeout(tick,120);
}

/* ==================================================================
   GESTURES
   Swipe up  -> panel.  Swipe down -> dismiss.
   A tap is only a tap if the finger moved less than 24 px, so
   scrolling never fires the timer by accident.
   ================================================================== */
const panel=$('panel');
const apps =$('apps');
/* ---- slide guard ----------------------------------------------------
   While a panel slides, the dial underneath is completely covered by an
   opaque layer - so render()'s 44 SVG writes per frame are invisible
   work that steals the main thread from the compositor and shows up as
   a stutter in the slide itself. Freeze them for the length of the
   transition. GPS sampling keeps running throughout: a 340 ms hole in
   the track would be a real loss, a 340 ms stale readout that nobody
   can see is not.                                                     */
const SLIDE_MS=420;                     /* must match the CSS transition */
let slideUntil=0, slideClear=null;

/* Promotion is switched on for the length of the slide and off again
   afterwards. panel, tmap and music are looked up when this RUNS, not
   when it is defined - two of the three are declared further down the
   file, and capturing them here would read them before they exist.   */
const markSlide=(tag)=>{
  slideUntil=Date.now()+SLIDE_MS;
  const els=[panel,apps,tmap,music];
  els.forEach(el=>el.classList.add('sliding'));
  clearTimeout(slideClear);
  slideClear=setTimeout(()=>els.forEach(el=>el.classList.remove('sliding')),
                        SLIDE_MS+80);
  startProbe(tag);
};

/* ---- frame probe -----------------------------------------------------
   Answers the one question worth answering: is a slide dropping frames,
   or is it a solid 60 that simply is not to taste? Those want opposite
   fixes - the first wants less main-thread work, the second wants a
   different curve. Costs nothing while CFG.fpsProbe is false. A kiosk
   has no devtools to read, so it paints its own verdict on the glass. */
let probeRaf=null, probeTag='';
function startProbe(tag){
  if(!CFG.fpsProbe) return;
  if(probeRaf) cancelAnimationFrame(probeRaf);
  probeTag=tag||'?';
  const gaps=[]; let last=performance.now();
  const until=last+SLIDE_MS;
  const step=now=>{
    gaps.push(now-last); last=now;
    if(now<until) probeRaf=requestAnimationFrame(step);
    else { probeRaf=null; showProbe(gaps); }
  };
  probeRaf=requestAnimationFrame(step);
}

/* The log survives a reload: a kiosk gets restarted a lot and losing the
   samples to an accidental refresh would be maddening. Capped so it can
   never grow without bound on a display that runs for weeks.          */
const FPS_KEY='helmFps';
function fpsLoad(){ try{ return JSON.parse(localStorage.getItem(FPS_KEY))||[]; }
                    catch(e){ return []; } }
function fpsSave(l){ try{ localStorage.setItem(FPS_KEY,JSON.stringify(l)); }catch(e){} }
function showProbe(g){
  if(!g.length) return;
  const worst=Math.max.apply(null,g);
  const tot=g.reduce((a,b)=>a+b,0);
  const fps=Math.round(1000*g.length/tot);
  const late=g.filter(x=>x>20.8).length;      /* >20.8 ms missed a 60 Hz beat */

  /* the raw gaps matter as much as the summary - a stall on frame 1 is a
     layer being promoted, a stall in the middle is someone else's work */
  const log=fpsLoad();
  log.push({ t:Date.now(), tag:probeTag, n:g.length, ms:+tot.toFixed(1),
             fps:fps, worst:+worst.toFixed(1), late:late,
             gaps:g.map(x=>+x.toFixed(1)) });
  if(log.length>200) log.splice(0, log.length-200);
  fpsSave(log);

  const N=CFG.fpsProbeN||20;
  const el=$('fps');
  el.textContent=fps+' fps  worst '+worst.toFixed(1)+' ms  '
                +late+'/'+g.length+' late   ['+log.length+'/'+N+']';
  el.classList.add('on');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('on'), 2600);
  console.log('[slide]',probeTag,fps+'fps','worst',worst.toFixed(1)+'ms',
              'late',late+'/'+g.length);

  if(log.length>=N && log.length%N===0) dumpProbe(log);
}

/* Downloads land in ~/Downloads, which is the only channel off this box
   that does not need a server - same trick the GPX export already uses. */
function dumpProbe(log){
  const d=new Date(), pad=n=>String(n).padStart(2,'0');
  const name='helm-fps-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())
            +'-'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())+'.json';
  const body={ ua:navigator.userAgent, dpr:devicePixelRatio,
               screen:[screen.width,screen.height],
               slideMs:SLIDE_MS, samples:log };
  const blob=new Blob([JSON.stringify(body,null,1)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},1500);
  const el=$('fps');
  el.textContent='saved '+name;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('on'), 3000);
}

/* ---- pages ----
   0 track map, 1 dial, 2 music. The .open classes are kept in step with
   the index so everything that already asks whether the map or the music
   panel is showing keeps working untouched. */
let PAGE_I=1;
const PAGE_EL=[()=>tmap, ()=>$('svg'), ()=>music];
function layoutPages(){
  PAGE_EL.forEach((get,i)=>{
    get().style.transform='translateX('+((i-PAGE_I)*100)+'%)'; });
  tmap .classList.toggle('open',PAGE_I===0);
  music.classList.toggle('open',PAGE_I===2);
  if(typeof mqPage==='function') mqPage();   /* stop the names travelling off-page */
  const d=$('dots').children;
  for(let i=0;i<d.length;i++) d[i].classList.toggle('on',i===PAGE_I);
}
function goPage(i){
  i=Math.max(0,Math.min(PAGE_EL.length-1,i));
  if(i===PAGE_I) return;
  /* Both of these live inside #tmap, which is translated fully
     off-screen the moment PAGE_I leaves 0. Left up they would be raised
     where nobody can see or tap them, and judgeGesture hands whichever
     is showing ownership of every gesture - so a sheet stranded off the
     map silently ate the dial's taps and swipes. */
  if(PAGE_I===0){ hideQR(); $('t-lib').classList.remove('on'); }
  PAGE_I=i; markSlide('page-'+i); layoutPages();
  if(i===0) mapEntered();          /* the map has work to do on arrival */
}

const openPanel =()=>{ if(APP.on) return; closeApps();
                       markSlide('panel-open');  panel.classList.add('open');
                       netPanelOpen();  };
const closePanel=()=>{ markSlide('panel-close'); panel.classList.remove('open');
                       netPanelClose(); };
const openApps  =()=>{ if(APP.on) return; closePanel();
                       drawApps(); markSlide('apps-open');
                       apps.classList.add('open'); };
const closeApps =()=>{ markSlide('apps-close'); apps.classList.remove('open'); };
/* Within reach of the dock: on it, or the width of a thumb around it. */
const DOCK_REACH=110;
const nearDock=(x,y)=>{
  const d=$('apps-dock'); if(!d) return true;
  const r=d.getBoundingClientRect();
  return y>=r.top-DOCK_REACH && y<=r.bottom+DOCK_REACH
      && x>=r.left-DOCK_REACH && x<=r.right+DOCK_REACH;
};
/* Anywhere off the dock closes it. The dock itself swallows the tap so
   that reaching for an app is not also a way to dismiss the thing you
   are reaching into. */
apps.addEventListener('click', e=>{ if(e.target===apps) closeApps(); });
const showMusic =()=>goPage(2);
const hideMusic =()=>goPage(1);
const hideMap   =()=>goPage(1);
const openMap   =()=>goPage(0);

/* ---- how many fingers ----
   Two answers, because the two gestures are not the same risk.

   PAGING between the three dials takes the full hand. Changing which
   instrument you are looking at mid-race because a wave put a wrist on
   the glass is the failure worth designing against.

   RAISING AND DISMISSING things - the control panel, the picker, the
   library - takes one. Those are all visibly reversible: whatever
   appeared is on screen and a swipe puts it away, so a stray touch
   costs a second rather than your instruments.

   Clamped by what the hardware can actually report. A panel that tracks
   fewer touches than CFG.swipeFingers asks for would otherwise have no
   paging at all - and one finger still reaches the control panel, which
   is where the setting that would fix that lives. A mouse reports zero
   touch points, so a desktop browser falls back to one. */
const FINGERS=Math.max(1,Math.min(CFG.swipeFingers|0||1,
                                  navigator.maxTouchPoints||1));

/* A gesture is every finger that was down between the first touch and
   the last lift. Tracking them as a set rather than a single point is
   what lets three-finger swipes exist at all, and it keeps the tap and
   hold behaviour exactly as it was: those still want one finger. */
let G=null;

/* "this touch belongs to a button, do not also read it as a gesture."
   The way to say that used to be stopPropagation() on pointerup, and it
   was a trap: the pointerdown had ALREADY bubbled to #stage and bumped
   the counter, so swallowing the release left G.live stuck above zero
   with nothing able to bring it back down. One tap on the countdown +
   and the panel, paging, the race clock and hold-to-reset were dead for
   the rest of the session, recoverable only by a power cycle - and
   because tick() dims those buttons while racing without disabling
   them, a stray mid-race tap did it with no feedback at all.

   Claiming says the same thing without touching event flow, so the
   counter can never go out of step. Written to work whichever order the
   listeners run in: at the target this fires BEFORE #stage's handler
   creates G, so it creates it. */
const gClaim=()=>{
  if(!G) G={p:new Map(), live:0, max:0, t0:Date.now(), claimed:false};
  G.claimed=true;
};
$('stage').addEventListener('pointerdown',e=>{
  if(!G) G={p:new Map(), live:0, max:0, t0:Date.now(), claimed:false};
  G.p.set(e.pointerId,{x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY});
  G.live++; G.max=Math.max(G.max,G.live);
});
$('stage').addEventListener('pointermove',e=>{
  const q=G&&G.p.get(e.pointerId);
  if(!q) return;
  q.x=e.clientX; q.y=e.clientY;
  /* A hold control claims the gesture the moment it is touched, so that
     holding it cannot also fire the dial's own hold-to-reset. But a
     finger that STARTS on one and then travels is a swipe, and the
     claim has to give way - otherwise every hold control is a patch of
     glass you cannot swipe from, and the lock sits at the bottom centre
     of the dial, right where a thumb reaches to pull the dock up.
     Opt-in, because the claims that are NOT holds - the radar scrub,
     the volume ring - drag on purpose and must keep theirs. */
  if(G.releaseOnDrag && Math.hypot(q.x-q.x0,q.y-q.y0)>24){
    G.claimed=false; G.releaseOnDrag=false; holdCancel();
  }
});
const endGesture=e=>{
  if(!G) return;
  const q=G.p.get(e.pointerId);
  if(!q || q.up) return;               /* not ours, or already counted out */
  q.x=e.clientX; q.y=e.clientY;
  q.up=true;                           /* idempotent: up AND cancel can both fire */
  if(--G.live>0) return;               /* other fingers still down */
  const g=G; G=null;
  if(!g.claimed) judgeGesture(g);
};
/* On window, in the CAPTURE phase, so that a release is counted before
   anything downstream gets the chance to swallow it. A finger that went
   into G always comes back out. */
addEventListener('pointerup',endGesture,true);
addEventListener('pointercancel',endGesture,true);

function judgeGesture(g){
  /* The average of every finger's travel. One finger that slips while
     the other two hold still is not a swipe, and averaging says so. */
  let dx=0,dy=0;
  g.p.forEach(q=>{ dx+=q.x-q.x0; dy+=q.y-q.y0; });
  dx/=g.p.size; dy/=g.p.size;
  const dt=Date.now()-g.t0, n=g.max;
  const moved=Math.hypot(dx,dy), quick=dt<700;
  /* One finger is enough to raise or dismiss something; only paging
     between the dials asks for the whole hand. See FINGERS above. */
  const up    = quick && dy<-70 && Math.abs(dy)>Math.abs(dx);
  const down  = quick && dy> 70 && Math.abs(dy)>Math.abs(dx);
  const swipeL= quick && dx<-70 && Math.abs(dx)>Math.abs(dy);
  const swipeR= quick && dx> 70 && Math.abs(dx)>Math.abs(dy);
  /* Where the gesture STARTED, averaged the same way its travel is. */
  let sx=0, sy=0; g.p.forEach(q=>{ sx+=q.x0; sy+=q.y0; });
  sx/=g.p.size; sy/=g.p.size;
  const left  = swipeL && n>=FINGERS;
  const right = swipeR && n>=FINGERS;

  /* Whichever overlay is showing OWNS the gestures. The innermost thing
     up is what a dismiss swipe dismisses, and nothing else acts: you
     cannot page sideways out from under the control panel, and a stray
     drag cannot fire the race timer underneath it. */
  /* Whichever surface is up owns the gestures, innermost first. A
     launched app is over both drawers, so it is asked before them. */
  if(APP.on){ if(down) closeApp(); return; }
  /* The panel came DOWN from the top, so UP is what sends it back. */
  if(panel.classList.contains('open')){
    if(up){ if(netsheet.classList.contains('on')) closeNet(); else closePanel(); }
    return; }
  /* The dock came UP from the bottom, so DOWN sends it back - but only
     from the dock's own patch of glass. It covers a strip at the foot
     and leaves the dial in plain sight; a flick anywhere on that dial
     should not dismiss a thing sitting somewhere else entirely. Reach
     is generous rather than exact, because a thumb aiming at a card is
     not aiming at its border. A tap off the dock still closes it. */
  if(apps.classList.contains('open')){ if(down && nearDock(sx,sy)) closeApps();
                                       return; }
  /* The race library is a sheet over the map page and owns the gesture
     while it is up - paging out from underneath it would strand it. */
  if($('qr-sheet').classList.contains('on')){ if(swipeL||swipeR) hideQR(); return; }
  if($('t-lib').classList.contains('on')){ if(swipeL||swipeR) closeLib(); return; }

  /* Two drawers, opposite edges, opposite gestures - the way a phone
     does it. DOWN pulls the control panel from the top, UP pulls the app
     drawer from the bottom, and each goes back the way it came. Both are
     one finger: they are what you reach for most and the cheapest to
     undo. Left and right move through the pages, and those are the
     gestures that still want three fingers. */
  if(down)  return openPanel();
  if(up)    return openApps();
  if(left)  return goPage(PAGE_I+1);
  if(right) return goPage(PAGE_I-1);

  /* Taps and holds are one finger, wherever the swipes have got to. */
  if(n!==1) return;
  if(moved>24) return;                       // a drag, not a tap
  if(PAGE_I!==1) return;                     // the taps below are the dial's
  if(dt>700){ clearTimeout(tapTimer); tapTimer=null; lastTap=0;
              return resetAll(); }           // hold anywhere = reset

  const one=g.p.values().next().value;
  const r=$('stage').getBoundingClientRect();
  const y=(one.y-r.top)/r.height;
  if(y<0.33)      timerTap();
  else if(y<0.68) showSTW=!showSTW;
}

/* A single tap waits out one double-tap window so the first half of a
   double never fires the single action. 320 ms is about the shortest
   that still feels deliberate with cold hands. */
const DBL=320; let tapTimer=null, lastTap=0;
function timerTap(){
  const now=Date.now();
  if(now-lastTap < DBL){                       // -------- double tap
    clearTimeout(tapTimer); tapTimer=null; lastTap=0;
    if(tState==='countdown') startRace();      // crossed the line
    else if(tState==='racing') finishRace();   // done
    else if(tState==='idle') startCountdown();
    return;
  }
  lastTap=now;
  tapTimer=setTimeout(()=>{                    // -------- single tap
    tapTimer=null;
    if(tState==='idle') startCountdown();
    else if(tState==='countdown') syncMinute();
  }, DBL);
}

/* ---------------- preferences ----------------
   Everything this panel lets you change used to live only in memory. A
   kiosk restart - which happens on every deploy, every autopull and every
   crash - silently put the theme, the units, the shallow alarm and the
   brightness back to their defaults. An instrument that forgets how you
   set it is not one you can trust to be set.

   Validated on the way in rather than trusted. This storage outlives every
   version of the app that has ever run on this Pi, and a value that is
   merely old must not be able to break the boot.                      */
const PREFS_KEY='helmPrefs';
const PREF_DEFS={
  theme:      v=>THEMES.indexOf(v)>=0 ? v : null,
  depthUnit:  v=>(v==='ft'||v==='m') ? v : null,
  depthAlarm: v=>(typeof v==='number'&&v>=1&&v<=60)  ? Math.round(v) : null,
  dim:        v=>(typeof v==='number'&&v>=25&&v<=100)? Math.round(v) : null,
  /* Persisted so that turning it off is permanent. Before, it was a
     source-code default with no panel control at all: the only way off
     was to edit the file, and until someone did, the shallow alarm was
     firing on invented depth. */
  windDemo:   v=>typeof v==='boolean' ? v : null
};
function prefsLoad(){
  let raw={};
  try{ raw=JSON.parse(localStorage.getItem(PREFS_KEY)||'{}')||{}; }catch(e){ return; }
  Object.keys(PREF_DEFS).forEach(k=>{
    const v=PREF_DEFS[k](raw[k]);
    if(v!==null&&v!==undefined) CFG[k]=v;
  });
  CFG.depthWarn=CFG.depthAlarm*2;      /* derived, never stored */
}
function prefsSave(){
  try{
    const out={};
    Object.keys(PREF_DEFS).forEach(k=>{ out[k]=CFG[k]; });
    localStorage.setItem(PREFS_KEY,JSON.stringify(out));
  }catch(e){}                          /* full or disabled: not worth a fuss */
}

/* ---------------- panel controls ---------------- */
const THEMES=['auto','day','dusk','night'];
const ICON={
 auto:'<circle cx="20" cy="20" r="14" fill="none" stroke="currentColor" stroke-width="3"/>'

 day :'<circle cx="20" cy="20" r="8" fill="currentColor"/><g stroke="currentColor" '
     +'stroke-width="3" stroke-linecap="round"><path d="M20 2v5M20 33v5M2 20h5M33 20h5'
     +'M7 7l3.5 3.5M29.5 29.5L33 33M33 7l-3.5 3.5M10.5 29.5L7 33"/></g>',
 dusk:'<path d="M8 26a12 12 0 0 1 24 0" fill="currentColor"/><g stroke="currentColor" '
     +'stroke-width="3" stroke-linecap="round"><path d="M3 31h34M20 4v5M5 12l3 3M35 12l-3 3"/></g>',
 night:'<path d="M27 25A13 13 0 0 1 15 6a14 14 0 1 0 12 19z" fill="currentColor"/>'};
$('theme-btn').addEventListener('click',()=>{

/* Flipping the unit converts the threshold with it. Carrying the raw
   number across silently redefined the alarm by 3.28x, and in the
   dangerous direction one way round: a 6 M alarm became a 6 FT one -
   under two metres - with the panel still showing the figure you set. */
$('r-units').addEventListener('click',()=>{
  const toM = CFG.depthUnit==='ft';
  CFG.depthUnit = toM?'m':'ft';
  CFG.depthAlarm = Math.max(1, Math.min(60,
    Math.round(toM ? CFG.depthAlarm/M_TO_FT : CFG.depthAlarm*M_TO_FT)));

/* ---- brightness ----
   Two mechanisms, and only one of them is real dimming. The veil is a
   black layer painted over the picture: the backlight stays at full
   behind it, so at night it still lights the cockpit and it saves no
   power at all. netd can drive the actual backlight where the kernel
   exposes one and udev has made it writable - so use that when it is
   there, and say SOFT when it is not, rather than quietly doing less
   than the slider implies. */
let BL={available:false};
let dimAt=0, dimPend=null, dimT=null;
function dimSend(pct){
  /* Coalesced: a drag fires input continuously, and each send is a write
     to a sysfs file. Eight a second is smooth and costs nothing. */
  const now=Date.now();
  clearTimeout(dimT);
  if(now-dimAt>=120){ dimAt=now; dimPend=null; netApi('/backlight',{pct:pct}); }
  else { dimPend=pct; dimT=setTimeout(()=>{ if(dimPend!==null) dimSend(dimPend); },130); }
}
function applyDim(pct,push){
  CFG.dim=pct;
  if($('dim').value!=String(pct)) $('dim').value=pct;
  /* Until the helper has answered we do not know which mechanism is real,
     and guessing the veil would flash the panel dark for the second it
     takes to find out - most visible at exactly the low settings someone
     chose for night. So show the number, and wait to act on it. */
  const known = (typeof NET!=='undefined') && NET.probed;
  $('dim-pct').textContent = pct+'%';
  if(BL.available){
    $('veil').style.opacity='0';
    if(push!==false) dimSend(pct);
  }else if(known){
    $('veil').style.opacity=String((100-pct)/100*0.8);
  }
}
$('dim').addEventListener('input',e=>applyDim(+e.target.value));
$('dim').addEventListener('change',()=>prefsSave());

const BAR_MAX=()=>CFG.depthUnit==='m'?12:40;      // full scale of the bar
function drawDepth(){
  const mx=BAR_MAX();
  $('d-val').textContent=CFG.depthAlarm;
  $('d-unit').textContent=CFG.depthUnit==='m'?'M':'FT';
  $('bar-mid').textContent=Math.round(mx/2);
  $('bar-max').textContent=mx;
  $('bar-alarm').style.width=(CFG.depthAlarm/mx*100)+'%';
  $('bar-warn').style.left =(CFG.depthAlarm/mx*100)+'%';
  $('bar-warn').style.width=((CFG.depthWarn-CFG.depthAlarm)/mx*100)+'%';
  /* through the cache, so the dial's DRAW block and this cannot end up
     disagreeing about what the label already says */
  wText('dpt-u', CFG.depthUnit==='m'?'METRES':'FEET');
}
$('d-up').addEventListener('click',()=>{
  CFG.depthAlarm++; CFG.depthWarn=CFG.depthAlarm*2; drawDepth(); prefsSave();});
$('d-down').addEventListener('click',()=>{

                        drawDepth(); prefsSave(); }});


/* timer sync: nudge a whole minute, only while the clock is running */
/* gClaim rather than stopPropagation - see the comment on it. These two
   sit in the top third of the dial, which is timerTap()'s zone, so the
   gesture reader must be told to ignore the tap; it must not be stopped
   from SEEING it. */

/* ==================================================================
   CONNECTIVITY  ·  WiFi adapters and Bluetooth
   A browser cannot see either radio. There is no web API for WiFi at
   all, and navigator.bluetooth pairs a device to the *page*, which is
   a different thing from pairing it to the Pi. So the buttons talk to
   netd.py over loopback, and it shells out to nmcli and bluetoothctl.

   Being loopback-only does the access control for free: on a phone
   loading this same page over boat WiFi, CFG.netd resolves to the
   phone, nothing answers, and the row stays empty. No guest gets to
   re-point the boat's networking.

   WiFi is per adapter. The onboard radio is usually the hotspot the
   whole boat is joined to and the dongle is the one reaching out, so
   they get a button each - and taking the hotspot down needs a second,
   deliberate tap, because everything aboard is riding on it.
   ================================================================== */
const netsheet=$('netsheet');
const NET={ kind:'wifi', dev:null, page:0, rows:[], powered:false, ap:false,
            scanning:false, busy:'', pw:null, st:{}, tilesHtml:'', probed:false,
            confirm:'', confirmT:null, poll:null, tick:null };
const PAGE=4;                      /* rows per page - matches .ns-list height */

/* SSIDs and Bluetooth names come off the air and go into innerHTML.
   Anyone within range can call their access point <img onerror=...>,
   so nothing from the helper is trusted as markup. */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* A fetch that is guaranteed to settle. Every plain fetch() in this file
   talks to something on the boat - Signal K, the track plugin, AvNav -
   and a box that is powered but wedged accepts the connection and then
   says nothing, so the promise never rejects and never resolves. The
   three callers that had no deadline each failed differently and none of
   them failed visibly: the map never drew, the race library withheld
   rows already on the device, and pollMusic - which reschedules AFTER
   its await - stopped for the rest of the session on one stalled reply.
   Rejects on timeout, so a caller's existing catch is what handles it. */
function fetchT(url, ms){
  const ac=new AbortController();
  const t=setTimeout(()=>ac.abort(), ms||8000);
  return fetch(url,{signal:ac.signal,cache:'no-store'})
    .finally(()=>clearTimeout(t));
}

async function netApi(path, body){
  const ctl=new AbortController();
  /* Joining a network legitimately takes half a minute; reading a list
     never does. One timeout for both would either abandon a connect
     mid-handshake or leave the panel hanging on a helper that died. */
  const t=setTimeout(()=>ctl.abort(), body?50000:9000);
  try{
    const r=await fetch(CFG.netd+path,{ signal:ctl.signal, cache:'no-store',
      method: body?'POST':'GET',
      headers: body?{'Content-Type':'application/json'}:undefined,
      body: body?JSON.stringify(body):undefined });
    return r.ok ? await r.json() : null;
  }catch(e){ return null; }         /* no helper, or it is busy with nmcli */
  finally{ clearTimeout(t); }
}

function setMsg(txt,bad){
  ['ns-msg','pw-msg','ask-msg'].forEach(id=>{
    $(id).textContent=txt||'';
    $(id).classList.toggle('bad',!!bad&&!!txt);
  });
}

/* ---- the icons ----
   These are the whole interface, so each state has to be readable at a
   glance and unmistakable for the others. */
function icoWifi(d){
  const off=!d.up;
  let o='';
  if(d.ap){
    /* a base station with waves coming off it. Deliberately NOT the
       client fan, which is also arcs over a dot and would read the
       same from a metre away. */
    o+='<rect x="4" y="13.6" width="16" height="6.6" rx="2.2"/>'
      +'<circle class="f" cx="7.6" cy="16.9" r="1"/>'
      +'<path d="M9.2 10.3a5.6 5.6 0 0 1 5.6 0"/>'
      +'<path d="M6.6 6.7a10.5 10.5 0 0 1 10.8 0"/>';
  }else{
    const lvl = d.signal>=70?3 : d.signal>=45?2 : d.signal>0?1:0;
    const fade=n=>off?0.9:(n<=lvl?1:0.22);
    o+='<path d="M2.5 8.6a15 15 0 0 1 19 0" opacity="'+fade(3)+'"/>'
      +'<path d="M6 12.7a10 10 0 0 1 12 0" opacity="'+fade(2)+'"/>'
      +'<path d="M9.4 16.8a5 5 0 0 1 5.2 0" opacity="'+fade(1)+'"/>'
      +'<circle class="f" cx="12" cy="20.4" r="1.2" opacity="'+fade(1)+'"/>';
  }
  /* the dongle wears an aerial, so two adapters in the same state are
     still telling apart without a word on the button */
  if(d.bus==='usb')
    o+='<path d="M1.4 22.7h3.6M3.2 22.7v-3.6"/>'
      +'<circle class="f" cx="3.2" cy="17.7" r="1.25"/>';
  if(off) o+='<path d="M3.6 3.6l16.8 16.8"/>';
  return '<svg viewBox="0 0 24 24">'+o+'</svg>';
}
function icoBt(b){
  let o='<path d="M7.5 7.8l9 8.4-4.5 4.2V3.6l4.5 4.2-9 8.4"/>';
  if(!b.powered) o+='<path d="M3.6 3.6l16.8 16.8"/>';
  return '<svg viewBox="0 0 24 24">'+o+'</svg>';
}
const ICO_POWER='<svg viewBox="0 0 24 24"><path d="M12 3.4v8.2"/>'
  +'<path d="M6.9 6.7a8 8 0 1 0 10.2 0"/></svg>';

function paintTiles(){
  const w=NET.st.wifi||{}, b=NET.st.bt||{};
  let o='';
  (w.devices||[]).forEach(d=>{
    o+='<button class="cbtn '+(d.up?'on':'off')+'" data-k="wifi" data-dev="'
      +esc(d.dev)+'">'+icoWifi(d)+'</button>';
  });
  if(b.available){
    const cls = !b.powered ? 'off'
      : ((b.connected&&b.connected.length) ? 'on' : '');
    o+='<button class="cbtn '+cls+'" data-k="bt">'+icoBt(b)+'</button>';
  }
  /* Rightmost, and never lit: this one is not a state, it is a door. */
  if((NET.st.power||{}).available)
    o+='<button class="cbtn" data-k="power">'+ICO_POWER+'</button>';
  /* Rewriting innerHTML on every poll would kill the :active flash
     under a finger and repaint for nothing. Only when it changed. */
  if(o!==NET.tilesHtml){ $('conn-sec').innerHTML=o; NET.tilesHtml=o; }
}

async function netStatus(){
  const j=await netApi('/status');
  const w=(j&&j.wifi)||{}, b=(j&&j.bt)||{}, dsp=(j&&j.display)||{},
        pwr=(j&&j.power)||{}, gpx=(j&&j.gpx)||{}, spo=(j&&j.spotify)||{},
        fit=(j&&j.fit)||{};
  /* Every key the helper sends has to be named here or it is not in
     NET.st at all - and a `need` path pointing at a missing branch is
     silently false, so the tile just never appears. */
  NET.st={wifi:w,bt:b,display:dsp,power:pwr,gpx:gpx,spotify:spo,fit:fit};
  /* The save button's visibility is decided by what the helper just said, and
     the music page may well have painted before this answer arrived -
     pollMusic and this race at boot and either can win. Without this the
     save button stays hidden until the next track change, on a page that
     looks entirely finished. The transport is gated the same way. */
  paintHeart(); paintTransport(); paintVolume();
  const hadBL=BL.available, first=!NET.probed;
  BL=(j&&j.backlight)||{available:false};
  NET.probed=true;
  /* First word from the helper, or the mechanism changed under us: repaint
     the slider and push the saved brightness at the hardware. */
  if(first || BL.available!==hadBL) applyDim(CFG.dim);
  if(!w.available && !b.available && !pwr.available){
    $('conn-sec').style.display='none'; NET.tilesHtml=''; closeNet(); return false; }
  $('conn-sec').style.display='';
  paintTiles();
  /* keep the open picker's own switch honest */
  if(NET.kind==='bt') NET.powered=!!b.powered;
  else if(NET.dev){
    const d=(w.devices||[]).find(x=>x.dev===NET.dev.dev);
    if(d){ NET.dev=d; NET.powered=!!d.up; NET.ap=!!d.ap; }
  }
  return true;
}

/* Polled only while the control panel is open. A display that spends
   its life on the dial has no business asking about radios all day,
   and each ask is a handful of subprocesses on the Pi. */
function netPanelOpen(){
  netStatus();
  clearInterval(NET.poll);
  NET.poll=setInterval(()=>{
    if(!netsheet.classList.contains('on') && !NET.busy) netStatus(); },5000);
}
function netPanelClose(){ clearInterval(NET.poll); NET.poll=null; closeNet(); }

/* ---- the picker ---- */
function openNet(kind,dev){
  NET.kind=kind; NET.page=0; NET.rows=[]; NET.busy=''; NET.scanning=false;
  NET.confirm=''; clearTimeout(NET.confirmT);
  const devs=(NET.st.wifi&&NET.st.wifi.devices)||[];
  NET.dev = kind==='wifi' ? (devs.find(d=>d.dev===dev)||devs[0]||null) : null;
  NET.ap  = !!(NET.dev&&NET.dev.ap);
  $('ns-title').textContent =
    kind==='wifi' ? 'Wi-Fi' : kind==='bt' ? 'Bluetooth' : 'Power';
  $('ns-for').textContent = (kind==='wifi'&&NET.dev)
    ? (NET.dev.bus==='usb'?'USB ADAPTER · ':'BUILT-IN · ')+NET.dev.dev
    : kind==='power' ? runtimeTxt() : '';
  /* Power has no radio to switch and nothing to scan for. */
  const pw_=kind==='power';
  $('ns-sw').style.display   = pw_?'none':'';
  $('ns-scan').style.display = pw_?'none':'';
  /* No pager on this sheet at all now: the tiers show everything at
     once, and this pager never worked here anyway - it pages NET.rows,
     which is empty for power actions, so both arrows looked live and
     did nothing. */
  $('ns-up').parentElement.style.display = pw_ ? 'none' : '';
  showAsk(false);
  showPw(false); setMsg('');
  netsheet.classList.add('on');
  netStatus().then(ok=>{
    if(!ok) return closeNet();      /* helper died since the panel opened */
    renderRows(); netRefresh(); netTick(); });
}
function closeNet(){
  netsheet.classList.remove('on');
  clearTimeout(NET.tick); NET.tick=null;
  clearTimeout(NET.confirmT); NET.confirm='';
  showPw(false); showAsk(false);
}
/* A self-rescheduling timeout rather than an interval, so a Bluetooth
   scan can be watched closely for its twelve seconds and then left
   alone again - and so two refreshes can never overlap. */
function netTick(){
  clearTimeout(NET.tick);
  NET.tick=setTimeout(async()=>{
    if(netsheet.classList.contains('on')){ await netRefresh(); netTick(); }
  }, NET.scanning?3000:6000);
}

async function netRefresh(rescan){
  if(NET.busy) return;
  if(NET.kind==='power'){          /* nothing to poll but the clock */
    await netStatus();
    $('ns-for').textContent=runtimeTxt();
    renderRows(); return;
  }
  const j = NET.kind==='wifi'
    ? await netApi('/wifi/list',{dev:NET.dev?NET.dev.dev:'', rescan:!!rescan})
    : await netApi('/bt/list');
  if(!j) return;
  if(NET.kind==='wifi'){
    NET.powered=!!j.up;             /* the switch means THIS adapter */
    NET.ap=!!j.ap;
    NET.rows=j.nets||[];
  }else{
    NET.powered=!!j.powered;
    NET.rows=j.devices||[];
  }
  NET.scanning=!!j.scanning;
  const pages=Math.max(1,Math.ceil(NET.rows.length/PAGE));
  if(NET.page>=pages) NET.page=pages-1;
  renderRows();
  if(NET.scanning && !NET.busy) setMsg('SCANNING…');
  else if(!NET.busy && $('ns-msg').textContent==='SCANNING…') setMsg('');
}

/* Least destructive first. On a touch panel the top of a list is where
   a hurried finger lands, and that should not be the shutdown. */
const POWER_ACTIONS=[
 /* A reload, not a browser restart. This can only be tapped on a page
    that is alive, and a live page needs nothing heavier - whereas killing
    Chromium here would hand the screen to whatever else owns the browser
