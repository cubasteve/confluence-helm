    fetchT('gpx/index.json?_='+Date.now(), 6000)
      .then(r=>r.ok?r.json():[]).catch(()=>[])
  ]).then(([rows,files])=>{
    let o='';
    if(files&&files.length){
      o+='<div class="lib-head">On the boat</div>';
      o+=files.map(f=>{
        const d=new Date((f.at||0)*1000);
        const nice=esc(f.name.replace(/\.gpx$/,''));
        return `<a class="lib-row" href="gpx/${encodeURIComponent(f.name)}"
                   data-title="${nice}" download>
           <div class="lib-main">
             <div class="lib-name">${nice}</div>
             <div class="lib-sub">${kb(f.size||0)} · `
          +`${d.toLocaleDateString()} ${String(d.getHours()).padStart(2,'0')}:`
          +`${String(d.getMinutes()).padStart(2,'0')}</div>
           </div><span class="mini">⤓</span></a>`;
      }).join('');
    }
    if(rows===null) o+='<div class="lib-empty">LIBRARY UNAVAILABLE</div>';
    else if(rows.length){
      rows.sort((a,b)=>b.t-a.t);
      o+='<div class="lib-head">Saved here</div>';
      o+=rows.map(r=>
        `<div class="lib-row" data-id="${r.id}">
           <div class="lib-main">
             <div class="lib-name">${esc(r.name)}</div>
             <div class="lib-sub">${r.nm.toFixed(2)} NM · ${durTxt(r.secs)}`
          +` · MAX ${r.max.toFixed(1)} KT</div>
           </div>
           <button class="mini" data-exp="${r.id}">⤓</button>
           <button class="mini" data-del="${r.id}">✕</button>
         </div>`).join('');
    }
    box.innerHTML = o || '<div class="lib-empty">NO SAVED RACES</div>';
  });
}

function loadRace(id){
  dbGet(id).then(r=>{
    if(!r) return;
    VIEWTRK=r.pts; MAPVIEW=null; tileKey='';
    $('t-title').textContent=r.name;
    closeLib(); drawMap(VIEWTRK);
  });
}
function unloadRace(){
  VIEWTRK=null; MAPVIEW=null; tileKey='';
  $('t-title').textContent='Race track';
  drawMap(TRK); paintTrack();
}

/* ==================================================================
   AMBIENT MODE
   A canvas, not SVG - 80 moving streaks as DOM nodes would crawl on a
   Pi 4, whereas a 2D context redrawing them is nothing. Trails come
   from painting the background back over at low alpha rather than
   clearing, which is far cheaper than tracking history per particle.
   ================================================================== */
const saver=$('saver'), cv=$('ss-cv');
let ssOn=false, ssRaf=null, lastTouch=Date.now(), ssCycle=0;
const PT=[]; const NPT=80;

function ssInit(){
  const r=$('stage').getBoundingClientRect();
  cv.width=Math.round(r.width); cv.height=Math.round(r.height);
  PT.length=0;
  for(let i=0;i<NPT;i++) PT.push({
    x:Math.random()*cv.width, y:Math.random()*cv.height,
    len:8+Math.random()*26, a:0.15+Math.random()*0.5 });
}
function cssVar(n){ return getComputedStyle(document.body).getPropertyValue(n).trim(); }

function ssFrame(){
  if(!ssOn) return;
  const ctx=cv.getContext('2d'), W=cv.width, H=cv.height;

  // wind actually blowing across the boat drives the flow
  let awa=get('environment.wind.angleApparent');
  awa = awa===null ? 0 : awa*DEG;
  let aws=get('environment.wind.speedApparent');
  aws = aws===null ? 4 : aws*MS_TO_KT;
  const rad=awa*Math.PI/180;
  const vx=-Math.sin(rad), vy=Math.cos(rad);      // bow is up, so wind runs aft
  const v=Math.min(14, 0.9+aws*0.55);             // px per frame

  ctx.fillStyle=cssVar('--bg'); ctx.globalAlpha=0.16;
  ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=1;
  ctx.strokeStyle=cssVar('--accent'); ctx.lineCap='round';

  for(const p of PT){
    ctx.globalAlpha=p.a*0.5;
    ctx.lineWidth=1.6;
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    ctx.lineTo(p.x-vx*p.len, p.y-vy*p.len);
    ctx.stroke();
    p.x+=vx*v; p.y+=vy*v;
    // wrap, with a little jitter so they never form visible ranks
    if(p.x<-40){p.x=W+40;p.y=Math.random()*H;} if(p.x>W+40){p.x=-40;p.y=Math.random()*H;}
    if(p.y<-40){p.y=H+40;p.x=Math.random()*W;} if(p.y>H+40){p.y=-40;p.x=Math.random()*W;}
  }
  ctx.globalAlpha=1;
  ssRaf=requestAnimationFrame(ssFrame);
}

/* the centre value rotates so the screensaver still tells you things */
function ssTick(){
  if(ssOn){
    const now=new Date();
    $('ss-clock').textContent =
      String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    const page=Math.floor(Date.now()/8000)%4;
    if(page!==ssCycle){ ssCycle=page; }
    let lbl,val,unit;
    const sog=get('navigation.speedOverGround');
    let d=get('environment.depth.belowKeel'); if(d===null)d=get('environment.depth.belowTransducer');
    const aws=get('environment.wind.speedApparent');
    const awa=get('environment.wind.angleApparent');
    if(page===0){ lbl='SOG';   val=sog===null?'–':(sog*MS_TO_KT).toFixed(1); unit='KNOTS'; }
    else if(page===1){ lbl='DEPTH'; val=d===null?'–':Math.round(d*(CFG.depthUnit==='m'?1:M_TO_FT));
                       unit=CFG.depthUnit==='m'?'METRES':'FEET'; }
    else if(page===2){ lbl='WIND';  val=aws===null?'–':(aws*MS_TO_KT).toFixed(0); unit='KNOTS APP'; }
    else { lbl='ANGLE'; val=awa===null?'–':Math.abs(awa*DEG).toFixed(0)+'°';
           unit=awa===null?'':(awa>0?'STARBOARD':'PORT'); }
    $('ss-lbl').textContent=lbl; $('ss-val').textContent=val; $('ss-unit').textContent=unit;
  }
  // auto-blank after the chosen idle delay, if one is set
  const d=SS_DELAYS[ssStep];
  if(d && !ssOn && Date.now()-lastTouch>d) ssStart();
  setTimeout(ssTick,500);
}

function ssStart(){ if(ssOn)return; ssOn=true; ssInit(); saver.classList.add('on'); ssFrame(); }
function ssStop(){ ssOn=false; saver.classList.remove('on');
  if(ssRaf)cancelAnimationFrame(ssRaf); ssRaf=null; lastTouch=Date.now(); }

/* ---- ambient: one control, four states --------------------------------
   The old pair - a launch button and an on/off auto toggle - collapse
   into a single tile. Tap cycles the idle delay, press and hold starts
   it now. The delay is drawn inside the glyph rather than hidden behind
   a toggle, so the setting is readable at a glance without opening
   anything or remembering what "on" meant.                            */
const SS_DELAYS=[0, 10000, 60000, 300000];
const SS_TEXT  =['OFF','10s','1m','5m'];
let ssStep=0;
function drawAmbient(){
  const on=ssStep>0;
  $('ss-ico').innerHTML =
    '<circle cx="12" cy="12" r="9.4"/>'
    + (on ? '<text x="12" y="12" text-anchor="middle" dominant-baseline="central"'
          + ' font-size="9.4" font-weight="700">'+SS_TEXT[ssStep]+'</text>'
          : '<path d="M6.6 6.6l10.8 10.8"/>');
  $('ss-sub').textContent = SS_TEXT[ssStep];
  $('ss-btn').classList.toggle('on', on);
  $('ss-btn').classList.toggle('off', !on);
}

/* ==================================================================
   RADAR  -  an app, not a page

   A slippy map without Leaflet: Web Mercator is two functions, and a
   tile layer is drawImage at a computed offset. Dropping the library
   drops 144 kB, a CDN dependency and fifteen tile layers' worth of DOM.

   The memory is the design. Kept the obvious way - every radar frame's
   tiles decoded and held - fifteen frames over a 1080 view is about
   375 tiles at 256 kB each, roughly 100 MB of image memory that never
   shows up in the JS heap and never comes back. So each frame is
   composited ONCE into a single 512x512 canvas and its source tiles are
   released: 15 x 512 x 512 x 4 is under 16 MB, and closing the app
   zeroes every one of them.

   512 is not a compromise. RainViewer's free radar is real only through
   z7 and is upscaled above it, so at any zoom past 7 the native content
   across the view is already fewer than 512 px.

   Sources, none of which need a key:
     base      Esri World Dark Gray Canvas
     seamarks  OpenSeaMap
     radar     RainViewer, last hour plus nowcast

   NOT Carto, which sail-weather uses. basemaps.cartocdn.com now returns
   a tile with API KEY REQUIRED stamped across the middle of it, on every
   subdomain, and it looks exactly like a working dark basemap until you
   read the words. Esri's canvas service is unkeyed and asks only for the
   credit line at the foot.
   Tiles are drawn, never read back, so the canvas may taint and no CORS
   handshake is needed - which is one whole class of failure removed.  */
const RAD={
  /* Esri puts y BEFORE x. Tokens are replaced by name, so the order in
     the template is the order on the wire. */
  base:'https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/'
      +'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
  sea:'https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',
  index:'https://api.rainviewer.com/public/weather-maps.json',
  /* The futurecast. Tomorrow.io's real km-scale precipitation forecast,
     proxied by the keel-ics Worker so the API key stays a Worker secret
     and every tile is cached at the edge for 15 minutes - the free tier
     is a trickle, and this way it is shared across every device instead
     of burned per browser.
     That trickle is also why these are fetched ONE AT A TIME and at a
     zoom chosen so the view fits in six tiles: a normal tile layer would
     burst dozens of requests and spend the day's quota on one look. */
  tmr:'https://keel-ics.keel-app.workers.dev/tile/',
  TMR_HOURS:[1,2,3], TMR_MAX_TILES:6, TMR_MAX_Z:7,
  /* Zoom levels of margin on a forecast frame. Built to fit the canvas
     exactly, a frame is uncovered by ANY pan at all - one pixel off and
     it has to be bought again, which is how twelve metered calls became
     the price of nudging the chart. One level out covers four times the
     area for the same four tiles, because the composite backs off a
     zoom too: a quarter-screen pan and any amount of zooming IN are then
     free. The forecast is drawn a step coarser for it, which is a fair
     trade for a smooth model field on a tier this thin. */
  TMR_PAD:1,
  /* Tomorrow.io's default precipitation palette is GREEN - #6efd00
     bright, #298a01 dark - and RainViewer's is Universal Blue. That is
     the seam you see when the timeline crosses from radar into
     forecast, and it cannot be fixed at either source: RainViewer's
     tile server ignores the colour-scheme segment in its own URL
     (/256/{z}/{x}/{y}/{scheme}/1_1.png returns identical bytes for 0, 4
     and 6, checked on tiles never fetched before), and the keel-ics
     Worker builds its upstream URL as
       "https://api.tomorrow.io/v4/map/tile/.../" + iso + ".png?apikey=" + key
     which drops whatever query the panel sent, so Tomorrow.io's own
     `gradient` parameter never arrives. A gradient was tried here and
     measured inert.
     So it is done on the way in, the way the keel app does it: the
     Worker sends access-control-allow-origin, which means the tiles can
     be read back and repainted.

     Hue alone is not enough, which is where a first attempt went wrong.
     Tomorrow.io spends GREEN across a wide range of intensity - pale
     washed green, vivid green, dark green - and sorting on hue puts all
     three in one band, so a whole tile came out the single sand colour
     at the bottom of the ramp. Inside the greens it is saturation and
     value that carry it: washed out is lightest, vivid is next, dark is
     heavier. Yellow, orange and red then follow on hue as normal.
     The colours are Universal Blue's own, at the dBZ each band implies,
     read off RainViewer's published table rather than eyeballed. */
  TMR_RAMP:[
    /* greens, split on how washed out they are */
    {h0:75, h1:170, s1:0.45,          c:[214,200,143], a:170}, /* sand  12 */
    {h0:75, h1:170, v0:0.75,          c:[136,221,238], a:225}, /* pale cyan 15 */
    {h0:75, h1:170,                   c:[  0,163,224], a:240}, /* cyan  20 */
    {h0:45, h1:75,                    c:[  0, 85,136], a:250}, /* blue  30 */
    {h0:15, h1:45,                    c:[255,210,  0], a:255}, /* gold  37 */
    {h0:300, h1:15,                   c:[217, 27,  0], a:255}, /* red   48 */
  ],
  NATIVE_Z:7,        /* radar is real to here and upscaled above it */
  FRAME:512,         /* per-frame composite, see above */
  PAST:12,           /* how much of the last hour to keep */
  /* The BOAT tour: dive to TOUR_IN over the boat, hold while the close
     tiles are sharp, then pull back to TOUR_MID - a working height you
     can actually read weather at. */
  TOUR_IN:11, TOUR_MID:9, TOUR_LEG:2400, TOUR_HOLD:2000, TOUR_RISE:2800,
  /* A tick of the tour is a full-canvas fill, a 1080 base blit and a
     scaled radar blit. At 60 that is the most expensive thing the panel
     ever does; at 30 it is half of it, and on a slow ease over two and
     a half seconds nobody can tell which they are watching. */
  TOUR_FPS:30,
  MIN_Z:4, MAX_Z:11, DWELL:900, TICK:80, ALPHA:0.72,
};
let R=null;

/* Web Mercator, in world pixels (256 * 2^z). */
const wx=(lon,z)=>(lon+180)/360*256*Math.pow(2,z);
const wy=(lat,z)=>{ const r=Math.max(-85.05,Math.min(85.05,lat))*Math.PI/180;
  return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*256*Math.pow(2,z); };
/* and back again - pinch and pan both need to turn a screen point into a
   place, which is the same maths read the other way. */
const unwx=(px,z)=>px/(256*Math.pow(2,z))*360-180;
const unwy=(py,z)=>{ const t=Math.PI-2*Math.PI*py/(256*Math.pow(2,z));
  return 180/Math.PI*Math.atan(0.5*(Math.exp(t)-Math.exp(-t))); };

/* One image, or null. Never rejects: a missing tile is a hole in the
   picture, not a reason for the app to stop. */
/* cors is asked for ONLY on the forecast tiles. The basemap and radar
   are drawn and never read back, which is why no CORS handshake has
   ever been needed for them - one whole class of failure avoided, and
   not worth giving up to recolour layers that already match. */
function radImg(url, gen, cors){
  return new Promise(res=>{
    const im=new Image();
    if(cors) im.crossOrigin='anonymous';
    im.onload =()=>res(R && R.gen===gen ? im : null);
    im.onerror=()=>res(null);
    im.src=url;
  });
}

/* Tomorrow.io's green ramp, repainted in RainViewer's. Hue is what
   carries the intensity in their palette - pale green through yellow
   and orange to red - so hue is what picks the band, and the tile's own
   alpha is kept where it is thinner than the band's, so light drizzle
   stays light. Cached on the image: a tile is recoloured once however
   many frames draw it. */
function radRecolor(img){
  if(img._rc) return img._rc;
  try{
    const cv=document.createElement('canvas');
    cv.width=img.naturalWidth; cv.height=img.naturalHeight;
    const cx=cv.getContext('2d', {willReadFrequently:true});
    cx.drawImage(img,0,0);
    const im=cx.getImageData(0,0,cv.width,cv.height), d=im.data;
    for(let i=0;i<d.length;i+=4){
      const a=d[i+3]; if(!a) continue;
      const r=d[i], g=d[i+1], b=d[i+2];
      const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
      let hue=0;
      if(mx>mn){
        if(mx===r)      hue=((g-b)/(mx-mn)+6)%6;
        else if(mx===g) hue=(b-r)/(mx-mn)+2;
        else            hue=(r-g)/(mx-mn)+4;
        hue*=60;
      }
      const val=mx/255, sat=mx?(mx-mn)/mx:0;
      let band=RAD.TMR_RAMP[RAD.TMR_RAMP.length-1];
      for(const t of RAD.TMR_RAMP){
        /* the last band wraps through 0 - red on one side, violet on
           the other - so it is tested as an OR, not a range */
        const inH = t.h0>t.h1 ? (hue>=t.h0||hue<t.h1) : (hue>=t.h0&&hue<t.h1);
        if(inH && (t.s1===undefined || sat<t.s1)
               && (t.v0===undefined || val>=t.v0)){ band=t; break; }
      }
      d[i]=band.c[0]; d[i+1]=band.c[1]; d[i+2]=band.c[2];
      d[i+3]=Math.min(a, band.a);
    }
    cx.putImageData(im,0,0);
    img._rc=cv;
  }catch(e){ img._rc=img; }   /* tainted: the original beats nothing */
  return img._rc;
}

/* Every tile covering the view, with where to put it. */
function radTiles(z, W, H, view){
  const v=view||R.view, n=Math.pow(2,z);
  const cx=wx(v.lon,z), cy=wy(v.lat,z);
  const x0=Math.floor((cx-W/2)/256), x1=Math.floor((cx+W/2)/256);
  const y0=Math.floor((cy-H/2)/256), y1=Math.floor((cy+H/2)/256);
  const out=[];
  for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++){
    if(y<0||y>=n) continue;
    out.push({x:((x%n)+n)%n, y:y, z:z,
              px:Math.round(x*256-(cx-W/2)), py:Math.round(y*256-(cy-H/2))});
  }
  return out;
}
const radUrl=(t,tpl)=>tpl.replace('{z}',t.z).replace('{x}',t.x).replace('{y}',t.y);

/* The base layers for `view`, painted into `c`. Any canvas and any
   view, because the tour builds its destination OFF SCREEN while it is
   still flying there - the snap at the end of a leg is then a blit and
   not a wait. `live` says whether the answer is still wanted; `after`
   runs once per layer, for the in-place build that wants to show its
   working. */
async function radBaseInto(c, view, live, after){
  const gen=R.gen, g=c.getContext('2d');
  g.setTransform(1,0,0,1,0,0);
  g.fillStyle=getComputedStyle(document.body).getPropertyValue('--bg')||'#0b0c0e';
  g.fillRect(0,0,c.width,c.height);
  const layers=R.seaOn ? [RAD.base, RAD.sea] : [RAD.base];
  for(const tpl of layers){
    const ts=radTiles(view.z, c.width, c.height, view);
    const ims=await Promise.all(ts.map(t=>radImg(radUrl(t,tpl),gen)));
    if(!live()) return false;
    ims.forEach((im,i)=>{ if(im) g.drawImage(im, ts[i].px, ts[i].py, 256,256); });
    if(after) after();
  }
  return true;
}

/* The base: drawn once per view, then it is one drawImage a tick. */
function radBuildBase(){
  /* bgen as well as gen: turning the seamarks off starts a new base
     build, and the old one must not paint its layer over the top of it
     a second later. gen is not the right lever - bumping that would
     throw away the radar frames, which have not changed at all. */
  const gen=R.gen, bg=++R.bgen;
  return radBaseInto(R.base, R.view,
    ()=>!!R && R.gen===gen && R.bgen===bg, radPaint);
}

/* One radar frame, composited into its own small canvas. The tiles that
   built it are unreferenced on the way out of this function - that is
   what keeps fifteen frames inside sixteen megabytes. */
/* Every frame - radar or futurecast - ends up as the same 512 canvas, so
   playback never has to know which kind it is looking at.
   `hits` is how many tiles actually arrived, and it is not decoration: a
   futurecast frame that got nothing draws as empty, and empty is exactly
   how "no rain forecast" draws. One is a quota refusal and the other is
   a fine afternoon, and they must not look alike. */
async function radBuildFrame(urlFor, opt){
  opt=opt||{};
  const gen=R.gen, N=RAD.FRAME, v=opt.view||R.view;
  const c=document.createElement('canvas'); c.width=c.height=N;
  const g=c.getContext('2d');
  /* The frame canvas stands for exactly the view, so the tiles fetched
     must cover exactly the view - the SAME GEOGRAPHY at a lower zoom,
     not the same pixel count. Covering N*span px at the radar's zoom is
     twice the ground when span is 2, and the radar then draws at half
     scale over a base that is correct: two layers of the same coastline,
     one of them wrong.
     One zoom below the view, capped at the radar's native 7, is also
     self-consistent with a 512 canvas over a 1080 one - the frame is
     half the view's linear resolution either way. */
  let z=Math.max(0, Math.min(v.z-1, opt.maxZ||RAD.NATIVE_Z));
  let k, gw, gh, ts;
  for(;;){
    k=Math.pow(2, z-v.z);                    /* view px -> tile px at z */
    gw=R.cv.width*k; gh=R.cv.height*k;
    ts=radTiles(z, gw, gh, {lat:v.lat, lon:v.lon, z:z});
    /* Back off a zoom until the view fits the budget. Only the
       futurecast sets one, and for it the budget IS the feature: six
       tiles an hour is a quota that lasts, sixty is one that does not. */
    if(!opt.maxTiles || ts.length<=opt.maxTiles || z<=0) break;
    z--;
  }
  let ims;
  if(opt.serial){
    ims=[];
    for(const t of ts){
      ims.push(await radImg(urlFor(t), gen, opt.cors));
      if(!R||R.gen!==gen) return null;
    }
  }else{
    ims=await Promise.all(ts.map(t=>radImg(urlFor(t), gen, opt.cors)));
  }
  if(!R||R.gen!==gen) return null;
  const sc=N/gw;                             /* that ground into N px */
  g.save(); g.scale(sc, sc);
  let hits=0;
  ims.forEach((im,i)=>{ if(im){ hits++;
    g.drawImage(opt.recolor?radRecolor(im):im, ts[i].px, ts[i].py, 256,256); } });
  g.restore();
  return {c:c, hits:hits};
}

/* +1h, +2h, +3h, each rounded DOWN to the quarter hour Tomorrow.io
   publishes on - asking for 14:07 gets nothing at all. */
/* The top of the current UTC hour. Every forecast time is measured from
   here rather than from now, and that one change is what lets the cache
   work at all: rounded to the quarter hour, the tile URL changed every
   15 minutes and the Worker's edge cache also expired every 15 minutes,
   so the two windows lined up exactly and nothing was ever served twice.
   Anchored to the hour, one URL is good for a whole hour and every
   device on the boat shares the same cached tile.
   The cost is that the horizon shrinks through the hour - at 14:05 the
   frames are +55m/+1h55/+2h55, by 14:55 they are +5m/+1h05/+2h05 - so
   the timeline's end label is computed rather than printed. */
const castHour=()=>{ const d=new Date(); d.setUTCMinutes(0,0,0); return d.getTime(); };

function radCastTimes(){
  const base=castHour();
  return RAD.TMR_HOURS.map(h=>{
    const t=new Date(base+h*3600000);
    return {ms:t.getTime(), iso:t.toISOString().slice(0,19)+'Z'};
  });
}

/* Says how far the timeline actually reaches, rather than the +3h that
   used to be printed into the markup and was only true on the hour. */
function radCastLabel(){
  const e=document.querySelector('.rad-end.fut');
  if(!e||!R||!R.times.length) return;
  const h=Math.round((R.times[R.times.length-1]-Date.now())/3600000);
  e.textContent = h>0 ? '+'+h+'h' : 'NOW';
}

/* Does a frame composited for `fv` still cover the whole canvas at
   `view`? Zoomed in, yes - it covers more ground than is asked for.
   Panned off, or zoomed out, no. */
function radCovers(fv, view, W, H){
  if(!fv) return false;
  const k=Math.pow(2, fv.z-view.z);          /* view px -> fv px */
  const dx=Math.abs(wx(view.lon,fv.z)-wx(fv.lon,fv.z));
  const dy=Math.abs(wy(view.lat,fv.z)-wy(fv.lat,fv.z));
  return dx+W*k/2 <= W/2+0.5 && dy+H*k/2 <= H/2+0.5;
}

function radCastDrop(){
  if(!R||!R.cast) return;
  R.cast.frames.forEach(c=>{ if(c) c.width=c.height=0; });
  R.cast=null;
}

/* Built after the radar, never alongside it: the radar is what you came
   for and must not queue behind a free tier. The first frame that comes
   back empty ends the run - if the quota is gone for +1h it is gone for
   +2h, and three empty frames in the loop would read as three hours of
   clear sky. */
async function radBuildCast(){
  const gen=R.gen, hour=castHour();
  /* Every forecast tile is a metered API call - the free tier is 25 an
     hour and 500 a day, and a tile counts the same as a data call - so
     rebuilding these on every pan and pinch is what empties it. Three
     frames at four tiles is twelve calls, which is two view changes an
     hour and then 429 for the rest of it.
     They are rebuilt only when the hour has rolled over or the chart has
     moved off them. That is safe now because every frame carries the
     view it was built for: one composited for a wider view draws in
     exactly the right place at a closer one. */
  const c=R.cast;
  if(c && c.hour===hour && c.frames.length &&
     c.fv.every(v=>radCovers(v, R.view, R.cv.width, R.cv.height))){
    for(let i=0;i<c.frames.length;i++){
      R.frames.push(c.frames[i]); R.fv.push(c.fv[i]); R.mk.push(c.mk[i]);
      R.times.push(c.times[i]);   R.kinds.push('cast');
    }
    radMarkNow(); radPaint();
    return;
  }
  /* A refusal is remembered for the rest of the hour. Without this, a
     panel with no quota left asks again on every single pan - which is
     how you stay refused. */
  if(R.castFail===hour){
    radSay(R.frames.length ? 'NO FORECAST — quota or upstream' : R.note);
    return;
  }
  radCastDrop();
  const keep={hour:hour, frames:[], fv:[], mk:[], times:[]};
  for(const t of radCastTimes()){
    const mk={url:tl=>RAD.tmr+tl.z+'/'+tl.x+'/'+tl.y+'/'+t.iso+'.png',
              opt:{serial:true, cors:true, recolor:true,
                   maxTiles:RAD.TMR_MAX_TILES, maxZ:RAD.TMR_MAX_Z}};
    const view={lat:R.view.lat, lon:R.view.lon,
                z:Math.max(RAD.MIN_Z, R.view.z-RAD.TMR_PAD)};
    const r=await radBuildFrame(mk.url, Object.assign({view:view}, mk.opt));
    if(!R||R.gen!==gen){ if(r&&r.c) r.c.width=r.c.height=0; return; }
    if(!r || !r.hits){
      if(r&&r.c) r.c.width=r.c.height=0;
      R.castFail=hour;
      radSay(R.frames.length ? 'NO FORECAST — quota or upstream' : R.note);
      keep.frames.forEach(x=>{ if(x) x.width=x.height=0; });
      return;
    }
    R.frames.push(r.c); R.fv.push(view); R.mk.push(mk);
    R.times.push(t.ms); R.kinds.push('cast');
    keep.frames.push(r.c); keep.fv.push(view);
    keep.mk.push(mk); keep.times.push(t.ms);
    radMarkNow();
    radPaint();
  }
  R.cast=keep;
}

async function radBuildFrames(){
  const gen=R.gen;
  let data;
  try{
    const r=await fetch(RAD.index,{cache:'no-store', signal:R.ac.signal});
    if(!r.ok) throw new Error('http '+r.status);
    data=await r.json();
  }catch(e){
    if(R&&R.gen===gen) radSay('NO RADAR — no internet');
    return;
  }
  if(!R||R.gen!==gen) return;
  const past=((data.radar&&data.radar.past)||[]).slice(-RAD.PAST);
  const list=past.concat((data.radar&&data.radar.nowcast)||[]);
  if(!list.length){ radSay('NO RADAR — nothing published'); return; }
  radSay('');
  R.times=list.map(f=>f.time*1000);
  /* One at a time on purpose. Fifteen frames fired at once is sixty-odd
     parallel tile requests over a marina's wifi, and the first frame -
     the only one anybody sees immediately - arrives last. */
  for(let i=0;i<list.length;i++){
    const fr=list[i];
    /* The url builder is kept, not just used: the tour re-composites
       every frame for the ground it has flown to, and it cannot go back
       to the index to ask how. */
    const mk={url:t=>data.host+fr.path+'/256/'+t.z+'/'+t.x+'/'+t.y+'/2/1_1.png',
              opt:{}};
    const view={lat:R.view.lat, lon:R.view.lon, z:R.view.z};
    const r=await radBuildFrame(mk.url, {view:view});
    if(!R||R.gen!==gen){ if(r&&r.c) r.c.width=r.c.height=0; return; }
    if(r){ R.frames[i]=r.c; R.fv[i]=view; R.mk[i]=mk;
           R.kinds[i]=fr.time*1000>Date.now()?'nowcast':'radar'; }
    radPaint();                       /* fill in as they land */
  }
  radMarkNow();
  await radBuildCast();
  radCastLabel();
}

/* Where the present sits on the track, so past and forecast are told
   apart at a glance rather than by reading the clock. */
function radMarkNow(){
  if(!R||!R.el.now) return;
  const n=R.times.length;
  if(n<2){ R.el.now.style.display='none'; return; }
  let i=R.times.findIndex(t=>t>Date.now());
  if(i<0){ R.el.now.style.display='none'; return; }
  R.el.now.style.display='';
  R.el.now.style.left=(i/(n-1)*100)+'%';
}

function radSay(msg){
  if(!R) return;
  R.note=msg;
  const el=R.el&&R.el.note; if(el) el.textContent=msg;
}

/* The whole per-tick cost: one base blit and at most two frame blits. */
function radPaint(){
  if(!R) return;
  const c=R.cv, g=c.getContext('2d');
  g.clearRect(0,0,c.width,c.height);
  /* The camera: one transform of what is already composited, used by
     both the pinch and the tour. Rebuilding tiles per animation frame
     would be dozens of fetches for a move that has not finished saying
     where it is going; this is one setTransform and it tracks exactly.
     A pinch leaves tx/ty at zero and scales about the fingers; a tour
     leg scales about the middle and pans as well. */
  const m=R.cam;
  if(m){
    /* Anything the transform does not cover is the map's own ground,
       not the black behind the page - a scale under 1 uncovers the
       edges, and a picture floating in void reads as a bug. */
    g.fillStyle=getComputedStyle(document.body).getPropertyValue('--bg')||'#0b0c0e';
    g.fillRect(0,0,c.width,c.height);
    g.setTransform(m.s,0,0,m.s, m.cx*(1-m.s)+m.tx, m.cy*(1-m.s)+m.ty);
  }
  g.drawImage(R.base,0,0);
  const n=R.rainOn ? R.frames.length : 0;
  if(n){
    const i=Math.min(Math.floor(R.p), n-1), f=R.p-i;
    /* A frame is 512 px standing for the ground its own view covered -
       not for whatever the canvas covers now. Placing it from that view
       is what lets the radar ride a pan, or a whole tour, instead of
       being thrown away every time the chart moves. When the two views
       are the same this is the identity it used to be. */
    const cv={x:wx(R.view.lon,R.view.z), y:wy(R.view.lat,R.view.z)};
    const draw=(k,w)=>{ const fc=R.frames[k], fv=R.fv[k];
      if(!fc||!fv||w<0.02) return;
      const kk=Math.pow(2, R.view.z-fv.z);
      const dx=(wx(fv.lon,fv.z)-c.width/2)*kk  - cv.x + c.width/2;
      const dy=(wy(fv.lat,fv.z)-c.height/2)*kk - cv.y + c.height/2;
      g.globalAlpha=RAD.ALPHA*w;
      g.drawImage(fc,0,0,fc.width,fc.height, dx,dy, c.width*kk, c.height*kk);
      g.globalAlpha=1; };
    /* No cross-fade while the camera is moving: it is two scaled
       blits a tick instead of one, and nobody has ever seen a 200 ms
       dissolve through a dive. */
    if(i+1<n && f>0.02 && !R.tour){ draw(i,1-f); draw(i+1,f); } else draw(i,1);
    if(R.el.time && R.times[i]){
      /* Three different things, and calling them all "the time" would
         hide the only distinction that matters: what has happened,
         what is about to, and what is a model's opinion. */
      const kind=R.kinds[i]==='cast' ? ' · FORECAST'
               : R.kinds[i]==='nowcast' ? ' · NOWCAST' : '';
      R.el.time.textContent=new Date(R.times[i]).toLocaleTimeString([],
        {hour:'2-digit',minute:'2-digit'}) + kind;
    }
    if(R.el.bar) R.el.bar.style.left=(n>1?(i/(n-1)*100):0)+'%';
  }else if(R.el.time && !R.tour){
    /* Not during a tour: the frames really are gone, but a clock that
       blanks for three seconds every time you press BOAT reads as a
       fault. The note line says what is happening instead. */
    R.el.time.textContent = R.rainOn ? '—' : 'RAIN OFF';
  }
  if(m) g.setTransform(1,0,0,1,0,0);
  /* The boat, if the GPS has ever answered. */
  const px=R.cv.width/2, py=R.cv.height/2;
  g.strokeStyle=getComputedStyle(document.body).getPropertyValue('--accent')||'#4A9EFF';
  g.lineWidth=3; g.beginPath(); g.arc(px,py,9,0,7); g.stroke();
  g.beginPath(); g.moveTo(px,py-16); g.lineTo(px,py-9); g.stroke();
}

function radTick(){
  if(!R) return;
  R.timer=setTimeout(radTick, RAD.TICK);
  const n=R.frames.length; if(!n||!R.playing||!R.rainOn) return;
  /* Paused costs a timer that returns immediately - no advance, no
     paint, no compositing. Keeping it running is what makes resuming
     instant, and it is three lines of nothing every 80 ms. */
  R.p+=RAD.TICK/RAD.DWELL;
  if(R.p>=n) R.p=0;
  radPaint();
}

/* The glyph is the ACTION, not the state: a triangle means "this will
   play". The same rule the music page's transport follows, and for the
   same reason - a button that shows what it will do needs no legend. */
function radPlayIco(){
  const e=$('rad-playico'); if(!e) return;
  e.setAttribute('d', R&&R.playing ? 'M7 5h3.6v14H7zM13.4 5H17v14h-3.6z'
                                   : 'M8 5l11 7-11 7z');
  e.setAttribute('fill','currentColor');
}
function radPlay(on){
  if(!R) return;
  R.playing=on;
  radPlayIco();
}

/* Scrubbing. The track itself is 8px, which no finger can hit, so the
   target is the 50px band around it - and it pauses on touch, because a
   timeline that keeps running under the thumb fights you. */
function radScrubTo(clientX){
  if(!R) return;
  const n=R.frames.length; if(n<2) return;
  const r=$('rad-track').getBoundingClientRect();
  const f=Math.max(0, Math.min(1, (clientX-r.left)/r.width));
  radPlay(false);
  R.p=f*(n-1);
  radPaint();
}

/* ---- the extended HUD ---------------------------------------------
   Tapping the clock drops the rest of it down: the tide table for the
   nearest station, and the hours it is actually worth going out in.

   Nothing here is fetched until that first tap. Somebody who only ever
   wants the radar pays exactly what they paid before, and both answers
   are then held OUTSIDE R - which dies with the app - so closing and
   reopening the map does not re-download a tide table.               */
const SAIL={
  /* A club boat's band. Under MIN nobody is racing, over MAX the fleet
     is on its ear, and it is the GUST that actually ends an afternoon:
     the hourly average can look perfectly reasonable straight through
     one. All three are here rather than inline so a heavier boat can
     move them without hunting through the drawing code. */
  MIN:6, MAX:20, GUST:28, HOURS:24,
  /* Open-Meteo needs no key and sends CORS headers, which is the whole
     reason it is here rather than another Tomorrow.io route: the panel
     can ask it directly and the Worker stays a tile proxy. */
  wind:'https://api.open-meteo.com/v1/forecast',
  idx:'https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations.json'
     +'?type=tidepredictions',
  pred:'https://api.tidesandcurrents.noaa.gov/api/prod/datagetter',
  /* Past this, the nearest gauge is telling you about somebody else's
     water. An inland lake gets told so instead of being handed a tide. */
  NEAR_KM:60,
  WIND_TTL:20*60e3, TIDE_TTL:6*60*60e3,
};
const SEA={ tide:null, wind:null, busy:false };

/* 0.25 deg either way - one cell is about 28 km, so the station is
   resolved once per venue and not once per GPS twitch. */
const seaCell=(lat,lon)=>Math.round(lat*4)+'/'+Math.round(lon*4);
/* Equirectangular, same approximation trackStats uses. Over the 60 km
   that matters here the error is metres. */
function seaKm(la1,lo1,la2,lo2){
  const kx=111.32*Math.cos(la1*Math.PI/180);
  return Math.hypot((lo2-lo1)*kx,(la2-la1)*111.32);
}

/* NOAA publishes 3499 tide-prediction stations and no way to ask which
   is nearest - the only list is two megabytes of pretty-printed JSON.
   JSON.parse on that peaks at many times the wire size, on a Pi with a
   gigabyte, while a map is open. So the body is read as it arrives and
   only the winner is kept; the tail is what a record straddling two
   chunks needs, and it is capped because a format change must not turn
   this into a two-megabyte string. The answer goes to localStorage, so
   the download happens once per venue and never again. */
async function tideStation(lat,lon){
  const key='helm.tide.'+seaCell(lat,lon);
  try{ const c=localStorage.getItem(key); if(c) return JSON.parse(c); }catch(e){}
  const res=await fetchT(SAIL.idx, 30000);
  if(!res.ok) throw new Error('http '+res.status);
  const rd=res.body.getReader(), dec=new TextDecoder();
  const RX=/"id":\s*"(\d+)",\s*"name":\s*"((?:[^"\\]|\\.)*)",\s*"lat":\s*(-?[\d.]+),\s*"lng":\s*(-?[\d.]+)/g;
  let tail='', best=null;
  for(;;){
    const {done,value}=await rd.read();
    const buf=tail+(done?dec.decode():dec.decode(value,{stream:true}));
    RX.lastIndex=0;
    let m, end=0;
    while((m=RX.exec(buf))){
      end=RX.lastIndex;
      const km=seaKm(lat,lon,+m[3],+m[4]);
      if(!best||km<best.km) best={id:m[1], name:m[2], km:km};
    }
    tail=buf.slice(end);
    if(tail.length>8192) tail=tail.slice(-8192);
    if(done) break;
  }
  if(best) try{ localStorage.setItem(key,JSON.stringify(best)); }catch(e){}
  return best;
}

const seaYmd=d=>d.getUTCFullYear()
  +String(d.getUTCMonth()+1).padStart(2,'0')+String(d.getUTCDate()).padStart(2,'0');

/* GMT on the wire, not the station's local time. lst_ldt would come
   back as "2026-08-27 03:05" with no zone on it, and Date would read
   that as the BROWSER's local time - right only while the boat and the
   gauge share an offset, and silently an hour out when they do not. */
async function tideLoad(lat,lon){
  const st=await tideStation(lat,lon);
  if(!st) return {err:'NO TIDE STATION FOUND'};
  if(st.km>SAIL.NEAR_KM)
    return {err:'NEAREST GAUGE '+Math.round(st.km)+' KM AWAY', station:st};
  const u=SAIL.pred+'?product=predictions&application=confluence-helm'
    +'&begin_date='+seaYmd(new Date(Date.now()-864e5))+'&range=72'
    +'&datum=MLLW&station='+st.id+'&time_zone=gmt&units=english'
    +'&interval=hilo&format=json';
  const r=await fetchT(u, 12000);
  if(!r.ok) throw new Error('http '+r.status);
  const j=await r.json();
  if(j.error) return {err:'NO PREDICTIONS FOR THIS GAUGE', station:st};
  const ev=(j.predictions||[]).map(x=>({
    t:new Date(x.t.replace(' ','T')+'Z'), hi:x.type==='H', ft:+x.v }));
  return {station:st, ev:ev};
}

async function windLoad(lat,lon){
  const u=SAIL.wind+'?latitude='+lat.toFixed(4)+'&longitude='+lon.toFixed(4)
    +'&hourly=wind_speed_10m,wind_gusts_10m,wind_direction_10m'
    +'&wind_speed_unit=kn&timezone=UTC&forecast_days=3';
  const r=await fetchT(u, 12000);
  if(!r.ok) throw new Error('http '+r.status);
  const j=await r.json(), h=j.hourly||{};
  const t=(h.time||[]).map(x=>new Date(x+'Z'));
  return {t:t, spd:h.wind_speed_10m||[], gst:h.wind_gusts_10m||[],
          dir:h.wind_direction_10m||[]};
}

/* The window itself. An hour counts if it is between sunrise and sunset
   AND inside the band - and the run reported is the LONGEST one in the
   next day, not the first: a fine two hours at dawn is not the answer
   when the afternoon has five. */
/* sunTimes works off the INSTANT, so asking it at breakfast and again
   at dusk gives sunsets half a minute apart - which shows up as a
   window that ends a minute before the sunset printed underneath it.
   Anchor every question about a day to that day's local noon and the
   three readings agree. */
function sunOf(d){
  const noon=new Date(d); noon.setHours(12,0,0,0);
  return sunTimes(noon, CFG.lat, CFG.lon);
}
const PTS=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW',
           'W','WNW','NW','NNW'];
const pt16=d=>PTS[Math.round(((d%360)+360)%360/22.5)%16];
function sailHours(W){
  const now=Date.now(), out=[];
  for(let i=0;i<W.t.length;i++){
    const d=W.t[i];
    if(d.getTime()<now-36e5) continue;
    if(out.length>=SAIL.HOURS) break;
    const sun=sunOf(d);
    const day=sun.sunrise && !isNaN(sun.sunrise) && d>=sun.sunrise && d<=sun.sunset;
    const s=W.spd[i], g=W.gst[i];
    out.push({t:d, s:s, g:g, dir:W.dir[i], day:day,
              ok: day && s>=SAIL.MIN && s<=SAIL.MAX && g<=SAIL.GUST});
  }
  return out;
}
function sailBest(H){
  let best=null, run=null;
  for(let i=0;i<=H.length;i++){
    if(i<H.length && H[i].ok){ if(!run) run={a:i,b:i}; else run.b=i; continue; }
    if(run){ if(!best || run.b-run.a > best.b-best.a) best=run; run=null; }
  }
  return best;
}
/* Why there is no window is more use than the fact that there is not. */
function sailWhy(H){
  const day=H.filter(h=>h.day);
  if(!day.length) return 'NO DAYLIGHT LEFT TODAY';
  if(day.every(h=>h.s<SAIL.MIN)) return 'TOO LIGHT — UNDER '+SAIL.MIN+' KT ALL DAY';
  if(day.every(h=>h.s>SAIL.MAX||h.g>SAIL.GUST)) return 'TOO MUCH — BLOWING THROUGH';
  return 'NOTHING CLEAN IN THE NEXT '+SAIL.HOURS+' H';
}

/* ---- drawing it ---------------------------------------------------- */
const hhmm=d=>d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

function drawTide(){
  const el=$('rad-tide'), at=$('rad-tide-at'); if(!el) return;
  const T=SEA.tide;
  if(!T){ el.textContent='…'; return; }
  if(at) at.textContent = T.station
    ? T.station.name.toUpperCase()+' · '+Math.round(T.station.km)+' KM' : '';
  if(T.err){ el.innerHTML='<div class="tid dim">'+T.err+'</div>'; return; }
  /* The one before now is worth a row: whether it is going out or
     coming in is the thing you actually want, and two future highs do
     not tell you that. */
  const now=Date.now();
  let i=T.ev.findIndex(e=>e.t.getTime()>now);
  if(i<0) i=T.ev.length;
  const rows=T.ev.slice(Math.max(0,i-1), Math.max(0,i-1)+4);
  el.innerHTML=rows.map(e=>{
    const past=e.t.getTime()<=now;
    return '<div class="tid'+(past?' past':'')+'">'
      +'<b>'+(e.hi?'HIGH':'LOW')+'</b>'
      +'<span>'+hhmm(e.t)+'</span>'
      +'<i>'+e.ft.toFixed(1)+' ft</i></div>'; }).join('');
}

function drawWind(){
  const el=$('rad-win'), sub=$('rad-winsub'), sun=$('rad-sun');
  if(!el) return;
  const W=SEA.wind;
  if(!W){ el.textContent='…'; el.className=''; if(sub) sub.textContent='';
          drawStrip(null,null); return; }
  if(W.err){ el.textContent=W.err; el.className='none';
             if(sub) sub.textContent=''; drawStrip(null,null); return; }
  const H=W.hours, b=sailBest(H);
  if(!b){ el.textContent=sailWhy(H); el.className='none';
          if(sub) sub.textContent=''; }
  else{
    const run=H.slice(b.a,b.b+1);
    const lo=Math.round(Math.min(...run.map(h=>h.s)));
    const hi=Math.round(Math.max(...run.map(h=>h.s)));
    const gust=Math.round(Math.max(...run.map(h=>h.g)));
    /* The end of the window is the end of its last HOUR, not the hour's
       own stamp: a run of 12:00 and 13:00 is good until 14:00. Capped at
       sunset, because the 20:00 hour of a day that ends at 20:14 is not
       an hour of sailing until 21:00. */
    const last=run[run.length-1].t;
    const set=sunOf(last).sunset;
    let end=new Date(last.getTime()+36e5);
    if(set && !isNaN(set) && set<end) end=set;
    el.textContent=hhmm(run[0].t)+' – '+hhmm(end);
    el.className='';
    if(sub) sub.textContent=pt16(run[0].dir)+' '+(lo===hi?lo:lo+'–'+hi)
      +' kt · gusts '+gust;
  }
  if(sun){
    const t=sunOf(new Date());
    sun.textContent = (t.sunrise&&!isNaN(t.sunrise))
      ? 'SUN '+hhmm(t.sunrise)+' – '+hhmm(t.sunset) : '';
  }
  drawStrip(H,b);
}

/* The window, drawn. A bar per hour: grey under the band, accent in it,
   amber over the top, red where the gust alone would end the day - and
   dimmed after dark, so the shape of the day reads before any of the
   numbers do.

   The scale follows the data rather than sitting at a fixed 34 kt. A
   six-knot afternoon drawn against 34 is four rows of stubs that say
   nothing; against its own maximum it says "light, and steady". The
   floor stops the flattery: a drifter cannot be stretched to look like
   a breeze, and the two dashed guides are the band itself, so a bar's
   height means the same thing at either end of the scale. */
const STRIP={w:420, h:76, base:58, top:8};
function drawStrip(H,b){
  const g=$('rad-strip'); if(!g) return;
  if(!H||!H.length){ g.innerHTML=''; return; }
  const n=Math.min(H.length, SAIL.HOURS), hh=H.slice(0,n);
  const step=STRIP.w/n, bw=Math.max(4, step-3.5);
  const top=Math.max(SAIL.MIN+8,
    Math.max(...hh.map(h=>Math.max(h.s||0, h.g||0)))*1.06);
  const y=v=>STRIP.base-Math.max(0,Math.min(1,v/top))*(STRIP.base-STRIP.top);
  let out='';
  if(b) out+='<rect x="'+(b.a*step).toFixed(1)+'" y="0" width="'
    +((b.b-b.a+1)*step).toFixed(1)+'" height="'+STRIP.base
    +'" rx="4" fill="rgba(74,158,255,.15)"/>';
  const guide=(v,lbl)=>{
    if(v>=top) return '';
    return '<line x1="0" y1="'+y(v).toFixed(1)+'" x2="'+(STRIP.w-22)
      +'" y2="'+y(v).toFixed(1)+'" stroke="rgba(255,255,255,.16)"'
      +' stroke-width="1" stroke-dasharray="3 4"/>'
      +'<text x="'+STRIP.w+'" y="'+(y(v)+3.5).toFixed(1)+'" fill="#6C757C"'
      +' font-size="11" font-weight="600" text-anchor="end">'+lbl+'</text>'; };
  out+=guide(SAIL.MIN,SAIL.MIN)+guide(SAIL.MAX,SAIL.MAX);
  for(let i=0;i<n;i++){
    const h=hh[i];
    const bt=y(h.s), bh=Math.max(2, STRIP.base-bt);
    const col = h.g>SAIL.GUST ? '#FF6B4A'
              : h.s>SAIL.MAX  ? '#E8B23A'
              : h.s<SAIL.MIN  ? '#4C555C' : '#4A9EFF';
    const x=i*step+(step-bw)/2, dim=h.day?'':' opacity=".38"';
    out+='<rect x="'+x.toFixed(1)+'" y="'+(STRIP.base-bh).toFixed(1)
      +'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="'
      +col+'"'+dim+'/>';
    /* The gust as a cap above the bar. It is the number that actually
       ends an afternoon, and an hourly average hides it completely. */
    if(h.g>h.s+1) out+='<line x1="'+x.toFixed(1)+'" y1="'+y(h.g).toFixed(1)
      +'" x2="'+(x+bw).toFixed(1)+'" y2="'+y(h.g).toFixed(1)
      +'" stroke="'+col+'" stroke-width="1.6" opacity="'+(h.day?'.55':'.24')+'"/>';
  }
  out+='<line x1="0" y1="'+STRIP.base+'" x2="'+STRIP.w+'" y2="'+STRIP.base
    +'" stroke="rgba(255,255,255,.18)" stroke-width="1"/>';
  /* Four stamps is all a 420px strip can carry without them touching. */
  for(let i=0;i<n;i+=6)
    out+='<text x="'+(i*step+step/2).toFixed(1)+'" y="'+(STRIP.h-2)
      +'" fill="#6C757C" font-size="12" font-weight="600" text-anchor="middle">'
      +String(hh[i].t.getHours()).padStart(2,'0')+'</text>';
  g.innerHTML=out;
}

/* ---- the tap ------------------------------------------------------- */
function radMore(open){
  const hud=$('rad-hud'); if(!hud) return;
  const want = open===undefined ? !hud.classList.contains('open') : !!open;
  hud.classList.toggle('open', want);
  if(want) radDetails();
}

/* Draw whatever is already known first, then go and get what is stale.
   The second tap on a session should show a tide table instantly, not
   an ellipsis while the network decides. */
function radDetails(){
  drawTide(); drawWind();
  if(SEA.busy) return;
  const lat=CFG.lat, lon=CFG.lon, cell=seaCell(lat,lon), now=Date.now();
  const needTide=!SEA.tide||SEA.tide.cell!==cell||now-SEA.tide.at>SAIL.TIDE_TTL;
  const needWind=!SEA.wind||SEA.wind.cell!==cell||now-SEA.wind.at>SAIL.WIND_TTL;
  if(!needTide&&!needWind) return;
  SEA.busy=true;
  const done=()=>{ SEA.busy=false; };
  const jobs=[];
  if(needTide) jobs.push(tideLoad(lat,lon)
    .catch(e=>({err:/abort/i.test(e&&e.message||'')?'TIDE TIMED OUT':'NO TIDE — NO NETWORK'}))
    .then(r=>{ SEA.tide=Object.assign({cell:cell, at:Date.now()}, r); drawTide(); }));
  if(needWind) jobs.push(windLoad(lat,lon)
    .then(W=>({hours:sailHours(W)}))
    .catch(e=>({err:/abort/i.test(e&&e.message||'')?'FORECAST TIMED OUT':'NO FORECAST — NO NETWORK'}))
    .then(r=>{ SEA.wind=Object.assign({cell:cell, at:Date.now()}, r); drawWind(); }));
  Promise.all(jobs).then(done, done);
}

function radDropFrames(){
  /* The forecast canvases belong to R.cast and outlive the timeline
     they are lent to. Zeroing one here would free a canvas the cache
     still hands out, and the next view change would draw nothing where
     the forecast should be. */
  const own=R.cast ? R.cast.frames : [];
  R.frames.forEach(c=>{ if(c && own.indexOf(c)<0) c.width=c.height=0; });
  R.frames=[]; R.fv=[]; R.mk=[]; R.times=[]; R.kinds=[]; R.p=0;
}

/* Re-composite what is already on the timeline for new ground, ONE AT
   A TIME and in place. Each frame carries its own view, so the old one
   keeps drawing - in the right place - until the new one lands: the
   radar never blinks out, which is the whole point of doing it this way
   rather than dropping the lot and rebuilding.

   No detail is lost by reusing the timeline instead of re-reading the
   index. RainViewer's free radar is real only to z7; a frame built for
   a z11 view fetches those same z7 tiles and upscales them into 512 px,
   exactly as a frame built for z8 does. What changes is WHICH ground
   the 512 px covers, and that is what this fixes. */
async function radRefresh(view){
  if(!R||!R.frames.length) return;
  const gen=R.gen;
  for(let i=0;i<R.frames.length;i++){
    const mk=R.mk[i]; if(!mk) continue;
    /* Radar tiles are free and worth re-compositing; forecast tiles are
       metered. If the one we have still covers where we are going,
       rebuilding it would spend an API call to redraw the same pixels. */
    if(R.kinds[i]==='cast' &&
       radCovers(R.fv[i], view, R.cv.width, R.cv.height)) continue;
    const r=await radBuildFrame(mk.url, Object.assign({view:view}, mk.opt));
    if(!R||R.gen!==gen){ if(r&&r.c) r.c.width=r.c.height=0; return; }
    if(r && (r.hits || !mk.opt.maxTiles)){
      const old=R.frames[i];
      R.frames[i]=r.c; R.fv[i]=view;
      /* The cache lent this canvas out; it has to be told which one it
         holds now, or it would keep handing back the freed one. */
      if(R.kinds[i]==='cast' && R.cast){
        const j=R.cast.frames.indexOf(old);
        if(j>=0){ R.cast.frames[j]=r.c; R.cast.fv[j]=view; }
      }
      if(old) old.width=old.height=0;
      radPaint();
    }else if(r&&r.c) r.c.width=r.c.height=0;
  }
}

/* A new view: everything composited is now for the wrong place, so the
   generation moves and anything still in flight for the old one lands on
   a closed door. */
function radReview(keepBase){
  if(!R) return;
  R.gen++;
  radDropFrames();
  radPlay(true);            /* a new view is a new look, not a held frame */
  radMarkNow();
  /* The tour has just blitted a freshly built base for exactly this
     view; rebuilding it would be thirty-six cache hits and a flicker. */
  if(!keepBase) radBuildBase();
  radBuildFrames();
}

/* ---- the BOAT tour -------------------------------------------------
   BOAT used to be a jump cut: the view was somewhere else and then it
   was over the boat, and nothing about the picture told you which way
   it had moved or how far. It flies now - down onto the boat, a beat
   while the close tiles land, then back out to a height you can read
   weather at.

   Each leg glides the camera over what is ALREADY composited while the
   destination's tiles load into a canvas of their own. At the end of a
   leg the two agree - same ground, same screen scale - so swapping the
   sharp one in and dropping the transform is invisible. It is the same
   trick every slippy map uses for a fly-to, and the reason a leg costs
   one base build rather than one per animation frame.

   The radar layer is composited for the view it was built in, so it
   rides the transform correctly while a leg is flying and is dropped at
   the first swap. radReview brings it back at the end, over the base
   the last leg already built.                                       */
const ease=u=>u<0.5 ? 4*u*u*u : 1-Math.pow(-2*u+2,3)/2;

/* One animation, in the coordinates of whichever base is composited.
   A ground point sitting at pB in that base belongs on screen at
   k*pB + (W/2)(1-k) + k*(cB - cV), where k is 2^(zView-zBase) - which
   is the transform radPaint already applies. So the whole leg is a
   walk of zView and cV, and nothing is re-tiled. */
function radAnim(t, ms, zB, cB, cF, cT, zF, zT){
  return new Promise(res=>{
    const W=R.cv.width, H=R.cv.height, t0=performance.now();
    const gap=1000/RAD.TOUR_FPS;
    let last=-1e9;
    const step=()=>{
      if(!R||R.tour!==t){ res(); return; }
      const now=performance.now();
      let u=Math.min(1,(now-t0)/ms);
      if(t.skip) u=1;
      /* The last frame always draws, whatever the clock says: it is the
         one the swap has to line up with. */
      if(u<1 && now-last<gap){ requestAnimationFrame(step); return; }
      last=now;
      const e=ease(u);
      /* Linear in ZOOM LEVELS, not in scale: interpolating the scale
         itself spends most of the leg crawling across the last zoom. */
      const k=Math.pow(2,(zF+(zT-zF)*e)-zB);
      const vx=cF.x+(cT.x-cF.x)*e, vy=cF.y+(cT.y-cF.y)*e;
      R.cam={s:k, cx:W/2, cy:H/2, tx:k*(cB.x-vx), ty:k*(cB.y-vy)};
      radPaint();
      if(u<1){ requestAnimationFrame(step); return; }
      res();
    };
    requestAnimationFrame(step);
  });
}

/* A leg. Which base it flies over depends on which way it is going, and
   that is the whole trick:

     IN   the base we already have, blown up, then swapped for the sharp
          close one at the end. Scaling up never uncovers an edge.
     OUT  the WIDE base first, blown up and shrinking into place. Doing
          it the other way - shrinking the close base - leaves the map
          as a postage stamp in the middle of an empty screen, because
          the ground around it was never composited. This way the glass
          is full the whole way.

   Either way the swap is invisible: at that moment the two agree on
   ground and on screen scale, so it is a blit and a dropped transform.  */
async function radLeg(t, to, ms){
  const from={lat:R.view.lat, lon:R.view.lon, z:R.view.z};
  const inward=to.z>=from.z, W=R.cv.width, H=R.cv.height;
  const live=()=>!!R && R.tour===t;
  const nxt=document.createElement('canvas'); nxt.width=W; nxt.height=H;
  /* Started now, not at the end of the leg: a second of flying is most
     of a tile round trip on marina wifi, and spending it is the whole
     point of animating rather than cutting. */
  const build=radBaseInto(nxt, to, live);
  const zB=inward ? from.z : to.z;
  const cF={x:wx(from.lon,zB), y:wy(from.lat,zB)};
  const cT={x:wx(to.lon,zB),   y:wy(to.lat,zB)};
  const cB=inward ? cF : cT;
  const swap=async()=>{
    let okd=false;
    try{ okd=await build; }catch(e){}
    if(!live()){ nxt.width=nxt.height=0; return; }
    R.view={lat:to.lat, lon:to.lon, z:to.z};
    /* gen deliberately does NOT move here. The tour bumps it once, at
       the start, and the re-composite it then launches has to survive
       every waypoint - radBuildFrame reads gen when it starts and
       radImg nulls any tile that lands after it changed, so a bump
       mid-flight would hand back empty frames. Nothing here needs it:
       the base build is guarded by bgen and by the tour token. */
    const g=R.base.getContext('2d');
    g.setTransform(1,0,0,1,0,0);
    if(okd){ g.clearRect(0,0,W,H); g.drawImage(nxt,0,0); }
    nxt.width=nxt.height=0;
    /* Tiles that never arrived would leave the old base under a cleared
       transform, which is the wrong ground. Rebuild in place. */
    if(!okd) radBuildBase();
  };
  if(inward){
    await radAnim(t, ms, zB, cB, cF, cT, from.z, to.z);
    await swap();
  }else{
    await swap();
    if(!live()) return;
    await radAnim(t, ms, zB, cB, cF, cT, from.z, to.z);
  }
  if(R&&R.tour===t){ R.cam=null; radPaint(); }
}
const radHold=(t,ms)=>new Promise(r=>setTimeout(r,t.skip?0:ms));

async function radTour(){
  if(!R) return;
  /* A second press, or a hand on the chart, ends it where it is rather
     than fighting whoever wants to look at something. */
  if(R.tour){ R.tour.skip=true; return; }
  const t={skip:false};
  R.tour=t;
  const alive=()=>!!R && R.tour===t && !t.skip;
  /* One re-composite for the whole tour, aimed at where it will LAND -
     and it is no blurrier at the top of the dive for being built at the
     bottom. RainViewer's free radar is real only to z7, so a frame for
     a z9 view and a frame for a z11 view fetch the same z7 tiles; on
     the glass at z11 both work out at a sixteenfold upscale of the same
     pixels. Re-compositing at every waypoint bought nothing and cost
     three times the work - 46% CPU across the tour against 20%.
     Not awaited: each frame replaces its own index as it lands, and the
     one it replaces keeps drawing in the right place until it does. */
  R.gen++;
  radRefresh({lat:CFG.lat, lon:CFG.lon, z:RAD.TOUR_MID});
  /* Two zoom levels a leg on the way down. One leg from 8 to 11 is an
     eightfold blow-up of the tiles you started with, and for half a
     second that is all anybody can see; capped at fourfold it reads as
     a dive rather than a smear, and the extra base build is thirty-odd
     tiles the browser has mostly cached already. */
  const legs=[];
  for(let z=R.view.z; z<RAD.TOUR_IN; ){
    z=Math.min(RAD.TOUR_IN, z+2); legs.push(z); }
  if(!legs.length) legs.push(RAD.TOUR_IN);
  try{
    radSay('OVER THE BOAT');
    for(const z of legs){
      if(!alive()) break;
      await radLeg(t, {lat:CFG.lat, lon:CFG.lon, z:z}, RAD.TOUR_LEG);
    }
    if(alive()) await radHold(t, RAD.TOUR_HOLD);
    if(alive()) await radLeg(t, {lat:CFG.lat, lon:CFG.lon, z:RAD.TOUR_MID},
                             RAD.TOUR_RISE);
  }catch(e){}
  if(R && R.tour===t){
    R.tour=null; R.cam=null;
    radSay('');
    radPlay(true);
    /* The last leg already built the base and started re-compositing
       the timeline for it, so there is nothing left to rebuild - only
       the case where the app opened with no radar at all. */
    if(!R.frames.length) radReview(true); else radPaint();
  }
}

function radOpen(host){
  const W=host.clientWidth||1080, H=host.clientHeight||1080;
  const cv=document.createElement('canvas');
  cv.width=W; cv.height=H; cv.id='rad-cv';
  const base=document.createElement('canvas'); base.width=W; base.height=H;
  host.appendChild(cv);
  host.insertAdjacentHTML('beforeend',
    '<div id="rad-hud">'
    +'<div id="rad-head"><span id="rad-time">—</span>'
    +'<div id="rad-note"></div>'
    +'<div id="rad-cred">Esri · OpenSeaMap · RainViewer · Tomorrow.io</div>'
    +'<svg id="rad-chev" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg>'
    +'</div>'
    +'<div id="rad-more">'
    +'<div class="rad-sec">TIDE<span id="rad-tide-at"></span></div>'
    +'<div id="rad-tide">…</div>'
    +'<div class="rad-sec">SAILING WINDOW</div>'
    +'<div id="rad-win">…</div><div id="rad-winsub"></div>'
    +'<svg id="rad-strip" viewBox="0 0 420 76" preserveAspectRatio="none"></svg>'
    +'<div id="rad-sun"></div>'
    +'</div></div>'
    +'<div id="rad-tools">'
    +'<div id="rad-scrub">'
    +'<button id="rad-play" aria-label="play or pause">'
    +'<svg viewBox="0 0 24 24"><path id="rad-playico" d=""/></svg></button>'
    +'<span class="rad-end">−2h</span>'
    +'<div id="rad-slide"><div id="rad-track"><div id="rad-knob"></div>'
    +'<div id="rad-now" style="display:none"></div></div></div>'
    +'<span class="rad-end fut">+3h</span>'
    +'</div>'
    +'<div id="rad-pills">'
    +'<button class="radt on" id="rad-sea">SEA</button>'
    +'<button class="radt on" id="rad-rain">RAIN</button>'
    +'<span id="rad-sp"></span>'
    +'<button class="radt" id="rad-home">BOAT</button>'
    +'</div></div>');
  R={ ac:new AbortController(), gen:1, bgen:0, cv:cv, base:base,
      frames:[], fv:[], mk:[], times:[], kinds:[],
      p:0, timer:null, note:'', playing:true,
      seaOn:true, rainOn:true, cam:null, tour:null, cast:null, castFail:0,
      view:{lat:CFG.lat, lon:CFG.lon, z:8},
      el:{time:$('rad-time'), bar:$('rad-knob'), note:$('rad-note'),
          now:$('rad-now')} };
  /* The clock is the handle. gClaim keeps the tap from also reading as
     the swipe that closes the app. */
  $('rad-head').addEventListener('click',()=>{ gClaim(); radMore(); });
  $('rad-home').addEventListener('click',()=>radTour());
  $('rad-play').addEventListener('click',()=>radPlay(!R.playing));
  /* The two layer pills. Seamarks are a base layer, so dropping them
     rebuilds the base - cheap, and the radar frames are untouched.
     Rain is drawn on top of it, so turning that off is one repaint and
     turning it back on is instant: the frames stay in memory, which is
     the whole point of keeping them there. */
  $('rad-sea').addEventListener('click',e=>{
    R.seaOn=!R.seaOn; e.currentTarget.classList.toggle('on',R.seaOn);
    radBuildBase(); });
  $('rad-rain').addEventListener('click',e=>{
    R.rainOn=!R.rainOn; e.currentTarget.classList.toggle('on',R.rainOn);
    radPaint(); });
  let scrub=false;
  const sc=$('rad-slide');
  sc.addEventListener('pointerdown',e=>{ gClaim(); scrub=true;
    try{ sc.setPointerCapture(e.pointerId); }catch(err){}
    radScrubTo(e.clientX); });
  sc.addEventListener('pointermove',e=>{ if(scrub) radScrubTo(e.clientX); });
  sc.addEventListener('pointerup',()=>{ scrub=false; });
  sc.addEventListener('pointercancel',()=>{ scrub=false; });
  radPlayIco();
  /* Drag to pan. The radar is hidden while the finger is down and
     rebuilt when it lifts: recompositing fifteen frames per pointermove
     would be the one expensive thing in here. */
  const ptrs=new Map();
  let drag=null, pin=null, lock=false;
  const two=()=>{ const a=[...ptrs.values()];
    return {x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2,
            d:Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y)}; };
  /* Committing the pinch. The preview is a continuous scale; the map
     only has integer zooms, so the nearest one wins - and the ground
     under the midpoint of the two fingers has to end up back under the
     midpoint of the two fingers. A pinch that walks the chart away from
     the thing you pinched is the one thing everybody notices. */
  const endPinch=()=>{
    const q=R.cam; R.cam=null; pin=null;
    if(!q){ radPaint(); return; }
    const z=R.view.z;
    const zn=Math.max(RAD.MIN_Z, Math.min(RAD.MAX_Z,
              Math.round(z+Math.log(q.s)/Math.LN2)));
    const k=Math.pow(2, zn-z), ox=q.cx-R.cv.width/2, oy=q.cy-R.cv.height/2;
    const gx=(wx(R.view.lon,z)+ox)*k-ox, gy=(wy(R.view.lat,z)+oy)*k-oy;
    R.view.z=zn; R.view.lon=unwx(gx,zn); R.view.lat=unwy(gy,zn);
    radReview();
  };
  cv.addEventListener('pointerdown',e=>{ gClaim();
    if(R.tour) R.tour.skip=true;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    if(ptrs.size===2){
      /* A second finger turns a pan into a zoom. lock keeps the finger
         still down when the pinch ends from starting a fresh pan from
         wherever it happens to be, which reads as a jump. */
      drag=null; lock=true;
      const m=two(), r=cv.getBoundingClientRect();
      pin={d0:m.d||1, cx:m.x-r.left, cy:m.y-r.top};
      R.cam={s:1, cx:pin.cx, cy:pin.cy, tx:0, ty:0};
    }else if(ptrs.size===1 && !lock){
      drag={x:e.clientX,y:e.clientY,lat:R.view.lat,lon:R.view.lon};
    }
  });
  cv.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pin && ptrs.size>=2){
      const m=two();
      const lo=Math.pow(2, RAD.MIN_Z-R.view.z), hi=Math.pow(2, RAD.MAX_Z-R.view.z);
      R.cam={s:Math.max(lo, Math.min(hi, m.d/pin.d0)), cx:pin.cx, cy:pin.cy, tx:0, ty:0};
      radPaint();
      return;
    }
    if(!drag) return;
    const z=R.view.z, s=256*Math.pow(2,z);
    const nx=wx(drag.lon,z)-(e.clientX-drag.x), ny=wy(drag.lat,z)-(e.clientY-drag.y);
    R.view.lon=nx/s*360-180;
    const t=Math.PI-2*Math.PI*ny/s;
    R.view.lat=180/Math.PI*Math.atan(0.5*(Math.exp(t)-Math.exp(-t)));
    radPaintBaseOnly();
  });
  const up=e=>{
    ptrs.delete(e.pointerId);
    if(pin && ptrs.size<2) endPinch();
    if(ptrs.size===0){
      lock=false;
      if(drag){ drag=null; radReview(); }
    }
  };
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
  radReview();
  radTick();
}
/* While the finger is down: move the base under it, no radar. */
function radPaintBaseOnly(){
  if(!R) return;
  /* gen still moves - a frame build half way through is for the centre
     the chart has just left. What does NOT happen any more is throwing
     away the finished ones: every frame carries the view it was built
     for, so they slide under the finger with the base instead of the
     weather vanishing the moment you touch the chart. */
  R.gen++;
  radBuildBase();
}

/* Give it ALL back. Zeroing a canvas is what actually frees its pixel
   buffer - dropping the reference only makes it eligible, and a 1080
   canvas is 4.7 MB the collector is in no hurry about. */
function radClose(){
  if(!R) return;
  const r=R; R=null;
  try{ r.ac.abort(); }catch(e){}
  clearTimeout(r.timer);
  r.frames.forEach(c=>{ if(c) c.width=c.height=0; });
  r.frames.length=0; r.times.length=0; r.kinds.length=0;
  r.fv.length=0; r.mk.length=0;
  if(r.cast) r.cast.frames.forEach(c=>{ if(c) c.width=c.height=0; });
  if(r.base) r.base.width=r.base.height=0;
  if(r.cv)   r.cv.width=r.cv.height=0;
}
function radarOpen(host){ radOpen(host); }
function radarClose(){ radClose(); }

/* ==================================================================
   THE APP DRAWER

   An app is not a page. A page is always loaded and always costing
   something; an app exists between the tap that launches it and the tap
   that closes it, and then it is torn down - its timers cancelled, its
   fetches aborted, its image caches dropped and its canvas backing
   stores freed. That is the whole reason apps live in a drawer.

   Adding one is an entry here. Each carries its own open() and close(),
   because only the app knows what it allocated:

     open(host)   build into `host` (an empty div filling the circle)
     close()      give it ALL back - every timer, every fetch, every
                  bitmap, every canvas. The test measures this.        */
const APPS=[
  {id:'radar', name:'Radar',
   ico:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.6"/>'
      +'<path d="M12 12l6.4-6.4"/>',
   open:radarOpen, close:radarClose},
];

const APP={on:null};

function drawApps(){
  const row=$('app-row');
  wSty('apps-empty','display', APPS.length?'none':'');
  if(row.childElementCount===APPS.length) return;      /* built once */
  row.innerHTML=APPS.map((a,i)=>
    '<button class="tile" data-app="'+i+'">'
    +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" '
    +'stroke-linecap="round" stroke-linejoin="round">'+a.ico+'</svg>'
    +'<span>'+a.name.toUpperCase()+'</span></button>').join('');
  row.querySelectorAll('[data-app]').forEach(b=>
    b.addEventListener('click',()=>openApp(APPS[+b.dataset.app])));
}

function openApp(a){
  if(APP.on) return;
  APP.on=a;
  $('app-name').textContent=a.name;
  $('app-run').classList.remove('failed');
  $('app-msg').textContent='';
  $('app-run').classList.add('on');
  closeApps();
  try{ a.open($('app-body')); }
  catch(e){
    $('app-run').classList.add('failed');
    $('app-msg').textContent=String(e&&e.message||e);
  }
}

function closeApp(){
  const a=APP.on; if(!a) return;
  APP.on=null;
  /* The app gives its own memory back FIRST, while its nodes are still
     in the document - a canvas already detached can still hold its
     backing store, and an in-flight fetch does not care either way. */
  try{ a.close(); }catch(e){}
  $('app-body').innerHTML='';
  $('app-run').classList.remove('on','failed');
}
function appFail(msg){
  $('app-run').classList.add('failed');
  $('app-msg').textContent=msg;
}
$('app-close').addEventListener('click',closeApp);

/* ---- fullscreen -------------------------------------------------------
   On the boat this is a no-op: the Pi already launches Chromium with
   --kiosk. It earns its place everywhere else - a phone or a laptop
   opening the same file gets browser chrome eating into the circle, and
   there is no keyboard out there to press F11 with.

   The FULL/KIOSK tile that used to sit next to this, with a
   hold-to-reload on it, is gone. Kiosk and Desktop in the power sheet do
   the switching now, and they do it properly - taking the fit, the touch
   mapping and the desktop's own panel with them, which a tile that only
   knew about --kiosk never could. The power sheet's Reload tile covers
   what the hold did. This one predicate stays because fitStage() below
   reads it to tell round glass from a window.                        */
const fsOn=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);

/* Circle when we are actually on round glass (a square viewport) or
   deliberately full screen; square everywhere else. Keyed off the shape
   of the viewport rather than fullscreen alone, because the Pi runs
   --kiosk, which is NOT the Fullscreen API - fullscreenElement is null
   there and a fullscreen-only test would wrongly un-round the panel. */
function fitStage(){
  const square = Math.abs(innerWidth/innerHeight - 1) < 0.06;
  document.documentElement.classList.toggle('win', !(fsOn() || square));
}
document.addEventListener('fullscreenchange',fitStage);
document.addEventListener('webkitfullscreenchange',fitStage);
addEventListener('resize',fitStage);
/* A resize listener alone is not enough: it does not fire for every way a
   viewport can change (mobile toolbars sliding, embedded hosts resizing
   the frame). Watching the element itself catches all of them, and the
   handler is a single classList toggle, so the cost is nil.          */
if(window.ResizeObserver) new ResizeObserver(fitStage).observe(document.documentElement);
fitStage();

/* Deliberately NOT stopping propagation, and gated on distance. SAVER
   sits near the middle of the open
   panel, which is where a dismiss swipe starts: swallowing the events
   meant the swipe failed to close the panel AND walked the blank delay
   one step, so one bad swipe took it to 10 s and the helm started
   blanking ten seconds after every touch, mid-race, with nothing on
   screen to say why. judgeGesture returns early whenever the panel is
   open, so letting the events through costs nothing underneath. */
let ssHold=null, ssPt=null;
const ssFar=e=>!ssPt||Math.hypot(e.clientX-ssPt.x,e.clientY-ssPt.y)>24;
$('ss-btn').addEventListener('pointerdown',e=>{
  ssPt={x:e.clientX,y:e.clientY};
  ssHold=setTimeout(()=>{ ssHold=null;               /* held: start now */
    closePanel(); setTimeout(ssStart,460); }, 600);
});
const ssRelease=e=>{
  if(ssHold===null) return;                          /* the hold already fired */
  clearTimeout(ssHold); ssHold=null;
  if(ssFar(e)) return;                               /* a swipe, not a tap */
  ssStep=(ssStep+1)%SS_DELAYS.length;                /* tapped: next delay */
  drawAmbient(); lastTouch=Date.now();
};
$('ss-btn').addEventListener('pointerup',ssRelease);
$('ss-btn').addEventListener('pointercancel',()=>{ clearTimeout(ssHold); ssHold=null; });
drawAmbient();
saver.addEventListener('pointerdown',e=>{ e.stopPropagation(); ssStop(); });
addEventListener('pointerdown',()=>{ lastTouch=Date.now(); });
addEventListener('resize',()=>{ if(ssOn) ssInit(); });
ssTick();

/* keep the panel awake - belt and braces alongside kiosk settings */
if('wakeLock' in navigator){
  const hold=()=>navigator.wakeLock.request('screen').catch(()=>{});
  hold(); document.addEventListener('visibilitychange',hold);
}

drawBezelTicks();
/* Preferences first: applyTheme, drawDepth and applyDim below all read
   CFG, so restoring it has to happen before any of them run. */
prefsLoad(); applyDim(CFG.dim,false); layoutPages();
/* Warm the radio state at boot rather than on first panel open. The call
   costs a handful of subprocesses on the Pi, and doing it here means it
   has long finished by the time anyone swipes up - instead of the panel
   drawing its empty state and filling in while you watch. */
netStatus();
/* ---- the boot currents ----
   Drawn across 2160 so a -1080 drift loops seamlessly, which needs
   every wavelength to divide 1080 exactly. Generated rather than
   hand-authored: 361 points of path data is not something to keep by
   hand, and the three only differ by four numbers.

   All three settle onto y=660, so the collapse lands them on top of
   each other and the accent is the one left standing. */
(function bootWaves(){
  const path=(amp,wl,phase,y)=>{
    let d='';
    for(let x=0;x<=2160;x+=6)
      d+=(x?'L':'M')+x+' '+(y+amp*Math.sin((x/wl)*Math.PI*2+phase)).toFixed(1);
    return d;
  };
  const p1=$('bt-p1'), p2=$('bt-p2'), p3=$('bt-p3');
  if(!p1) return;
  p1.setAttribute('d', path(30,360,0.0,542));
  p2.setAttribute('d', path(38,540,1.9,660));
  p3.setAttribute('d', path(24,270,3.4,778));
  /* The ceiling. Signal K answering is what normally clears this; the
     timer is only here for when it never does. Guarded, so that a delta
     that beat us here keeps its own shorter timer. */
  if(BOOT.up && !BOOT.timer) BOOT.timer=setTimeout(bootSettle, BOOT.CEIL);
})();

drawDepth(); paintTrack(); applyTheme(); connect(); render(); tick();

</script>
