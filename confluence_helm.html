<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CONFLUENCE · Helm</title>
<style>
/* ==================================================================
   CONFLUENCE HELM  ·  1080x1080 round panel  ·  Signal K
   Swipe UP anywhere -> control panel.  Swipe DOWN -> dismiss.

   Sizing is against the real glass: 178.15 mm across 1080 px, so
   6.06 px/mm. Touch targets are 110 px = 18 mm, which is what wet
   hands on a heeled boat actually need - phone-sized targets are
   not usable out there.
   ================================================================== */
:root{--font:'Poppins','Inter',-apple-system,'Segoe UI',Roboto,sans-serif}

body{                                   /* DAY - built to beat sun   */
  --bg:#F4F6F7; --ink:#080A0C; --ink-dim:#3A4248; --label:#5A636A;
  --hairline:#B9C1C7; --accent:#0B4FD6; --port:#C81E1E; --stbd:#0E7A43;
  --warn:#B36A00; --alarm:#C81E1E; --panel:#E4E8EA; --chip:#D2D8DC;
  --w-huge:600; --w-val:600; --w-lbl:600;
}
body.dusk{
  --bg:#0B0C0E; --ink:#F2F4F6; --ink-dim:#9AA2A9; --label:#6C757C;
  --hairline:#242A2F; --accent:#4A9EFF; --port:#FF4D4D; --stbd:#24D17E;
  --warn:#FFB020; --alarm:#FF3B30; --panel:#15181B; --chip:#22272B;
  --w-huge:300; --w-val:300; --w-lbl:500;
}
body.night{
  --bg:#050303; --ink:#C8342E; --ink-dim:#8A2723; --label:#5E1A17;
  --hairline:#1C0A09; --accent:#E04A3F; --port:#C8342E; --stbd:#C8342E;
  --warn:#C8342E; --alarm:#FF5A4E; --panel:#0E0605; --chip:#1A0A09;
  --w-huge:300; --w-val:300; --w-lbl:500;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;font-family:var(--font);
  overflow:hidden;-webkit-user-select:none;user-select:none;cursor:none;
  touch-action:none}
body{display:flex;align-items:center;justify-content:center}
#stage{width:100vmin;height:100vmin;margin:0 auto;position:relative;
  border-radius:50%;overflow:hidden;background:var(--bg);flex:none}

/* --- pages ---
   Three places rather than three overlays: track map, dial, music side by
   side, with the whole row driven from one index. Same layers and the
   same transition as the slide-outs they replace - only the transform is
   now computed rather than toggled, which is what lets the dots mean
   something. The dial is the middle one because it is the one you come
   back to.
   The control panel stays an overlay: it is a layer over wherever you
   are, not a place you go. */
#svg{position:absolute;inset:0;width:100%;height:100%;
  transition:transform .42s cubic-bezier(.16,1,.3,1)}
/* Stacking, written down rather than left to DOM order. #panel sits
   BEFORE the music and track pages in the document, so with everything
   on auto they painted over it and the control panel opened behind
   whichever page you were on - invisible, and holding the gestures
   hostage. That could not happen while the panel was reachable only
   from the dial; making it reachable everywhere is what exposed it.
     1  pages      2  dots      20 control panel   30 screensaver
     55 alerts     70 lock      80 hold ring       99 fps readout   */
#svg,#music,#tmap{z-index:1}
#dots{position:absolute;left:0;right:0;bottom:64px;display:flex;
  justify-content:center;gap:18px;pointer-events:none;z-index:2}
#dots i{width:12px;height:12px;border-radius:50%;background:var(--label);
  opacity:.3;transition:opacity .25s,transform .25s,background .25s}
#dots i.on{opacity:1;background:var(--accent);transform:scale(1.2)}

/* ---- windowed mode ----------------------------------------------------
   No page can change a monitor's resolution - the Fullscreen API only
   changes how much of the screen we occupy - so 100vmin already scales
   this to fit any window and nothing is ever off-screen. What IS hidden
   on a rectangular screen is the four corners of the 1080 square, eaten
   by the round-bezel mask. Off the glass that mask is a liability: it
   hides real content (the library hint lived there once). So on a
   non-square viewport we drop the mask and show the whole square, with
   a dashed line marking where the physical bezel would actually cut.
   Fullscreen, or a square viewport - i.e. the real panel - puts the
   circle back.                                                        */
html.win #stage{border-radius:0}
html.win #stage::after{content:'';position:absolute;inset:0;border-radius:50%;
  border:2px dashed var(--hairline);opacity:.5;pointer-events:none;z-index:60}
svg{width:100%;height:100%;display:block}

.huge{font-size:268px;font-weight:var(--w-huge);fill:var(--ink);letter-spacing:-.02em}
.value{font-size:104px;font-weight:var(--w-val);fill:var(--ink)}
.value-s{font-size:68px;font-weight:var(--w-val);fill:var(--ink-dim)}
.unit{font-size:34px;font-weight:600;fill:var(--label);letter-spacing:.14em}
.label{font-size:32px;font-weight:var(--w-lbl);letter-spacing:.20em;
  fill:var(--label);text-transform:uppercase}
.tick-lbl{font-size:32px;font-weight:600;fill:var(--label)}
#mark{font-size:1320px;font-weight:700;fill:var(--ink);opacity:.032;
  letter-spacing:-.06em;pointer-events:none}
body.dusk #mark{opacity:.055}
body.night #mark{opacity:.07}
.sen{stroke:var(--label);fill:var(--label);opacity:.28;
  transition:opacity .3s,stroke .3s,fill .3s}
.sen.live{stroke:var(--stbd);fill:var(--stbd);opacity:1}
.tbtn circle{fill:none;stroke:var(--hairline);stroke-width:3}
.tbtn rect{fill:var(--label)}
.tbtn:active circle{fill:var(--chip)}
.strip{font-size:32px;font-weight:600;fill:var(--ink-dim);letter-spacing:.06em}
.strip.good{fill:var(--stbd)}.strip.bad{fill:var(--port)}
.pbtn rect{fill:none;stroke:var(--label);stroke-width:3}
.pbtn text{font-size:28px;font-weight:600;letter-spacing:.18em;fill:var(--label)}
.pbtn.set rect{stroke:var(--stbd)} .pbtn.set text{fill:var(--stbd)}
.pbtn:active rect{fill:var(--chip)}
.stale{opacity:.30}.alarm{fill:var(--alarm)!important}.warn{fill:var(--warn)!important}
text{font-variant-numeric:tabular-nums;dominant-baseline:middle}

/* ---------------- control panel ----------------
   Everything lives in a 600 px column, vertically centred. A circle
   only offers 680 px of width between y=140 and y=940, so nothing is
   allowed outside that band - which is what was clipping before.
   Rows are hairline-separated rather than chunky chips: discreet, and
   the whole row is the touch target (600 x 112 = 99 x 18 mm).        */
#panel{
  position:absolute;inset:0;background:var(--panel);z-index:20;
  transform:translateY(100%);
  transition:transform .42s cubic-bezier(.16,1,.3,1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--ink);
}
#panel.open{transform:translateY(0)}
/* Layer promotion only while a slide is actually running. Holding three
   1080x1080 layers on the GPU permanently costs real texture memory, and
   when that is tight the compositor re-uploads them anyway - which is the
   very hitch will-change was meant to prevent. JS adds .sliding as the
   slide starts and drops it once the transition has had time to finish. */
#panel.sliding,#tmap.sliding,#music.sliding{will-change:transform}
.sheet{width:600px;display:flex;flex-direction:column;align-items:stretch}
.grab{width:120px;height:8px;border-radius:4px;background:var(--label);
  opacity:.45;position:absolute;top:70px;left:50%;margin-left:-60px}
/* .p-title, the .row family and .chev used to live here: the panel was a
   list of label/value rows with a heading and a chevron. It is tiles and
   .slab sections now, and none of those class names appears anywhere in
   the markup or the script - checked, not assumed. */
/* Outlined, never filled - the panel now speaks the same language as the
   rail. Round for the steppers, pill for anything wearing words.      */
.mini{width:86px;height:86px;border-radius:50%;background:none;
  color:var(--ink);font-size:40px;font-weight:400;
  border:2px solid var(--hairline);font-family:var(--font);
  display:flex;align-items:center;justify-content:center}
.mini:active{background:var(--chip)}
/* .numv is defined further down, next to .steprow that uses it. A second
   copy lived here and lost on cascade order, so edits made to it did
   nothing at all - the same trap .mini fell into two lines below the
   real one. One definition, no drift. */

.slab{font-size:27px;font-weight:600;letter-spacing:.16em;color:var(--label);
  text-transform:uppercase;margin:30px 0 14px;padding-bottom:12px;
  border-bottom:2px solid var(--hairline)}
/* slimmer track, round accent thumb - the same restraint as the rail */
#dim{flex:1;height:14px;-webkit-appearance:none;appearance:none;
  background:var(--hairline);border-radius:7px;outline:none}
#dim::-webkit-slider-thumb{-webkit-appearance:none;width:76px;height:76px;
  border-radius:50%;background:var(--accent);border:6px solid var(--panel)}

/* --- theme control: a rail item that happens to sit beside the slider --- */
.tile{width:104px;flex:none;background:none;border:none;padding:8px 0;
  color:var(--label);font-family:var(--font);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:9px}
.tile svg{width:42px;height:42px;overflow:visible}
.tile span{font-size:17px;font-weight:600;letter-spacing:.1em}
/* the second line: what AUTO currently resolves to, or the idle delay */
.tile .sub{font-size:14px;font-weight:600;letter-spacing:.06em;
  color:var(--accent);margin-top:-4px}
.tile.off .sub{color:var(--label)}
#ss-ico,#fs-ico{fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
#ss-ico text{fill:currentColor;stroke:none;font-family:var(--font)}
.tile.on{color:var(--accent)}
.tile:active{color:var(--ink)}

/* --- brightness ---
   Both tiles and the slider share one row. The slider keeps whatever is
   left of the 600 px sheet after three tiles - about 234 px - which is
   short for a drag control, so the thumb stays large to compensate.   */
.dimrow{display:flex;align-items:center;gap:18px;padding-top:10px}
/* .dimico/.dimico.sm retired with the sun icons that used to flank the
   brightness slider - the tiles carry their own glyphs now. */
#dim-pct{float:right;color:var(--accent);letter-spacing:.06em}

/* --- depth widget: threshold and live reading on one scale --- */
.depthwrap{display:flex;flex-direction:column;gap:10px}
.bar{position:relative;height:46px;border-radius:12px;background:var(--chip);
  overflow:hidden}
.bar-alarm{position:absolute;left:0;top:0;bottom:0;background:var(--alarm);opacity:.55}
.bar-warn {position:absolute;top:0;bottom:0;background:var(--warn);opacity:.35}
.bar-now  {position:absolute;top:-5px;bottom:-5px;width:7px;border-radius:4px;
  background:var(--ink);box-shadow:0 0 0 4px var(--panel)}
.bar-scale{display:flex;justify-content:space-between;font-size:19px;
  font-weight:600;color:var(--label);letter-spacing:.1em}
.steprow{display:flex;align-items:center;gap:14px;margin-top:6px}
.numv{min-width:118px;text-align:center;font-size:40px;font-weight:600;color:var(--accent)}
.numv i{font-style:normal;font-size:20px;color:var(--label);margin-left:6px;
  letter-spacing:.12em}
/* This was a second, full copy of .mini that still carried the old chip
   look and won on cascade order - the reason the outlined restyle above
   appeared to do nothing. Reduced to the one property it actually adds,
   so the two definitions can no longer drift apart.                   */
.mini{flex:none}
/* a wide button inheriting border-radius:50% renders as an ellipse, not a
   pill - give it a real corner radius of its own */
.mini.wide{width:auto;flex:1;border-radius:43px;font-size:22px;font-weight:600;
  letter-spacing:.14em;color:var(--label)}
/* :active handled by the single .mini:active rule above */

.senrow{position:relative;margin-bottom:26px}
#sen-svg{display:block;width:340px;height:60px;margin:0 auto}
/* Absolutely placed rather than laid out in a flex row, so the four
   glyphs stay centred on the sheet exactly where they were and the
   toggle takes the slack that was already there beside them. */
.demo-tog{position:absolute;right:0;top:8px;height:44px;padding:0 20px;
  border:2px solid var(--hairline);border-radius:22px;background:none;
  color:var(--label);font:600 21px/1 inherit;letter-spacing:.14em;
  opacity:.5;transition:opacity .2s,color .2s,border-color .2s,background .2s}
.demo-tog:active{background:var(--chip)}
/* On, it is a warning and reads like one: these glyphs are lying. */
.demo-tog.on{opacity:1;color:var(--warn);border-color:var(--warn)}

/* --- connectivity ------------------------------------------------
   A row of radios at the top of the panel. No words on them, because
   the state IS the icon: arcs filled to signal for a client, a base
   station for an adapter that is itself the hotspot, a slash for one
   that is down.

   One button per adapter rather than one for "WiFi". Two radios with
   opposite jobs is the normal case here - the onboard one running the
   hotspot everything aboard is joined to, a dongle reaching out to a
   marina - and a single switch cannot say that. Onboard first, then
   USB, and the USB one wears a small aerial. That order has to hold
   across reboots, which is why the helper keys it off the bus and not
   off wlan0/wlan1 - those can swap.

   Outlined, never filled, like everything else on this panel.      */
.conn{display:flex;justify-content:center;gap:26px;margin-bottom:32px}
.cbtn{width:104px;height:104px;border-radius:50%;background:none;flex:none;
  border:2px solid var(--hairline);color:var(--label);font-family:var(--font);
  display:flex;align-items:center;justify-content:center}
.cbtn svg{width:54px;height:54px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.cbtn svg .f{fill:currentColor;stroke:none}
.cbtn:active{background:var(--chip)}
.cbtn.on{color:var(--accent);border-color:var(--accent)}
.cbtn.off{opacity:.42}

/* --- the picker -------------------------------------------------
   Full-bleed over the panel, exactly as the race library sits over
   the map. */
#netsheet{position:absolute;inset:0;background:var(--panel);opacity:0;
  pointer-events:none;transition:opacity .22s;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:var(--ink)}
#netsheet.on{opacity:1;pointer-events:auto}
.ns{width:600px;display:flex;flex-direction:column}
.ns-head{display:flex;align-items:center;justify-content:space-between;
  padding-bottom:14px;border-bottom:2px solid var(--hairline)}
.ns-title{font-size:28px;font-weight:600;letter-spacing:.24em;color:var(--label);
  text-transform:uppercase}
/* which adapter this picker is driving - the panel itself says nothing,
   so this is the only place the two are told apart in words */
.ns-for{font-size:19px;font-weight:600;letter-spacing:.12em;color:var(--label);
  text-transform:uppercase;margin-top:8px;opacity:.75}
/* the only switch in the app, so it may as well look like one */
.sw{width:104px;height:56px;border-radius:28px;background:var(--hairline);
  position:relative;flex:none;border:none;padding:0;transition:background .18s}
.sw b{position:absolute;top:5px;left:5px;width:46px;height:46px;border-radius:50%;
  background:var(--panel);transition:transform .18s}
.sw.on{background:var(--stbd)}
.sw.on b{transform:translateX(48px)}

/* Fixed at four rows. A scan that returns a different count every few
   seconds must not make the sheet breathe in and out under your hand. */
.ns-list{height:448px;overflow:hidden}
.ns-row{display:flex;align-items:center;gap:18px;height:112px;
  border-bottom:2px solid var(--hairline)}
.ns-row:active{background:var(--chip)}
.ns-row .bars{width:34px;height:34px;flex:none;color:var(--label)}
.ns-row.live .bars{color:var(--accent)}
.ns-main{flex:1;min-width:0}
.ns-name{font-size:30px;font-weight:600;color:var(--ink);letter-spacing:.03em;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ns-row.live .ns-name{color:var(--accent)}
.ns-sub{font-size:20px;font-weight:600;color:var(--label);letter-spacing:.1em;
  margin-top:6px;text-transform:uppercase}
.ns-empty{height:448px;display:flex;align-items:center;justify-content:center;
  font-size:26px;color:var(--label);letter-spacing:.14em;text-align:center}

/* --- power: two tiers ---
   Three actions that give the panel back in seconds, then a rule, then
   the two that take the instruments off a boat which may be moving. The
   split is the information: you read it before you read the words,
   which is the moment it matters.

   Tiles rather than rows because five 112 px rows do not fit a 448 px
   window - the fifth used to fall off the bottom, behind a pager that
   was never wired to this list. */
/* The list window is 448px because that is four rows. The tiers are
   shorter than that, and a fixed height left DONE stranded 108px below
   them - so on this sheet the window takes its height from what is in
   it and the whole block centres properly. */
.ns-list.tiers{height:auto;padding-top:26px}
.pw-tier{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pw-tier.low{grid-template-columns:repeat(2,1fr);
  margin-top:20px;padding-top:20px;border-top:2px solid var(--hairline)}
.pw-tile{border:2px solid var(--hairline);border-radius:26px;
  padding:26px 10px 22px;display:flex;flex-direction:column;
  align-items:center;gap:14px;color:var(--ink);background:none}
.pw-tile:active{background:var(--chip)}
.pw-tile svg{width:52px;height:52px;flex:none;color:var(--label);fill:none;
  stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pw-tile b{font-size:26px;font-weight:600;letter-spacing:.06em}
/* Night is a single red hue, so danger cannot rest on colour alone -
   the rule above these two and their position under it carry it. */
.pw-tile.danger{border-color:var(--alarm)}
.pw-tile.danger svg, .pw-tile.danger b{color:var(--alarm)}

/* Paged rather than scrolled. html and body carry touch-action:none, so
   a flick inside an overflow:auto box is not reliably a pan here - and
   a page you can hit with a wet glove beats a list you have to nudge. */
.ns-pager{display:flex;align-items:center;gap:14px;margin-top:16px}
.ns-count{flex:1;text-align:center;font-size:21px;font-weight:600;
  letter-spacing:.14em;color:var(--label)}
.mini.dim{opacity:.22}
.ns-msg{height:32px;margin-top:10px;text-align:center;font-size:21px;
  font-weight:600;letter-spacing:.12em;color:var(--label)}
.ns-msg.bad{color:var(--alarm)}

/* --- the confirm screen --- */
.ask-title{font-size:40px;font-weight:600;color:var(--ink);text-align:center;
  letter-spacing:.02em}
.ask-body{font-size:25px;line-height:1.5;color:var(--label);text-align:center;
  margin:26px 0 36px}
.mini.wide.danger{color:var(--alarm);border-color:var(--alarm)}
.ns-row.danger .ns-name{color:var(--alarm)}

/* --- password entry ---
   A keyboard of our own. The helm has no keyboard, and Chromium under
   --kiosk has no on-screen one to offer, so without this a WPA key is
   untypeable without carrying a USB keyboard aboard.               */
.pw-for{font-size:25px;font-weight:600;letter-spacing:.1em;color:var(--label);
  text-align:center;text-transform:uppercase;overflow:hidden;white-space:nowrap;
  text-overflow:ellipsis}
.pw-field{height:80px;margin:14px 0 18px;border-radius:16px;background:var(--chip);
  display:flex;align-items:center;padding:0 22px;overflow:hidden}
.pw-txt{flex:1;font-size:32px;font-weight:600;color:var(--ink);letter-spacing:.06em;
  overflow:hidden;white-space:nowrap}
.pw-cur{width:3px;height:40px;background:var(--accent);flex:none;
  animation:pwblink 1.1s steps(2,end) infinite}
@keyframes pwblink{50%{opacity:0}}
.kb{display:flex;flex-direction:column;gap:8px}
.kb-r{display:flex;gap:6px;justify-content:center}
.kk{height:74px;flex:1;min-width:0;border-radius:12px;background:var(--chip);
  border:none;font-family:var(--font);font-size:30px;font-weight:600;color:var(--ink);
  display:flex;align-items:center;justify-content:center}
.kk:active{background:var(--accent);color:var(--panel)}
.kk.fn{flex:1.5;font-size:21px;letter-spacing:.08em;color:var(--ink-dim)}
.kk.fn.on{background:var(--hairline);color:var(--ink)}
.kk.sp{flex:4}
.kk.go{flex:2.2;font-size:22px;letter-spacing:.14em;background:var(--accent);
  color:var(--panel)}

/* The .pills grid was the first form of the sensor liveness row. It is
   the four .sen glyphs at the top of the panel now, lit by wCls(el,
   'live', ok) from render()'s DATA block - see .sen.live above. */

/* record state is carried by .rbtn.rec.on */
/* (the panel's ambient rail was folded into .dimrow - rule retired) */
/* the status element is now the centred .t-status line above the rail */
.hint{font-size:22px;letter-spacing:.2em;color:var(--label);opacity:.7;
  text-align:center;margin-top:34px}
/* which build is on the glass. Small, permanent, and the only way to tell
   three copies of this file apart at a glance. */
.build{margin-left:18px;font-size:19px;letter-spacing:.14em;opacity:.6}
/* --- ambient screensaver --- */
#saver{position:absolute;inset:0;background:var(--bg);opacity:0;z-index:30;
  pointer-events:none;transition:opacity .5s}
#saver.on{opacity:1;pointer-events:auto}
#ss-cv{position:absolute;inset:0;width:100%;height:100%}
.ss-mid{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none}
.ss-lbl{font-size:30px;font-weight:600;letter-spacing:.24em;color:var(--label);
  text-transform:uppercase}
.ss-val{font-size:300px;font-weight:var(--w-huge);color:var(--ink);
  line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ss-unit{font-size:32px;font-weight:600;letter-spacing:.2em;color:var(--label)}
.ss-foot{position:absolute;bottom:150px;left:0;right:0;text-align:center;
  font-size:38px;font-weight:600;color:var(--label);letter-spacing:.1em;
  pointer-events:none}

/* --- track map --- */
#tmap{position:absolute;inset:0;background:var(--panel);
  transform:translateX(-100%);
  transition:transform .42s cubic-bezier(.16,1,.3,1);
  color:var(--ink)}
#t-svg{position:absolute;inset:0}
.t-title{position:absolute;top:112px;left:0;right:0;text-align:center;
  font-size:28px;font-weight:600;letter-spacing:.24em;color:var(--label);
  text-transform:uppercase}
.t-stats{position:absolute;bottom:348px;left:50%;margin-left:-300px;width:600px;
  display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
/* Two rows now. Row one sits at y~802-888 (chord 826) and row two at
   y~898-984 (chord 614), so the narrower second row clears the curve.  */
/* ---- rail: the shared control language --------------------------------
   Borderless icon over a caption, one hairline above the group, nothing
   filled. Used by the track slide-out AND the control panel so the two
   read as one instrument rather than two apps bolted together.
   92 px targets - 15 mm - with the caption doing the work an icon alone
   cannot do when your hands are wet and it is blowing 20.             */
.rail{display:flex;justify-content:space-between;align-items:flex-start;
  border-top:2px solid var(--hairline);padding-top:20px}
.rbtn{background:none;border:none;padding:0;font-family:var(--font);
  display:flex;flex-direction:column;align-items:center;gap:9px;
  width:92px;padding:8px 0;color:var(--label);
  -webkit-tap-highlight-color:transparent}
.rbtn svg{width:42px;height:42px;fill:none;stroke:currentColor;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rbtn svg .f{fill:currentColor;stroke:none}
.rbtn b{font-size:17px;font-weight:600;letter-spacing:.1em}
.rbtn:active{color:var(--ink)}
.rbtn.on{color:var(--accent)}
.rbtn.rec.on{color:var(--port)}

.t-status{position:absolute;bottom:306px;left:0;right:0;text-align:center;
  font-size:24px;font-weight:600;letter-spacing:.1em;color:var(--label)}
/* Lifted clear of the curve: at bottom:112 the rail's bottom corners sat
   at 97.9% of the radius, ~11 px from the glass edge. Here they sit near
   94%, which is a margin rather than a coincidence.                   */
.t-rail{position:absolute;bottom:183px;left:50%;margin-left:-310px;width:620px}
.t-attr{position:absolute;top:150px;left:0;right:0;text-align:center;
  font-size:17px;letter-spacing:.1em;color:var(--label);opacity:.55}

/* --- track library --- */
#t-lib{position:absolute;inset:0;background:var(--panel);opacity:0;
  pointer-events:none;transition:opacity .22s;display:flex;
  flex-direction:column;align-items:center;justify-content:center}
#t-lib.on{opacity:1;pointer-events:auto}
.lib-list{width:600px;max-height:600px;overflow-y:auto;overscroll-behavior:contain}
.lib-row{display:flex;align-items:center;gap:16px;height:112px;
  border-bottom:2px solid var(--hairline)}
.lib-row:active{background:var(--chip)}
.lib-main{flex:1;text-align:left;min-width:0}
.lib-name{font-size:30px;font-weight:600;color:var(--ink);letter-spacing:.04em}
.lib-sub{font-size:22px;font-weight:500;color:var(--label);letter-spacing:.08em;
  margin-top:6px}
.lib-empty{font-size:26px;color:var(--label);letter-spacing:.14em;text-align:center}
.lib-head{font-size:20px;font-weight:600;letter-spacing:.18em;color:var(--label);
  text-transform:uppercase;padding:18px 0 8px}
a.lib-row{text-decoration:none;color:inherit}

/* --- the QR sheet ---
   Always black on white regardless of the theme: a camera wants
   contrast and the right polarity, not the night palette. It sits
   above the library, which is itself above the track page.        */
#qr-sheet{position:absolute;inset:0;background:var(--panel);opacity:0;z-index:10;
  /* above #t-lib, which is a sibling with no z-index of its own */
  pointer-events:none;transition:opacity .18s;display:flex;
  flex-direction:column;align-items:center;justify-content:center}
#qr-sheet.on{opacity:1;pointer-events:auto}
#qr-box{background:#fff;padding:22px;border-radius:18px;line-height:0}
#qr-box svg{display:block;width:512px;height:512px;shape-rendering:crispEdges}
#qr-name{font-size:27px;font-weight:600;color:var(--ink);letter-spacing:.03em;
  margin-bottom:18px;max-width:640px;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#qr-url{font-size:19px;color:var(--label);letter-spacing:.04em;margin-top:14px;
  max-width:700px;text-align:center;word-break:break-all}
#qr-why{font-size:20px;color:var(--label);letter-spacing:.1em;margin-top:14px}
#qr-alt{font-size:19px;color:var(--label);letter-spacing:.1em;margin-top:8px;
  opacity:.7}
/* The library's hint says more than the map's, and bottom:44px is the
   narrowest part of the circle - 637 px of text into a 491 px chord, so
   73 px fell off each end. Lift it to where the chord is 629 px and set
   a smaller face, which leaves ~100 px of clearance.                  */
#lib-hint{bottom:88px;font-size:19px;letter-spacing:.12em}
.t-stats b{display:block;font-size:44px;font-weight:600;color:var(--ink)}
.t-stats span{font-size:18px;font-weight:600;letter-spacing:.16em;color:var(--label)}
.t-hint{position:absolute;bottom:104px;left:0;right:0;text-align:center;
  font-size:22px;letter-spacing:.2em;color:var(--label);opacity:.7}

/* --- now playing --- */
#music{position:absolute;inset:0;background:var(--panel);
  transform:translateX(100%);
  transition:transform .42s cubic-bezier(.16,1,.3,1);
  display:flex;align-items:center;justify-content:center;
  color:var(--ink)}

.m-sheet{width:600px;display:flex;flex-direction:column;align-items:center}
/* Back to 300. The control bar's 68px came out of the art when it was
   added; tightening every line-height on this page from Poppins' loose
   `normal` metrics, plus a few margins, gave most of it back: 280
   rather than 232. The sheet is vertically centred, so every 2px of art
   costs 1px of the gap between the control bar and the lock - 280 is
   what leaves 21px there, and both are tap targets so that gap is the
   thing that sets the size.

   1.43 and not lower, and the number is measured rather than chosen.
   Poppins' `normal` line-height is about 1.5; its FONT BOX - ascent
   plus descent, which is what half-leading centres in the line box - is
   1.42em. At or above that, no glyph the font can draw can meet the
   lane's overflow:hidden. Below it, some can: the ink of ordinary Latin
   text survives down to about 1.24, but a track title is arbitrary text
   from Spotify and tuning to the descenders of an English sample would
   clip the first title with an accented capital in it. So the safe
   bound, not the observed one. The test asserts every lane against the
   font box so this cannot be tightened by eye later. */
.artwrap{position:relative;width:280px;height:280px;margin-bottom:18px;flex:none}
.art{width:280px;height:280px;border-radius:50%;background:var(--chip);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  color:var(--label);flex:none;position:relative;z-index:1}
/* --- the volume bezel ---
   Ticks rather than a solid arc, because this panel already has one tick
   ring - the wind bezel - and a second idiom for the same kind of reading
   would be a second thing to learn. The 60 degrees at the bottom are left
   open on purpose: a gap gives the scale a beginning and an end, and
   without one 65% reads as nearly full. It is also where the title is,
   so nothing there is a target. */
.vring{position:absolute;left:-40px;top:-40px;width:360px;height:360px;
  pointer-events:none;z-index:2}
.vt{stroke:var(--hairline);stroke-width:3.5;stroke-linecap:round}
.vt.maj{stroke-width:5}
.vt.on{stroke:var(--accent)}
/* The device reports a volume and refuses to set one - an iPhone does
   exactly this. Shown, so it is not mysteriously missing, but plainly
   not live, and a touch says why. */
.artwrap.dead .vring{opacity:.34}
.vhit{position:absolute;left:-40px;top:-40px;width:360px;height:360px;
  border-radius:50%;z-index:0}
.vnum{position:absolute;inset:0;z-index:3;border-radius:50%;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--ink);font-size:76px;font-weight:600;letter-spacing:.03em;
  line-height:1.1}
/* The scrim is a layer of its own so the number can sit on it at FULL
   strength. A translucent black panel was fine at night and unreadable
   in daylight, where --ink is nearly black too: ink on a dark wash is no
   contrast at all. --bg under --ink is the app's own contrast pair and
   is right in all three themes by construction. */
.vnum::before{content:'';position:absolute;inset:0;border-radius:50%;
  background:var(--bg);opacity:.88}
.vnum>*{position:relative}
.vnum svg{width:38px;height:38px;fill:currentColor;opacity:.7}
.artwrap.turning .vnum{display:flex}
/* Save-to-library. A PLUS, not a heart, because Spotify's own apps stopped
   using a heart for this: the heart and "add to playlist" were merged into
   one + button, and a track already in your library shows a green
   CHECKMARK. Matching that means the panel and the phone in your pocket
   agree about what a saved track looks like, which is the whole job of an
   icon. It still adds to Liked Songs - only the mark changed.
   Sits in the control bar with the transport, the same kind of thing: the
   things you press about the track. A full 78px target, which is what is
   worth protecting on a panel tapped with wet hands. */
.savebtn{width:78px;height:78px;border-radius:50%;background:none;border:none;
  padding:0;display:flex;align-items:center;justify-content:center;
  color:var(--label);flex:none}
/* Transport. Filled glyphs rather than outlines: these are the smallest
   marks on the page and an outline triangle at this size reads as mush
   through spray. Same 78px target as everything else here. */
.tbtn2{width:78px;height:78px;border-radius:50%;background:none;border:none;
  padding:0;display:flex;align-items:center;justify-content:center;
  color:var(--ink-dim);flex:none}
.tbtn2 svg{width:40px;height:40px;fill:currentColor;
  transition:transform .12s,color .15s}
.tbtn2:active{color:var(--ink)}
.tbtn2:active svg{transform:scale(.84)}
#m-play svg{width:46px;height:46px}
/* 40 to match prev and next. Play is 46 because it is the primary
   action of the three; the save button matching THAT made two competing
   focal points in one row, and a filled disc already carries more weight
   than an outlined triangle at the same size. */
.savebtn svg{width:40px;height:40px;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linejoin:round;stroke-linecap:round;
  transition:transform .18s}
.savebtn circle{transition:fill .18s}
/* Saved: the disc fills and the mark is punched out of it in the page
   colour, which is how Spotify draws it. --stbd rather than a literal
   green so NIGHT mode still gets a red one - nothing on this panel is
   allowed to put white-green light in your eyes at 0200. */
.savebtn.on{color:var(--stbd)}
.savebtn.on circle{fill:currentColor}
.savebtn.on path{stroke:var(--bg)}
.savebtn:active svg{transform:scale(.85)}
/* While the poller is carrying it out. It is optimistic, so this is only
   ever brief - and if it fails the state comes back and says so. */
.savebtn.busy{opacity:.4}
/* The library answer never arrived - no scope, or the check is in its
   backoff. Dimmed rather than hidden: it is still pressable, and a press
   is the fastest way to find out, since a refusal names itself on the
   state line. */
.savebtn.unk{opacity:.42}
.art img{width:100%;height:100%;object-fit:cover}
.art svg{width:90px;height:90px}
/* line-height is set on every row of this page rather than left at
   `normal`. Poppins' normal metrics are about 1.5, which is right for
   running text and pure waste for single-line rows - and every pixel of
   it came out of the album art. Not so tight that descenders clip: the
   check for that is in the test, comparing each lane's scrollHeight
   against its clientHeight. */
.m-lbl{font-size:24px;font-weight:600;letter-spacing:.22em;color:var(--label);
  text-transform:uppercase;margin-bottom:10px;line-height:1.43}
.m-title{font-size:50px;font-weight:600;max-width:600px;text-align:center;
  white-space:nowrap;overflow:hidden;line-height:1.43}
.m-artist{font-size:34px;font-weight:500;color:var(--ink-dim);margin-top:6px;
  max-width:600px;white-space:nowrap;overflow:hidden;line-height:1.43}
/* --- long names scroll rather than truncate ---
   A title clipped to "Shipping Up To Bos..." is the one thing you cannot
   fix by looking harder, so it travels instead. The whole animation is
   ONE composited transform on one element - the same discipline the wind
   bezel uses, and the reason this costs nothing per frame: no rAF loop,
   no JS during the travel, only a measurement when the track changes.

   The dwell at each end is what makes it readable rather than restless:
   it holds for 12% of each pass so the start and the end of the name are
   both legible standing still. Speed is constant in px/s, so a very long
   name takes longer rather than whipping past. */
.m-title>span,.m-artist>span{display:inline-block;white-space:nowrap}
.mq>span{will-change:transform}
.m-bar{width:520px;height:12px;border-radius:6px;background:var(--chip);
  margin-top:22px;overflow:hidden}
.m-fill{height:100%;width:0;background:var(--accent);border-radius:6px}
.m-time{width:520px;display:flex;justify-content:space-between;margin-top:10px;
  font-size:22px;font-weight:600;color:var(--label);letter-spacing:.08em;
  line-height:1.43}
/* The second bar. Transport and the save button together, because they are
   the same kind of thing: the things you press about the track. */
.m-ctl{display:flex;align-items:center;justify-content:center;gap:22px;
  margin-top:12px}
/* Set apart from the three. At an equal gap it reads as a fourth
   transport button, and it is not one - those three move the music,
   this one changes your library. */
.m-ctl .savebtn{margin-left:14px}

/* --- instruments on the music panel ---------------------------------
   Wind ANGLE goes on the bezel rather than in a cell: it is an angular
   quantity and a ring reads it at a glance in a way a number cannot.
   The scalars - speed, wind speed, depth - stay as numbers below.    */
.m-bezel{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mb-tick{stroke:var(--label);opacity:.28}
.mb-tick.maj{opacity:.5}
#mb-wind{
  transform-box:view-box;transform-origin:540px 540px;
  /* The transition IS the animation - one composited property, no rAF
     loop. Duration is matched to the update period and the easing is
     LINEAR on purpose: a 0.7s ease restarted every 250ms never finished
     and reset its curve each time, so the wedge perpetually chased and
     the motion came out rubbery. Matched-and-linear means each segment
     lands exactly as the next begins, which is continuous motion.    */
  transition:transform .26s linear, opacity .35s;
  opacity:0}
#mb-wind.on{opacity:1}
.mb-wedge{fill:var(--accent)}
.mb-tail{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;opacity:.45}
#mb-wind.port .mb-wedge{fill:var(--port)}
#mb-wind.port .mb-tail{stroke:var(--port)}
#mb-wind.stbd .mb-wedge{fill:var(--stbd)}
#mb-wind.stbd .mb-tail{stroke:var(--stbd)}

/* One quiet row above the art. The instruments are context for the
   music here, not the subject - the dial proper is where you read them
   properly - so they sit small and stay out of the way.              */
/* The negative top margin and the matching addition below are a pair,
   and they cancel: the sheet's total height is unchanged, so the sheet -
   which is vertically centred - does not move, and neither does anything
   under the strip. Only the strip rises, into 28px of room that was
   doing nothing between it and the bezel at the rim. It buys clearance
   over the volume ring, whose topmost tick was 8px under it. */
.ms-head{display:flex;align-items:center;justify-content:center;gap:20px;
  min-height:40px;margin-top:-28px;margin-bottom:48px;line-height:1.43;
  font-size:22px;font-weight:600;letter-spacing:.1em;color:var(--label)}
.ms-head b{font-size:32px;font-weight:600;color:var(--ink);letter-spacing:0}
.ms-head i{width:2px;height:24px;background:var(--hairline);display:block;flex:none}

/* Above everything. This is the brightness control on hardware with no
   backlight to drive, so it has to behave like one and dim the whole
   screen - panel, alerts, lock and all. It sat on auto until the pages
   and the panel were given z-indexes, at which point it silently ended
   up underneath both and the slider stopped doing anything at all. */
#veil{position:absolute;inset:0;background:#000;opacity:0;
  pointer-events:none;transition:opacity .2s;z-index:90}

/* --- boot ---
   Sits UNDER the veil on purpose, so a panel set to 25% at night does
   not come up at full brightness and cost you your night vision. Above
   everything else, because until this clears there is nothing behind it
   worth seeing.

   It is in the document rather than built by script: it has to be on
   the glass on the first paint, which is before any of this file's
   JavaScript has run. */
#boot{position:absolute;inset:0;background:var(--bg);z-index:85;
  pointer-events:none;transition:opacity .45s ease}

/* Nothing under the splash may paint, not for one frame. z-index alone
   only settles what is on top ONCE both exist - it says nothing about a
   frame composited while the parser is still somewhere in the middle of
   this file, and the dial's markup comes first. This does not depend on
   paint timing at all: the stylesheet is applied before any body
   content renders, so from the very first frame everything but the
   splash is simply not visible.

   visibility, not display: the pages must still lay out and measure
   during init - layoutPages() reads their widths, drawBezelTicks() and
   getComputedTextLength() need real boxes. #veil is exempt so the
   brightness setting still dims the splash. */
#stage.booting > :not(#boot):not(#veil){visibility:hidden}
#boot.gone{opacity:0}
#boot.off{display:none}
#boot svg{display:block;width:100%;height:100%}
.bt-mark{font-size:82px;font-weight:var(--w-huge);fill:var(--ink);
  text-anchor:middle;letter-spacing:.2em}
.bt-sub{font-size:26px;font-weight:500;fill:var(--label);
  text-anchor:middle;letter-spacing:.44em}

/* Each current drifts on its own clock, so the three are never in phase
   and the water never resolves into a repeating loop. */
/* fill-box, or every scaleY here happens about the SVG origin instead of
   the wave's own centre - which collapses all three onto the top of the
   panel rather than onto each other. */
.bt-wave{transform-box:fill-box;transform-origin:center}
@keyframes bt-drift{ from{transform:translateX(0)} to{transform:translateX(-1080px)} }
.bt-drift{animation:bt-drift var(--dur) linear infinite}
.bt-w1{animation:bt-in .7s .10s both}
.bt-w2{animation:bt-in .7s .22s both}
.bt-w3{animation:bt-in .7s .34s both}
@keyframes bt-in{ from{opacity:0;transform:translateY(26px) scaleY(.4)}
                  to  {opacity:1;transform:translateY(0)    scaleY(1)} }
@keyframes bt-rise{ from{opacity:0;transform:translateY(20px)}
                    to  {opacity:1;transform:translateY(0)} }
.bt-mark-g{animation:bt-rise .8s .30s both}
.bt-sub-g {animation:bt-rise .8s .52s both}

/* The settle: all three collapse onto one line and the outer two
   retire, leaving a single accent rule. That is the word, animated -
   and it only runs once the boat is actually talking. */
#boot.settle .bt-wave{animation:bt-flat .95s cubic-bezier(.4,0,.2,1) forwards}
#boot.settle :is(.bt-w1,.bt-w3){animation:bt-flat .95s cubic-bezier(.4,0,.2,1) forwards,
                                          bt-go .95s forwards}
@keyframes bt-flat{ from{transform:translateY(0) scaleY(1)}
                    to  {transform:translateY(var(--to)) scaleY(.045)} }
@keyframes bt-go{ from{opacity:1} 55%{opacity:1} to{opacity:0} }

/* --- alerts ---
   600 px wide to match the sheets, and high enough that the circle is
   still wide there. Bordered rather than filled: an alarm should catch
   the eye without becoming the brightest thing on a night helm. */
#alert{position:absolute;left:50%;top:120px;transform:translateX(-50%);
  width:600px;border-radius:22px;padding:18px 26px;background:var(--chip);
  border:2px solid var(--warn);color:var(--ink);text-align:center;
  display:none;z-index:55}
#alert.on{display:block}
#alert.alarm{border-color:var(--alarm)}
.al-t{font-size:30px;font-weight:600;letter-spacing:.04em}
.al-s{font-size:19px;font-weight:600;letter-spacing:.14em;color:var(--label);
  margin-top:6px;text-transform:uppercase}

/* --- touch lock ---
   Paints nothing over the instruments. Its whole job is to swallow
   pointer events; the badge is a hint, not a screen. */
#lock{position:absolute;inset:0;z-index:70;display:none}
#lock.on{display:block}

/* The hold indicator: a ring round the whole bezel, over everything
   including the lock overlay. 2 x pi x 524 = 3292.4, which is where the
   dasharray comes from. */
#ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;
  z-index:80;opacity:0;transition:opacity .18s}
#ring.on{opacity:1}
#ring-c{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:540px 540px;
  stroke-dasharray:3292.4;stroke-dashoffset:3292.4}

/* A lock button at the foot of every page. Round, quiet, and the same
   size everywhere so it is muscle memory rather than a hunt. */
.lockbtn{display:flex;align-items:center;justify-content:center;
  width:78px;height:78px;border-radius:50%;background:none;border:none;
  padding:0;color:var(--label);font-family:var(--font)}
.lockbtn svg{width:36px;height:36px;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.lockbtn:active{color:var(--ink)}
.lockbtn.on{color:var(--accent)}
/* The same place on every page, just above the dots. The dial's copy is
   drawn in the SVG at the matching y - the face is a 1080 viewBox over a
   1080 stage, so the coordinates line up exactly. */
#m-lock,#t-lock{position:absolute;left:50%;bottom:91px;transform:translateX(-50%)}

/* the dial's lives in the SVG, so it scales with the face */
#dial-lock{color:var(--label)}
#dial-lock .lg{fill:none;stroke:var(--label);stroke-width:2;
  stroke-linejoin:round;stroke-linecap:round}
#dial-lock.on .lg{stroke:var(--accent)}

/* --- frame probe readout (CFG.fpsProbe) --- */
#fps{position:absolute;left:50%;top:118px;transform:translateX(-50%);
  background:#000;color:#3BE07A;font:600 26px/1 ui-monospace,monospace;
  padding:16px 22px;border-radius:12px;opacity:0;pointer-events:none;
  transition:opacity .2s;letter-spacing:.04em;z-index:99}
#fps.on{opacity:.93}
</style>
</head>
<body>
<script>
/* ------------------------------------------------------------------
   Palette, before the first paint.

   Everything else in this file runs from the bottom of <body>, which is
   after Chromium has had a chance to paint - so the panel came up in the
   DAY palette and snapped to dusk or night a moment later. At the end of
   a deliberately dark boot chain that white frame is the one thing you
   actually notice.

   The resolved theme is stored on every applyTheme(), so this is a
   restore rather than a calculation - no sun tables, no GPS, nothing
   that could be slow or throw. First boot ever has nothing stored and
   assumes dusk: of the two possible wrong guesses, a dark panel that
   brightens is the forgivable one.
   ------------------------------------------------------------------ */
const THEME_KEY='helmTheme';
let THEME_EFF='';
try{ THEME_EFF=localStorage.getItem(THEME_KEY)||''; }catch(e){}
if(['day','dusk','night'].indexOf(THEME_EFF)<0) THEME_EFF='dusk';
document.body.className = THEME_EFF==='day' ? '' : THEME_EFF;
</script>

<div id="stage" class="booting">
<!-- ============== BOOT ==============
     Three currents under the name, drifting until Signal K answers -
     then they collapse into one line and the panel is yours. The dial
     underneath spends that time with every reading empty, which is the
     gap this exists to cover.

     First child of #stage so it is parsed before anything it covers.
     That is belt; the braces are the .booting rule in the stylesheet,
     which is what actually guarantees nothing underneath can paint.
     Document order alone could not be shown to matter - see the README
     - so do not rely on it. -->
<div id="boot">
  <svg viewBox="0 0 1080 1080" aria-hidden="true">
    <g class="bt-mark-g"><text class="bt-mark" x="540" y="392">CONFLUENCE</text></g>
    <g class="bt-sub-g"><text class="bt-sub" x="540" y="462">HELM</text></g>
    <g clip-path="url(#bt-clip)">
      <!-- non-scaling-stroke: the settle squashes these to 4% height and
           a scaled stroke would vanish along with them. -->
      <g class="bt-wave bt-w1" style="--to:118px">
        <g class="bt-drift" style="--dur:7.5s"><path id="bt-p1" fill="none"
          stroke="var(--label)" stroke-width="7" stroke-linecap="round"
          vector-effect="non-scaling-stroke"/></g></g>
